<!DOCTYPE html>

<title>Nexus of Language</title>
<script>
  /* Set theme before paint to avoid a flash of the wrong colours. */
  (function () {
    try {
      var t = localStorage.getItem('nol_theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>

      <button class="chip-btn" id="profile-chip" aria-label="Profiel"></button>
      <button class="chip-btn" data-theme-toggle aria-label="Thema"></button>
    </div>
  </div>
  <div class="stats-line" id="stats-line"></div>

  <div id="sections"></div>
</div>
