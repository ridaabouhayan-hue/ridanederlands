<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les &middot; Nexus of Language</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('nol_theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="lesson-body">

<div class="lesson-topbar">
  <button class="lesson-close" id="lesson-close" title="Sluiten" aria-label="Sluiten">&times;</button>
  <div class="lesson-progress-track"><div class="lesson-progress-fill" id="progress-fill"></div></div>
  <div class="lesson-timer" id="lesson-timer">⏱ 0:00</div>
  <div class="lesson-hearts" id="lesson-hearts"></div>
  <button class="chip-btn" data-theme-toggle aria-label="Thema"></button>
</div>
<div class="lesson-caption" id="lesson-caption"></div>

<main class="lesson-main">
  <div id="lesson-root"></div>
</main>

<script src="data/course.js"></script>
<script src="js/grading.js"></script>
<script src="js/data-store.js"></script>
<script src="js/srs.js"></script>
<script src="js/audio.js"></script>
<script src="js/theme.js"></script>
<script src="js/exercises/multiple-choice.js"></script>
<script src="js/exercises/word-bank.js"></script>
<script src="js/exercises/typing.js"></script>
<script src="js/exercises/listening.js"></script>
<script src="js/lesson-player.js"></script>
</body>
</html>
