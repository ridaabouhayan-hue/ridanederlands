<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Chain · Onderwerpen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1629;
    --surface: #1a2240;
    --surface2: #222d4a;
    --border: #2d3a5c;
    --ink: #e8ecf4;
    --muted: #7889ab;
    --accent: #ff6b35;
    --c1: #e74c3c; --c1g: rgba(231,76,60,.15);
    --c2: #2e86ab; --c2g: rgba(46,134,171,.15);
    --c3: #f39c12; --c3g: rgba(243,156,18,.15);
    --c4: #27ae60; --c4g: rgba(39,174,96,.15);
    --c5: #9b59b6; --c5g: rgba(155,89,182,.15);
    --c6: #e67e22; --c6g: rgba(230,126,34,.15);
    --c7: #1abc9c; --c7g: rgba(26,188,156,.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px;
  }

  .header {
    text-align: center;
    padding: 20px 0 8px;
  }
  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.6em;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .header p {
    color: var(--muted);
    font-size: .85em;
    margin-top: 4px;
    font-weight: 700;
  }

  .lang-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 12px 0 16px;
  }
  .lang-bar button {
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 20px;
    font-family: inherit;
    font-weight: 800;
    font-size: .78em;
    cursor: pointer;
    transition: .25s;
  }
  .lang-bar button:hover { color: var(--ink); border-color: var(--accent); }
  .lang-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    max-width: 960px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    transition: .3s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 14px 14px 0 0;
  }
  .card:hover { transform: translateY(-3px); }

  .card-icon {
    font-size: 1.6em;
    margin-bottom: 4px;
    display: block;
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 1.05em;
    margin-bottom: 10px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    padding: 5px 11px;
    border-radius: 20px;
    font-size: .78em;
    font-weight: 700;
    border: 1.5px solid;
    transition: .2s;
    cursor: default;
    line-height: 1.2;
  }
  .chip:hover { transform: scale(1.06); }

  /* Color themes per card */
  .card.c1::before { background: var(--c1); }
  .card.c1 .card-title { color: var(--c1); }
  .card.c1 .chip { border-color: rgba(231,76,60,.35); background: var(--c1g); color: #f5a8a0; }

  .card.c2::before { background: var(--c2); }
  .card.c2 .card-title { color: var(--c2); }
  .card.c2 .chip { border-color: rgba(46,134,171,.35); background: var(--c2g); color: #7ec8e3; }

  .card.c3::before { background: var(--c3); }
  .card.c3 .card-title { color: var(--c3); }
  .card.c3 .chip { border-color: rgba(243,156,18,.35); background: var(--c3g); color: #f5cd6a; }

  .card.c4::before { background: var(--c4); }
  .card.c4 .card-title { color: var(--c4); }
  .card.c4 .chip { border-color: rgba(39,174,96,.35); background: var(--c4g); color: #7fd4a6; }

  .card.c5::before { background: var(--c5); }
  .card.c5 .card-title { color: var(--c5); }
  .card.c5 .chip { border-color: rgba(155,89,182,.35); background: var(--c5g); color: #c9a0dc; }

  .card.c6::before { background: var(--c6); }
  .card.c6 .card-title { color: var(--c6); }
  .card.c6 .chip { border-color: rgba(230,126,34,.35); background: var(--c6g); color: #f0b27a; }

  .card.c7::before { background: var(--c7); }
  .card.c7 .card-title { color: var(--c7); }
  .card.c7 .chip { border-color: rgba(26,188,156,.35); background: var(--c7g); color: #76d7c4; }

  .footer {
    text-align: center;
    margin-top: 20px;
    padding: 12px;
    color: var(--muted);
    font-size: .72em;
    font-weight: 700;
    letter-spacing: .05em;
  }

  @media print {
    body { background: #fff; color: #1a1a2e; padding: 10px; }
    .card { border: 1.5px solid #ddd; break-inside: avoid; }
    .card::before { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .chip { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .lang-bar { display: none; }
    .card:hover { transform: none; }
    .chip:hover { transform: none; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🔗 Question Chain — Onderwerpen</h1>
  <p id="subtitle">Kies een onderwerp en maak je eigen vraag!</p>
</div>

<div class="lang-bar">
  <button id="bNL" class="on" onclick="setL('nl')">🇳🇱 NL</button>
  <button id="bPL" onclick="setL('pl')">🇵🇱 PL</button>
  <button id="bEN" onclick="setL('en')">🇬🇧 EN</button>
</div>

<div class="grid" id="grid"></div>

<div class="footer">🔗 Question Chain · Inspiratiekaart · NT2</div>

<script>
const DATA = [
  {
    icon: '🍽️', cls: 'c1',
    title: { nl:'Eten & drinken', pl:'Jedzenie i picie', en:'Food & drinks' },
    items: {
      nl: ['ontbijt','lunch','avondeten','koffie / thee','water','brood','groenten','fruit','vlees / vis','snacks','restaurant','koken','boodschappen','lievelingseten','gezond eten'],
      pl: ['śniadanie','lunch','kolacja','kawa / herbata','woda','chleb','warzywa','owoce','mięso / ryba','przekąski','restauracja','gotowanie','zakupy','ulubione jedzenie','zdrowe jedzenie'],
      en: ['breakfast','lunch','dinner','coffee / tea','water','bread','vegetables','fruit','meat / fish','snacks','restaurant','cooking','groceries','favourite food','healthy food']
    }
  },
  {
    icon: '🏭', cls: 'c2',
    title: { nl:'Werk (Westport)', pl:'Praca (Westport)', en:'Work (Westport)' },
    items: {
      nl: ['werktijden','pauze','collega\'s','de baas','taken','werkkleding','de auto / fiets','salaris','vrije dagen','overwerk','vergadering','kantoor / hal','machines','schoonmaken','planning'],
      pl: ['godziny pracy','przerwa','współpracownicy','szef','zadania','ubranie robocze','samochód / rower','wynagrodzenie','dni wolne','nadgodziny','spotkanie','biuro / hala','maszyny','sprzątanie','planowanie'],
      en: ['work hours','break','colleagues','the boss','tasks','work clothes','car / bike','salary','days off','overtime','meeting','office / hall','machines','cleaning','planning']
    }
  },
  {
    icon: '👨‍👩‍👧‍👦', cls: 'c3',
    title: { nl:'Familie & mensen', pl:'Rodzina i ludzie', en:'Family & people' },
    items: {
      nl: ['kinderen','partner','ouders','broers / zussen','vrienden','buren','de dokter','de leraar','baby','opa / oma','neef / nicht','huisdier','samen wonen','trouwen','verjaardag'],
      pl: ['dzieci','partner','rodzice','rodzeństwo','przyjaciele','sąsiedzi','lekarz','nauczyciel','dziecko','dziadkowie','kuzyn / kuzynka','zwierzę','mieszkać razem','ślub','urodziny'],
      en: ['children','partner','parents','siblings','friends','neighbours','doctor','teacher','baby','grandparents','cousin','pet','living together','wedding','birthday']
    }
  },
  {
    icon: '📍', cls: 'c4',
    title: { nl:'Plaatsen & reizen', pl:'Miejsca i podróże', en:'Places & travel' },
    items: {
      nl: ['Nederland','Groningen','Polen','de supermarkt','het ziekenhuis','de school','het station','het park','de stad','de markt','het strand','het vliegveld','met de bus','met de fiets','op vakantie'],
      pl: ['Holandia','Groningen','Polska','supermarket','szpital','szkoła','dworzec','park','miasto','targ','plaża','lotnisko','autobusem','rowerem','na wakacjach'],
      en: ['the Netherlands','Groningen','Poland','supermarket','hospital','school','station','park','city','market','beach','airport','by bus','by bike','on holiday']
    }
  },
  {
    icon: '⏰', cls: 'c5',
    title: { nl:'Tijd & planning', pl:'Czas i planowanie', en:'Time & planning' },
    items: {
      nl: ['vandaag','morgen','gisteren','het weekend','maandag–zondag','de ochtend','de middag','de avond','een afspraak','een feestdag','Kerstmis','oud en nieuw','vakantie','schema','vroeg / laat'],
      pl: ['dzisiaj','jutro','wczoraj','weekend','poniedziałek–niedziela','rano','popołudnie','wieczór','spotkanie','święto','Boże Narodzenie','sylwester','wakacje','harmonogram','wcześnie / późno'],
      en: ['today','tomorrow','yesterday','the weekend','Monday–Sunday','the morning','the afternoon','the evening','an appointment','a holiday','Christmas','New Year','vacation','schedule','early / late']
    }
  },
  {
    icon: '⚽', cls: 'c6',
    title: { nl:'Hobby\'s & vrije tijd', pl:'Hobby i czas wolny', en:'Hobbies & free time' },
    items: {
      nl: ['voetbal','fietsen','winkelen','naar de film','gamen','lezen','wandelen','muziek','tv kijken','naar een feest','zwemmen','fitness','tekenen','dansen','niks doen'],
      pl: ['piłka nożna','jazda na rowerze','zakupy','kino','gry','czytanie','spacery','muzyka','oglądanie TV','impreza','pływanie','siłownia','rysowanie','taniec','nic nie robić'],
      en: ['football','cycling','shopping','cinema','gaming','reading','walking','music','watching TV','a party','swimming','fitness','drawing','dancing','doing nothing']
    }
  },
  {
    icon: '😊', cls: 'c7',
    title: { nl:'Gevoelens & meningen', pl:'Uczucia i opinie', en:'Feelings & opinions' },
    items: {
      nl: ['blij','boos','moe','ziek','honger / dorst','lekker / vies','mooi / lelijk','leuk / saai','moeilijk / makkelijk','duur / goedkoop','warm / koud','druk / rustig','bang','verliefd','tevreden'],
      pl: ['szczęśliwy','zły','zmęczony','chory','głód / pragnienie','smaczne / obrzydliwe','ładne / brzydkie','fajne / nudne','trudne / łatwe','drogie / tanie','ciepło / zimno','zajęty / spokojny','przestraszony','zakochany','zadowolony'],
      en: ['happy','angry','tired','sick','hungry / thirsty','tasty / gross','pretty / ugly','fun / boring','hard / easy','expensive / cheap','warm / cold','busy / quiet','scared','in love','satisfied']
    }
  }
];

let lang = 'nl';

function render() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  DATA.forEach(cat => {
    const c = document.createElement('div');
    c.className = 'card ' + cat.cls;
    c.innerHTML = `
      <span class="card-icon">${cat.icon}</span>
      <div class="card-title">${cat.title[lang]}</div>
      <div class="chips">
        ${cat.items[lang].map(i => `<span class="chip">${i}</span>`).join('')}
      </div>
    `;
    g.appendChild(c);
  });
}

function setL(l) {
  lang = l;
  document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('on'));
  document.getElementById('b' + l.toUpperCase()).classList.add('on');
  const subs = {
    nl: 'Kies een onderwerp en maak je eigen vraag!',
    pl: 'Wybierz temat i ułóż własne pytanie!',
    en: 'Pick a topic and make your own question!'
  };
  document.getElementById('subtitle').textContent = subs[l];
  render();
}

render();
</script>

<!-- SPEECH SYNTHESIS INJECTION -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    function speakNative(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'nl-NL';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }
    
    function createSpeakBtn(text) {
        let btn = document.createElement('button');
        btn.innerHTML = '🔊';
        btn.className = 'native-speak-btn';
        btn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:1.05rem;margin-left:6px;padding:0;transition:transform 0.2s;vertical-align:middle;outline:none;box-shadow:none;';
        btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); speakNative(text); };
        btn.onmouseover = () => btn.style.transform = 'scale(1.2)';
        btn.onmouseout = () => btn.style.transform = 'scale(1)';
        return btn;
    }

    // 1. .vocab spans
    document.querySelectorAll('.vocab').forEach(el => {
        if (!el.nextElementSibling || !el.nextElementSibling.classList.contains('native-speak-btn')) {
            el.parentNode.insertBefore(createSpeakBtn(el.textContent.trim()), el.nextSibling);
        }
    });

    // 2. Conjugation tables (.conj-table, .ww-tabel)
    document.querySelectorAll('.conj-table tbody tr, .ww-tabel tbody tr').forEach(row => {
        if (row.cells.length >= 2) {
            let targetCell = row.cells[1];
            // If the target cell already has a button, skip
            if (!targetCell.querySelector('.native-speak-btn') && !targetCell.querySelector('button')) {
                targetCell.appendChild(createSpeakBtn(targetCell.textContent.trim()));
            }
        }
    });

    // 3. Example sentences (.example)
    document.querySelectorAll('.example').forEach(el => {
        if (!el.querySelector('.native-speak-btn') && !el.querySelector('button')) {
            let clone = el.cloneNode(true);
            let transl = clone.querySelector('.transl');
            if (transl) transl.remove();
            let text = clone.textContent.replace(/\([^)]+\)/g, '').trim();
            el.appendChild(createSpeakBtn(text));
        }
    });
});
</script>
<!-- /SPEECH SYNTHESIS INJECTION -->

</body>
</html>
