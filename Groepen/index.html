<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toegang — Groepen</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pin-card {
            background: #1a1d27;
            border-radius: 24px;
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid #2a2d3e;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #e8eaf6;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 28px;
        }

        /* PIN DOTS */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #4a4a6a;
            background: transparent;
            transition: all 0.15s ease;
        }

        .dot.filled {
            background: #82b1ff;
            border-color: #82b1ff;
            box-shadow: 0 0 10px rgba(130,177,255,0.4);
        }

        .dot.error {
            background: #ef5350;
            border-color: #ef5350;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* NUMPAD */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key {
            background: #252836;
            border: none;
            border-radius: 14px;
            padding: 18px 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #e8eaf6;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #2e3147;
        }

        .key:hover { background: #2e3147; transform: scale(1.04); }
        .key:active { transform: scale(0.96); background: #3a3d56; }

        .key.empty { background: transparent; border: none; cursor: default; pointer-events: none; }

        .key.del {
            font-size: 1.1rem;
            color: #9fa8da;
        }

        .error-msg {
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ef9a9a;
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-msg.show { opacity: 1; }
    </style>
</head>
<body>

<div class="pin-card">
    <div class="lock-icon">🔐</div>
    <h1>Beveiligde toegang</h1>
    <p class="subtitle">Voer de 4-cijferige code in</p>

    <div class="pin-dots">
        <div class="dot" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
    </div>

    <div class="numpad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key del" onclick="del()">⌫</button>
    </div>

    <div class="error-msg" id="errMsg">Onjuiste code — probeer opnieuw</div>
</div>

<script>
    // ── VERANDER HIER JE PIN ──────────────────
    const CORRECT_PIN = '1234';
    // ─────────────────────────────────────────

    let entered = '';

    function press(digit) {
        if (entered.length >= 4) return;
        entered += digit;
        updateDots();
        if (entered.length === 4) checkPin();
    }

    function del() {
        entered = entered.slice(0, -1);
        updateDots();
    }

    function updateDots() {
        for (let i = 0; i < 4; i++) {
            const dot = document.getElementById('d' + i);
            dot.classList.toggle('filled', i < entered.length);
            dot.classList.remove('error');
        }
        document.getElementById('errMsg').classList.remove('show');
    }

    function checkPin() {
        if (entered === CORRECT_PIN) {
            // Sla sessie op en ga naar dashboard (geen terugknop mogelijk)
            sessionStorage.setItem('groepen_auth', '1');
            window.location.replace('dashboard.html');
        } else {
            // Fout — animeer en reset
            for (let i = 0; i < 4; i++) {
                document.getElementById('d' + i).classList.add('error');
            }
            document.getElementById('errMsg').classList.add('show');
            setTimeout(() => {
                entered = '';
                updateDots();
            }, 700);
        }
    }

    // Toetsenbord ondersteuning
    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') press(e.key);
        if (e.key === 'Backspace') del();
    });
</script>

</body>
</html>
