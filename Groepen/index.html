<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toegang — Groepen</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pin-card {
            background: #1a1d27;
            border-radius: 24px;
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid #2a2d3e;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #e8eaf6;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 28px;
        }

        /* PIN INPUT */
        .pin-input-container {
            margin-bottom: 20px;
        }

        .pin-input {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #e8eaf6;
            background: #252836;
            border: 2px solid #4a4a6a;
            border-radius: 12px;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.2s;
            outline: none;
        }

        .pin-input:focus {
            border-color: #82b1ff;
            box-shadow: 0 0 10px rgba(130,177,255,0.2);
        }

        .pin-input.error {
            border-color: #ef5350;
            animation: shake 0.4s ease;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            background: #4361ee;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #3a56d4;
            transform: translateY(-2px);
        }

        .error-msg {
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ef9a9a;
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-msg.show { opacity: 1; }
    </style>
</head>
<body>

<div class="pin-card">
    <div class="lock-icon">🔐</div>
    <h1>Beveiligde toegang</h1>
    <p class="subtitle">Voer de 4-cijferige code in</p>

    <div class="pin-input-container">
        <input type="password" id="pinInput" class="pin-input" placeholder="••••" autocomplete="off" autofocus>
    </div>
    <button class="btn-submit" onclick="checkPin()">Inloggen</button>

    <div class="error-msg" id="errMsg">Onjuiste code — probeer opnieuw</div>
</div>

<script>
    function checkPin() {
        const pinInput = document.getElementById('pinInput');
        const entered = pinInput.value.trim().toLowerCase();

        if (entered === '1234') {
            sessionStorage.setItem('groepen_auth', '1');
            window.location.replace('dashboard.html');
        } else if (entered === 'qwerty') {
            sessionStorage.setItem('transcripts_auth', '1');
            window.location.replace('transcripts.html');
        } else {
            // Fout — animeer en reset
            pinInput.classList.add('error');
            document.getElementById('errMsg').classList.add('show');
            setTimeout(() => {
                pinInput.classList.remove('error');
                pinInput.value = '';
                pinInput.focus();
                document.getElementById('errMsg').classList.remove('show');
            }, 700);
        }
    }

    // Enter toets ondersteuning
    document.getElementById('pinInput').addEventListener('keydown', (e) => {
        document.getElementById('errMsg').classList.remove('show');
        if (e.key === 'Enter') checkPin();
    });
</script>


<!-- SPEECH SYNTHESIS INJECTION -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    function speakNative(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'nl-NL';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }
    
    function createSpeakBtn(text) {
        let btn = document.createElement('button');
        btn.innerHTML = '🔊';
        btn.className = 'native-speak-btn';
        btn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:1.05rem;margin-left:6px;padding:0;transition:transform 0.2s;vertical-align:middle;outline:none;box-shadow:none;';
        btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); speakNative(text); };
        btn.onmouseover = () => btn.style.transform = 'scale(1.2)';
        btn.onmouseout = () => btn.style.transform = 'scale(1)';
        return btn;
    }

    // 1. .vocab spans
    document.querySelectorAll('.vocab').forEach(el => {
        if (!el.nextElementSibling || !el.nextElementSibling.classList.contains('native-speak-btn')) {
            el.parentNode.insertBefore(createSpeakBtn(el.textContent.trim()), el.nextSibling);
        }
    });

    // 2. Conjugation tables (.conj-table, .ww-tabel)
    document.querySelectorAll('.conj-table tbody tr, .ww-tabel tbody tr').forEach(row => {
        if (row.cells.length >= 2) {
            let targetCell = row.cells[1];
            // If the target cell already has a button, skip
            if (!targetCell.querySelector('.native-speak-btn') && !targetCell.querySelector('button')) {
                targetCell.appendChild(createSpeakBtn(targetCell.textContent.trim()));
            }
        }
    });

    // 3. Example sentences (.example)
    document.querySelectorAll('.example').forEach(el => {
        if (!el.querySelector('.native-speak-btn') && !el.querySelector('button')) {
            let clone = el.cloneNode(true);
            let transl = clone.querySelector('.transl');
            if (transl) transl.remove();
            let text = clone.textContent.replace(/\([^)]+\)/g, '').trim();
            el.appendChild(createSpeakBtn(text));
        }
    });
});
</script>
<!-- /SPEECH SYNTHESIS INJECTION -->


<!-- PROGRESS INJECTION -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('a').forEach(a => {
        try {
            let href = a.getAttribute('href');
            if (href && !href.startsWith('http')) {
                let filename = href.split('/').pop();
                if (localStorage.getItem('completed_' + filename) === 'true') {
                    a.innerHTML += ' <span style="font-size:0.95rem;margin-left:6px;" title="Voltooid">✅</span>';
                }
            }
        } catch(e){}
    });
});
</script>
<!-- /PROGRESS INJECTION -->

</body>
</html>
