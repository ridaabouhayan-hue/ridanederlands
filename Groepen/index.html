<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toegang — Groepen</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pin-card {
            background: #1a1d27;
            border-radius: 24px;
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid #2a2d3e;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #e8eaf6;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 28px;
        }

        /* PIN INPUT */
        .pin-input-container {
            margin-bottom: 20px;
        }

        .pin-input {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #e8eaf6;
            background: #252836;
            border: 2px solid #4a4a6a;
            border-radius: 12px;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.2s;
            outline: none;
        }

        .pin-input:focus {
            border-color: #82b1ff;
            box-shadow: 0 0 10px rgba(130,177,255,0.2);
        }

        .pin-input.error {
            border-color: #ef5350;
            animation: shake 0.4s ease;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            background: #4361ee;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #3a56d4;
            transform: translateY(-2px);
        }

        .error-msg {
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ef9a9a;
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-msg.show { opacity: 1; }
    </style>
</head>
<body>

<div class="pin-card">
    <div class="lock-icon">🔐</div>
    <h1>Beveiligde toegang</h1>
    <p class="subtitle">Voer de 4-cijferige code in</p>

    <div class="pin-input-container">
        <input type="password" id="pinInput" class="pin-input" placeholder="••••" autocomplete="off" autofocus>
    </div>
    <button class="btn-submit" onclick="checkPin()">Inloggen</button>

    <div class="error-msg" id="errMsg">Onjuiste code — probeer opnieuw</div>
</div>

<script>
    // ── VERANDER HIER JE PIN ──────────────────
    const CORRECT_PIN = '1234';
    // ─────────────────────────────────────────

    function checkPin() {
        const pinInput = document.getElementById('pinInput');
        const entered = pinInput.value;

        if (entered === CORRECT_PIN) {
            // Sla sessie op en ga naar dashboard (geen terugknop mogelijk)
            sessionStorage.setItem('groepen_auth', '1');
            window.location.replace('dashboard.html');
        } else {
            // Fout — animeer en reset
            pinInput.classList.add('error');
            document.getElementById('errMsg').classList.add('show');
            setTimeout(() => {
                pinInput.classList.remove('error');
                pinInput.value = '';
                pinInput.focus();
                document.getElementById('errMsg').classList.remove('show');
            }, 700);
        }
    }

    // Enter toets ondersteuning
    document.getElementById('pinInput').addEventListener('keydown', (e) => {
        document.getElementById('errMsg').classList.remove('show');
        if (e.key === 'Enter') checkPin();
    });
</script>

</body>
</html>
