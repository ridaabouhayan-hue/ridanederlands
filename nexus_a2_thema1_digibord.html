null, "explanation": ""}, {"slide_index": 35, "cat": "§1.15 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 36, "cat": "§1.15 · OEFENING 29", "type": "writing-prompt", "prompt": "Vergelijk je woning met een vorige woning. Schrijf drie zinnen met dan, en gebruik één keer beter of meer.", "options": [], "answer": null, "explanation": ""}]}, "1.2": {"code": "1.2", "title": "Zinnen maken", "total_slides": 37, "slides": [{"type": "title_card", "cat": "§1.2 · INTRO", "title": "A2 Thema 1: Verhuizen — §1.2", "subtitle": "Zinnen maken", "concepts": ["hoofdzin-svo"]}, {"type": "explanation_nl", "cat": "§1.2 · GRAMMATICA", "title": "De hoofdzin: het werkwoord op plek 2", "content_html": "<div class=\"uitleg-box\">\n<h3>🧩 Wie - werkwoord - rest</h3>\n<p>In een gewone zin staat het werkwoord op de <strong>tweede plaats</strong>.</p>\n<table>\n<tr><th>1 · wie</th><th>2 · werkwoord</th><th>3 · rest</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>woon</strong></bdi></td><td><bdi dir=\"ltr\">in een flat.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">De buurman</bdi></td><td><bdi dir=\"ltr\"><strong>helpt</strong></bdi></td><td><bdi dir=\"ltr\">met de doos.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Wij</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td><td><bdi dir=\"ltr\">koffie.</bdi></td></tr>\n</table>\n</div>\n<div class=\"uitleg-box\">\n<h3>Twee werkwoorden?</h3>\n<ul>\n<li>De <strong>persoonsvorm</strong> blijft op plek 2.</li>\n<li>Het andere werkwoord gaat <strong>helemaal achteraan</strong>.</li>\n</ul>\n<table>\n<tr><th>1</th><th>2</th><th>3</th><th>eind</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>wil</strong></bdi></td><td><bdi dir=\"ltr\">koffie</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Zij</bdi></td><td><bdi dir=\"ltr\"><strong>gaat</strong></bdi></td><td><bdi dir=\"ltr\">morgen</bdi></td><td><bdi dir=\"ltr\"><strong>verhuizen</strong></bdi></td></tr>\n</table>\n</div>"}, {"type": "explanation_trans_en", "cat": "§1.2 · UITLEG (EN)", "title": "Vertaling (Engels)", "content_html": "<div class=\"uitleg-box\">\n<h3>🧩 Who - verb - rest</h3>\n<p>In a normal sentence the verb is in <strong>second position</strong>.</p>\n<table>\n<tr><th>1 · who</th><th>2 · verb</th><th>3 · rest</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>woon</strong></bdi></td><td><bdi dir=\"ltr\">in een flat.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">De buurman</bdi></td><td><bdi dir=\"ltr\"><strong>helpt</strong></bdi></td><td><bdi dir=\"ltr\">met de doos.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Wij</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td><td><bdi dir=\"ltr\">koffie.</bdi></td></tr>\n</table>\n</div>\n<div class=\"uitleg-box\">\n<h3>Two verbs?</h3>\n<ul>\n<li>The <strong>finite verb</strong> stays in position 2.</li>\n<li>The other verb goes <strong>to the very end</strong>.</li>\n</ul>\n<table>\n<tr><th>1</th><th>2</th><th>3</th><th>end</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>wil</strong></bdi></td><td><bdi dir=\"ltr\">koffie</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Zij</bdi></td><td><bdi dir=\"ltr\"><strong>gaat</strong></bdi></td><td><bdi dir=\"ltr\">morgen</bdi></td><td><bdi dir=\"ltr\"><strong>verhuizen</strong></bdi></td></tr>\n</table>\n</div>"}, {"type": "explanation_trans_tr", "cat": "§1.2 · UITLEG (TR)", "title": "Vertaling (Turks)", "content_html": "<div class=\"uitleg-box\">\n<h3>🧩 Kim - fiil - geri kalan</h3>\n<p>Normal bir cümlede fiil <strong>ikinci sırada</strong> gelir.</p>\n<table>\n<tr><th>1 · kim</th><th>2 · fiil</th><th>3 · geri kalan</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>woon</strong></bdi></td><td><bdi dir=\"ltr\">in een flat.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">De buurman</bdi></td><td><bdi dir=\"ltr\"><strong>helpt</strong></bdi></td><td><bdi dir=\"ltr\">met de doos.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Wij</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td><td><bdi dir=\"ltr\">koffie.</bdi></td></tr>\n</table>\n</div>\n<div class=\"uitleg-box\">\n<h3>İki fiil mi var?</h3>\n<ul>\n<li><strong>Çekimli fiil</strong> 2. sırada kalır.</li>\n<li>Diğer fiil <strong>en sona</strong> gider.</li>\n</ul>\n<table>\n<tr><th>1</th><th>2</th><th>3</th><th>son</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>wil</strong></bdi></td><td><bdi dir=\"ltr\">koffie</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Zij</bdi></td><td><bdi dir=\"ltr\"><strong>gaat</strong></bdi></td><td><bdi dir=\"ltr\">morgen</bdi></td><td><bdi dir=\"ltr\"><strong>verhuizen</strong></bdi></td></tr>\n</table>\n</div>"}, {"type": "explanation_trans_ar", "cat": "§1.2 · UITLEG (AR)", "title": "Vertaling (Arabisch)", "content_html": "<div class=\"uitleg-box\">\n<h3>🧩 مَن - الفعل - الباقي</h3>\n<p>في الجملة العادية يأتي الفعل في <strong>المركز الثاني</strong>.</p>\n<table>\n<tr><th>1 · مَن</th><th>2 · الفعل</th><th>3 · الباقي</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>woon</strong></bdi></td><td><bdi dir=\"ltr\">in een flat.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">De buurman</bdi></td><td><bdi dir=\"ltr\"><strong>helpt</strong></bdi></td><td><bdi dir=\"ltr\">met de doos.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Wij</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td><td><bdi dir=\"ltr\">koffie.</bdi></td></tr>\n</table>\n</div>\n<div class=\"uitleg-box\">\n<h3>هل هناك فعلان؟</h3>\n<ul>\n<li><strong>الفعل المُصرَّف</strong> يبقى في المركز الثاني.</li>\n<li>الفعل الآخر يذهب <strong>إلى آخر الجملة</strong>.</li>\n</ul>\n<table>\n<tr><th>1</th><th>2</th><th>3</th><th>النهاية</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>wil</strong></bdi></td><td><bdi dir=\"ltr\">koffie</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Zij</bdi></td><td><bdi dir=\"ltr\"><strong>gaat</strong></bdi></td><td><bdi dir=\"ltr\">morgen</bdi></td><td><bdi dir=\"ltr\"><strong>verhuizen</strong></bdi></td></tr>\n</table>\n</div>"}, {"type": "explanation_trans_pt", "cat": "§1.2 · UITLEG (PT)", "title": "Vertaling (Portugees)", "content_html": "<div class=\"uitleg-box\">\n<h3>🧩 Quem - verbo - resto</h3>\n<p>Numa frase normal, o verbo fica na <strong>segunda posição</strong>.</p>\n<table>\n<tr><th>1 · quem</th><th>2 · verbo</th><th>3 · resto</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>woon</strong></bdi></td><td><bdi dir=\"ltr\">in een flat.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">De buurman</bdi></td><td><bdi dir=\"ltr\"><strong>helpt</strong></bdi></td><td><bdi dir=\"ltr\">met de doos.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Wij</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td><td><bdi dir=\"ltr\">koffie.</bdi></td></tr>\n</table>\n</div>\n<div class=\"uitleg-box\">\n<h3>Dois verbos?</h3>\n<ul>\n<li>O <strong>verbo conjugado</strong> fica na posição 2.</li>\n<li>O outro verbo vai <strong>para o fim</strong>.</li>\n</ul>\n<table>\n<tr><th>1</th><th>2</th><th>3</th><th>fim</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>wil</strong></bdi></td><td><bdi dir=\"ltr\">koffie</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Zij</bdi></td><td><bdi dir=\"ltr\"><strong>gaat</strong></bdi></td><td><bdi dir=\"ltr\">morgen</bdi></td><td><bdi dir=\"ltr\"><strong>verhuizen</strong></bdi></td></tr>\n</table>\n</div>"}, {"type": "explanation_trans_om", "cat": "§1.2 · UITLEG (OM)", "title": "Vertaling (Oromo)", "content_html": "<div class=\"uitleg-box\">\n<h3>🧩 Eenyu - xumura - hafe</h3>\n<p>Hima idilee keessatti xumurri (verb) <strong>iddoo lammaffaa</strong> irra jira.</p>\n<table>\n<tr><th>1 · eenyu</th><th>2 · xumura</th><th>3 · hafe</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>woon</strong></bdi></td><td><bdi dir=\"ltr\">in een flat.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">De buurman</bdi></td><td><bdi dir=\"ltr\"><strong>helpt</strong></bdi></td><td><bdi dir=\"ltr\">met de doos.</bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Wij</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td><td><bdi dir=\"ltr\">koffie.</bdi></td></tr>\n</table>\n</div>\n<div class=\"uitleg-box\">\n<h3>Xumura lama?</h3>\n<ul>\n<li><strong>Xumurri hiikame</strong> iddoo 2 irra hafa.</li>\n<li>Xumurri kaan <strong>dhuma</strong> irra dhaqa.</li>\n</ul>\n<table>\n<tr><th>1</th><th>2</th><th>3</th><th>dhuma</th></tr>\n<tr><td><bdi dir=\"ltr\">Ik</bdi></td><td><bdi dir=\"ltr\"><strong>wil</strong></bdi></td><td><bdi dir=\"ltr\">koffie</bdi></td><td><bdi dir=\"ltr\"><strong>drinken</strong></bdi></td></tr>\n<tr><td><bdi dir=\"ltr\">Zij</bdi></td><td><bdi dir=\"ltr\"><strong>gaat</strong></bdi></td><td><bdi dir=\"ltr\">morgen</bdi></td><td><bdi dir=\"ltr\"><strong>verhuizen</strong></bdi></td></tr>\n</table>\n</div>"}, {"slide_index": 8, "cat": "§1.2 · OEFENING 1", "type": "word_bank", "prompt": "", "options": ["De", "buurman", "helpt", "mij", "met", "de", "zware", "doos"], "answer": "De buurman helpt mij met de zware doos.", "explanation": "Wie staat vooraan, het werkwoord op plek 2, de rest erachter."}, {"slide_index": 9, "cat": "§1.2 · OEFENING 2", "type": "word_bank", "prompt": "", "options": ["Wij", "drinken", "elke", "ochtend", "koffie", "in", "de", "keuken"], "answer": "Wij drinken elke ochtend koffie in de keuken.", "explanation": "Het werkwoord staat op plek 2, ook als de zin lang is."}, {"slide_index": 10, "cat": "§1.2 · OEFENING 3", "type": "word_bank", "prompt": "", "options": ["Morgen", "leen", "ik", "een", "hamer", "van", "de", "buurvrouw"], "answer": "Morgen leen ik een hamer van de buurvrouw.", "explanation": "Staat er iets anders vooraan, dan komt het werkwoord nog steeds op plek 2 en het onderwerp erachter."}, {"slide_index": 11, "cat": "§1.2 · OEFENING 4", "type": "word_bank", "prompt": "", "options": ["Ik", "wil", "vanavond", "mijn", "nieuwe", "buren", "ontmoeten"], "answer": "Ik wil vanavond mijn nieuwe buren ontmoeten.", "explanation": "Twee werkwoorden: wil op plek 2, ontmoeten helemaal achteraan."}, {"slide_index": 12, "cat": "§1.2 · OEFENING 5", "type": "word_bank", "prompt": "", "options": ["Onze", "jongste", "is", "vorige", "week", "geboren"], "answer": "Onze jongste is vorige week geboren.", "explanation": "Is staat op plek 2; geboren sluit de zin af."}, {"slide_index": 13, "cat": "§1.2 · OEFENING 6", "type": "word_bank", "prompt": "", "options": ["In", "de", "tuin", "staat", "een", "grote", "tafel"], "answer": "In de tuin staat een grote tafel.", "explanation": "In de tuin is plek 1, dus staat komt op plek 2 en de tafel erachter."}, {"slide_index": 14, "cat": "§1.2 · OEFENING 7", "type": "word_bank", "prompt": "", "options": ["Je", "moet", "die", "doos", "naar", "boven", "dragen"], "answer": "Je moet die doos naar boven dragen.", "explanation": "Moet op plek 2, dragen achteraan."}, {"slide_index": 15, "cat": "§1.2 · OEFENING 8", "type": "word_bank", "prompt": "", "options": ["Vandaag", "ontmoet", "ik", "de", "vrouw", "van", "nummer", "zes"], "answer": "Vandaag ontmoet ik de vrouw van nummer zes.", "explanation": "Vandaag vooraan, dus het werkwoord vóór het onderwerp."}, {"slide_index": 16, "cat": "§1.2 · OEFENING 9", "type": "word_bank", "prompt": "", "options": ["Wij", "kunnen", "jullie", "met", "de", "kast", "helpen"], "answer": "Wij kunnen jullie met de kast helpen.", "explanation": "Kunnen op plek 2, helpen achteraan."}, {"slide_index": 17, "cat": "§1.2 · OEFENING 10", "type": "word_bank", "prompt": "", "options": ["Na", "het", "eten", "gaan", "wij", "de", "dozen", "uitpakken"], "answer": "Na het eten gaan wij de dozen uitpakken.", "explanation": "Na het eten is plek 1; gaan volgt meteen, uitpakken sluit af."}, {"slide_index": 18, "cat": "§1.2 · OEFENING 11", "type": "cloze", "prompt": "Ik wil vanavond mijn nieuwe buren ……… .", "options": ["ontmoeten", "ontmoet", "ontmoette"], "answer": "ontmoeten", "explanation": "Na wil komt het hele werkwoord, en dat staat achteraan."}, {"slide_index": 19, "cat": "§1.2 · OEFENING 12", "type": "cloze", "prompt": "Wij gaan volgende maand naar Utrecht ……… .", "options": ["verhuist", "verhuizen", "verhuisde"], "answer": "verhuizen", "explanation": "Na gaan komt het hele werkwoord."}, {"slide_index": 20, "cat": "§1.2 · OEFENING 13", "type": "cloze", "prompt": "Mag ik jouw hamer even ……… ?", "options": ["lenen", "leent", "leende"], "answer": "lenen", "explanation": "Na mag komt het hele werkwoord, helemaal achteraan."}, {"slide_index": 21, "cat": "§1.2 · OEFENING 14", "type": "cloze", "prompt": "Je moet die zware doos samen ……… .", "options": ["draagt", "droeg", "dragen"], "answer": "dragen", "explanation": "Na moet komt het hele werkwoord."}, {"slide_index": 22, "cat": "§1.2 · OEFENING 15", "type": "cloze", "prompt": "Morgen ……… ik met de trein naar mijn zus. *(gaan)*", "options": ["ga", "gaat", "gaan"], "answer": "ga", "explanation": "Morgen staat vooraan, dus daarna komt het werkwoord en pas dan ik."}, {"slide_index": 23, "cat": "§1.2 · OEFENING 16", "type": "cloze", "prompt": "In de tuin ……… twee grote bomen.", "options": ["staat", "staan", "sta"], "answer": "staan", "explanation": "Twee bomen is meervoud, dus staan."}, {"slide_index": 24, "cat": "§1.2 · OEFENING 17", "type": "cloze", "prompt": "Mijn buurvrouw ……… mij vaak met de boodschappen. *(helpen)*", "options": ["helpt", "helpen", "help"], "answer": "helpt", "explanation": "Mijn buurvrouw is één persoon, dus stam plus t."}, {"slide_index": 25, "cat": "§1.2 · OEFENING 18", "type": "cloze", "prompt": "Zij 👥 ……… morgen hun oude bank weg.", "options": ["brengt", "breng", "brengen"], "answer": "brengen", "explanation": "Zij is hier meer mensen, dus het hele werkwoord."}, {"slide_index": 26, "cat": "§1.2 · OEFENING 19", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Morgen ik ga naar de nieuwe flat.", "Morgen ga ik naar de nieuwe flat.", "Ga morgen ik naar de nieuwe flat."], "answer": 1, "explanation": "Morgen is plek 1, dus het werkwoord komt op plek 2 en ik erachter."}, {"slide_index": 27, "cat": "§1.2 · OEFENING 20", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Ik wil lenen een hamer.", "Ik een hamer wil lenen.", "Ik wil een hamer lenen."], "answer": 2, "explanation": "Wil staat op plek 2, lenen helemaal achteraan."}, {"slide_index": 28, "cat": "§1.2 · OEFENING 21", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["In de tuin een tafel staat.", "In de tuin staat een tafel.", "Een tafel in de tuin staat."], "answer": 1, "explanation": "Na een bepaling vooraan komt eerst het werkwoord, dan het onderwerp."}, {"slide_index": 29, "cat": "§1.2 · OEFENING 22", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Zij verhuizen gaat volgende maand.", "Zij volgende maand gaat verhuizen.", "Zij gaat volgende maand verhuizen."], "answer": 2, "explanation": "Gaat op plek 2, verhuizen achteraan."}, {"slide_index": 30, "cat": "§1.2 · OEFENING 23", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Zoek zelf waar een zin ophoudt: hoofdletter vooraan, punt aan het eind."}, {"slide_index": 31, "cat": "§1.2 · OEFENING 24", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Drie zinnen, elk met het werkwoord op plek 2."}, {"slide_index": 32, "cat": "§1.2 · OEFENING 25", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 33, "cat": "§1.2 · OEFENING 26", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 34, "cat": "§1.2 · OEFENING 27", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 35, "cat": "§1.2 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 36, "cat": "§1.2 · OEFENING 29", "type": "writing-prompt", "prompt": "Schrijf drie zinnen over je eigen huis. Begin één zin met een tijd, bijvoorbeeld 'Morgen ...' of 'In de zomer ...'.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 37, "cat": "§1.2 · OEFENING 30", "type": "writing-prompt", "prompt": "Wat ga je dit weekend doen? Schrijf twee zinnen met twee werkwoorden, bijvoorbeeld 'Ik wil ...' of 'Ik moet ...'.", "options": [], "answer": null, "explanation": ""}]}, "1.3": {"code": "1.3", "title": "Dit is mijn familie.", "total_slides": 37, "slides": [{"type": "title_card", "cat": "§1.3 · INTRO", "title": "A2 Thema 1: Verhuizen — §1.3", "subtitle": "Dit is mijn familie.", "concepts": ["aanwijzende-voornaamwoorden"]}, {"type": "explanation_nl", "cat": "§1.3 · GRAMMATICA", "title": "Dit, dat, deze, die", "content_html": "<div class=\"uitleg-box\"><h3>👉 Dichtbij of veraf?</h3><ul><li><strong>dit / deze</strong> = dichtbij (hier).</li><li><strong>dat / die</strong> = veraf (daar).</li></ul><table><tr><th></th><th>dichtbij</th><th>veraf</th></tr><tr><td>1 ding</td><td><bdi dir=\"ltr\"><strong>dit</strong> is mijn broer</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> is mijn broer</bdi></td></tr><tr><td>meer dingen</td><td><bdi dir=\"ltr\"><strong>dit</strong> zijn mijn ouders</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> zijn mijn ouders</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>Is of zijn?</h3><ul><li>Eén ding of persoon &rarr; <strong>dit is</strong> / <strong>dat is</strong>.</li><li>Meer dan één &rarr; <strong>dit zijn</strong> / <strong>dat zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Dit is</strong> mijn huis.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Dit zijn</strong> mijn buren.</bdi></p></div><div class=\"uitleg-box\"><h3>Bij een woord: deze of die</h3><p>Wijs je een woord aan? Gebruik <strong>deze</strong> (dichtbij) of <strong>die</strong> (veraf).</p><p><bdi dir=\"ltr\"><strong>deze</strong> sleutel</bdi> &nbsp; <bdi dir=\"ltr\"><strong>die</strong> doos</bdi></p></div>"}, {"type": "explanation_trans_en", "cat": "§1.3 · UITLEG (EN)", "title": "Vertaling (Engels)", "content_html": "<div class=\"uitleg-box\"><h3>👉 Nearby or far away?</h3><ul><li><strong>dit / deze</strong> = nearby (here).</li><li><strong>dat / die</strong> = far away (there).</li></ul><table><tr><th></th><th>nearby</th><th>far</th></tr><tr><td>1 thing</td><td><bdi dir=\"ltr\"><strong>dit</strong> is mijn broer</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> is mijn broer</bdi></td></tr><tr><td>more things</td><td><bdi dir=\"ltr\"><strong>dit</strong> zijn mijn ouders</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> zijn mijn ouders</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>Is or zijn?</h3><ul><li>One thing or person &rarr; <strong>dit is</strong> / <strong>dat is</strong>.</li><li>More than one &rarr; <strong>dit zijn</strong> / <strong>dat zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Dit is</strong> mijn huis.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Dit zijn</strong> mijn buren.</bdi></p></div><div class=\"uitleg-box\"><h3>With a noun: deze or die</h3><p>Pointing at a noun? Use <strong>deze</strong> (nearby) or <strong>die</strong> (far).</p><p><bdi dir=\"ltr\"><strong>deze</strong> sleutel</bdi> &nbsp; <bdi dir=\"ltr\"><strong>die</strong> doos</bdi></p></div>"}, {"type": "explanation_trans_tr", "cat": "§1.3 · UITLEG (TR)", "title": "Vertaling (Turks)", "content_html": "<div class=\"uitleg-box\"><h3>👉 Yakında mı, uzakta mı?</h3><ul><li><strong>dit / deze</strong> = yakında (burada).</li><li><strong>dat / die</strong> = uzakta (orada).</li></ul><table><tr><th></th><th>yakında</th><th>uzakta</th></tr><tr><td>1 şey</td><td><bdi dir=\"ltr\"><strong>dit</strong> is mijn broer</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> is mijn broer</bdi></td></tr><tr><td>birden fazla</td><td><bdi dir=\"ltr\"><strong>dit</strong> zijn mijn ouders</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> zijn mijn ouders</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>Is mı zijn mi?</h3><ul><li>Bir şey veya kişi &rarr; <strong>dit is</strong> / <strong>dat is</strong>.</li><li>Birden fazla &rarr; <strong>dit zijn</strong> / <strong>dat zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Dit is</strong> mijn huis.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Dit zijn</strong> mijn buren.</bdi></p></div><div class=\"uitleg-box\"><h3>Bir isimle: deze veya die</h3><p>Bir ismi mi gösteriyorsun? <strong>deze</strong> (yakın) veya <strong>die</strong> (uzak) kullan.</p><p><bdi dir=\"ltr\"><strong>deze</strong> sleutel</bdi> &nbsp; <bdi dir=\"ltr\"><strong>die</strong> doos</bdi></p></div>"}, {"type": "explanation_trans_ar", "cat": "§1.3 · UITLEG (AR)", "title": "Vertaling (Arabisch)", "content_html": "<div class=\"uitleg-box\"><h3>👉 قريب أم بعيد؟</h3><ul><li><strong><bdi dir=\"ltr\">dit</bdi> / <bdi dir=\"ltr\">deze</bdi></strong> = قريب (هنا).</li><li><strong><bdi dir=\"ltr\">dat</bdi> / <bdi dir=\"ltr\">die</bdi></strong> = بعيد (هناك).</li></ul><table><tr><th></th><th>قريب</th><th>بعيد</th></tr><tr><td>شيء واحد</td><td><bdi dir=\"ltr\"><strong>dit</strong> is mijn broer</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> is mijn broer</bdi></td></tr><tr><td>أكثر من شيء</td><td><bdi dir=\"ltr\"><strong>dit</strong> zijn mijn ouders</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> zijn mijn ouders</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3><bdi dir=\"ltr\">is</bdi> أم <bdi dir=\"ltr\">zijn</bdi>؟</h3><ul><li>شيء أو شخص واحد &rarr; <strong><bdi dir=\"ltr\">dit is</bdi></strong> / <strong><bdi dir=\"ltr\">dat is</bdi></strong>.</li><li>أكثر من واحد &rarr; <strong><bdi dir=\"ltr\">dit zijn</bdi></strong> / <strong><bdi dir=\"ltr\">dat zijn</bdi></strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Dit is</strong> mijn huis.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Dit zijn</strong> mijn buren.</bdi></p></div><div class=\"uitleg-box\"><h3>مع اسم: <bdi dir=\"ltr\">deze</bdi> أو <bdi dir=\"ltr\">die</bdi></h3><p>تشير إلى اسم؟ استخدم <strong><bdi dir=\"ltr\">deze</bdi></strong> (قريب) أو <strong><bdi dir=\"ltr\">die</bdi></strong> (بعيد).</p><p><bdi dir=\"ltr\"><strong>deze</strong> sleutel</bdi> &nbsp; <bdi dir=\"ltr\"><strong>die</strong> doos</bdi></p></div>"}, {"type": "explanation_trans_pt", "cat": "§1.3 · UITLEG (PT)", "title": "Vertaling (Portugees)", "content_html": "<div class=\"uitleg-box\"><h3>👉 Perto ou longe?</h3><ul><li><strong>dit / deze</strong> = perto (aqui).</li><li><strong>dat / die</strong> = longe (ali).</li></ul><table><tr><th></th><th>perto</th><th>longe</th></tr><tr><td>1 coisa</td><td><bdi dir=\"ltr\"><strong>dit</strong> is mijn broer</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> is mijn broer</bdi></td></tr><tr><td>mais coisas</td><td><bdi dir=\"ltr\"><strong>dit</strong> zijn mijn ouders</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> zijn mijn ouders</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>Is ou zijn?</h3><ul><li>Uma coisa ou pessoa &rarr; <strong>dit is</strong> / <strong>dat is</strong>.</li><li>Mais do que um &rarr; <strong>dit zijn</strong> / <strong>dat zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Dit is</strong> mijn huis.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Dit zijn</strong> mijn buren.</bdi></p></div><div class=\"uitleg-box\"><h3>Com um substantivo: deze ou die</h3><p>A apontar para um substantivo? Usa <strong>deze</strong> (perto) ou <strong>die</strong> (longe).</p><p><bdi dir=\"ltr\"><strong>deze</strong> sleutel</bdi> &nbsp; <bdi dir=\"ltr\"><strong>die</strong> doos</bdi></p></div>"}, {"type": "explanation_trans_om", "cat": "§1.3 · UITLEG (OM)", "title": "Vertaling (Oromo)", "content_html": "<div class=\"uitleg-box\"><h3>👉 Dhihoo moo fagoo?</h3><ul><li><strong>dit / deze</strong> = dhihoo (asii).</li><li><strong>dat / die</strong> = fagoo (achii).</li></ul><table><tr><th></th><th>dhihoo</th><th>fagoo</th></tr><tr><td>waan 1</td><td><bdi dir=\"ltr\"><strong>dit</strong> is mijn broer</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> is mijn broer</bdi></td></tr><tr><td>waan hedduu</td><td><bdi dir=\"ltr\"><strong>dit</strong> zijn mijn ouders</bdi></td><td><bdi dir=\"ltr\"><strong>dat</strong> zijn mijn ouders</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>Is moo zijn?</h3><ul><li>Waan ykn nama tokko &rarr; <strong>dit is</strong> / <strong>dat is</strong>.</li><li>Tokkoo ol &rarr; <strong>dit zijn</strong> / <strong>dat zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Dit is</strong> mijn huis.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Dit zijn</strong> mijn buren.</bdi></p></div><div class=\"uitleg-box\"><h3>Jecha waliin: deze ykn die</h3><p>Jecha ni argisiifta? <strong>deze</strong> (dhihoo) ykn <strong>die</strong> (fagoo) fayyadami.</p><p><bdi dir=\"ltr\"><strong>deze</strong> sleutel</bdi> &nbsp; <bdi dir=\"ltr\"><strong>die</strong> doos</bdi></p></div>"}, {"slide_index": 8, "cat": "§1.3 · OEFENING 1", "type": "cloze", "prompt": "……… is mijn broer, hij zit hier naast mij.", "options": ["Dit", "Dat", "Die"], "answer": "Dit", "explanation": "Hier naast mij is dichtbij, en bij een persoon die je voorstelt gebruik je dit."}, {"slide_index": 9, "cat": "§1.3 · OEFENING 2", "type": "cloze", "prompt": "……… daar aan de overkant is de school van mijn dochter.", "options": ["Dit", "Dat", "Deze"], "answer": "Dat", "explanation": "Aan de overkant is ver weg, en school is een het-woord: dat."}, {"slide_index": 10, "cat": "§1.3 · OEFENING 3", "type": "cloze", "prompt": "……… foto in mijn hand is van mijn oudste zoon.", "options": ["Deze", "Dit", "Dat"], "answer": "Deze", "explanation": "In mijn hand is dichtbij, en foto is een de-woord: deze."}, {"slide_index": 11, "cat": "§1.3 · OEFENING 4", "type": "cloze", "prompt": "……… huis daar aan het eind van de straat staat te koop.", "options": ["Deze", "Die", "Dat"], "answer": "Dat", "explanation": "Ver weg plus het huis geeft dat."}, {"slide_index": 12, "cat": "§1.3 · OEFENING 5", "type": "cloze", "prompt": "……… zijn mijn buren, ze staan hier voor de deur.", "options": ["Dit", "Deze", "Die"], "answer": "Dit", "explanation": "Bij voorstellen blijft het dit, ook als je meer mensen voorstelt."}, {"slide_index": 13, "cat": "§1.3 · OEFENING 6", "type": "cloze", "prompt": "Ik neem ……… kleed mee, het ligt hier bij de deur.", "options": ["deze", "dit", "die"], "answer": "dit", "explanation": "Hier bij de deur is dichtbij, en kleed is een het-woord: dit."}, {"slide_index": 14, "cat": "§1.3 · OEFENING 7", "type": "cloze", "prompt": "……… spiegel daar in de hoek wil ik verkopen.", "options": ["Die", "Deze", "Dat"], "answer": "Die", "explanation": "In de hoek is ver weg, en spiegel is een de-woord: die."}, {"slide_index": 15, "cat": "§1.3 · OEFENING 8", "type": "cloze", "prompt": "……… dozen hier zijn al ingepakt, de rest staat nog boven.", "options": ["Die", "Dit", "Deze"], "answer": "Deze", "explanation": "Hier plus meervoud geeft deze."}, {"slide_index": 16, "cat": "§1.3 · OEFENING 9", "type": "cloze", "prompt": "Kijk, ……… is de hamer die ik van de buurvrouw geleend heb.", "options": ["dit", "deze", "die"], "answer": "dit", "explanation": "Kijk, dit is ... is de vaste vorm om iets aan te wijzen."}, {"slide_index": 17, "cat": "§1.3 · OEFENING 10", "type": "cloze", "prompt": "……… bomen daar achterin de tuin zijn heel oud.", "options": ["Deze", "Die", "Dat"], "answer": "Die", "explanation": "Daar achterin is ver weg, en bomen is meervoud: die."}, {"slide_index": 18, "cat": "§1.3 · OEFENING 11", "type": "cloze", "prompt": "Van wie is ……… jas hier op de stoel?", "options": ["deze", "dit", "dat"], "answer": "deze", "explanation": "Hier op de stoel is dichtbij, en jas is een de-woord: deze."}, {"slide_index": 19, "cat": "§1.3 · OEFENING 12", "type": "cloze", "prompt": "……… bericht daar op het scherm begrijp ik niet.", "options": ["Die", "Deze", "Dat"], "answer": "Dat", "explanation": "Daar op het scherm is ver weg, en bericht is een het-woord: dat."}, {"slide_index": 20, "cat": "§1.3 · OEFENING 13", "type": "word_bank", "prompt": "", "options": ["Dit", "is", "mijn", "jongste", "dochter"], "answer": "Dit is mijn jongste dochter.", "explanation": "Bij voorstellen begin je met dit is, ook bij een persoon."}, {"slide_index": 21, "cat": "§1.3 · OEFENING 14", "type": "word_bank", "prompt": "", "options": ["Deze", "spiegel", "hier", "is", "van", "mijn", "moeder"], "answer": "Deze spiegel hier is van mijn moeder.", "explanation": "Deze bij een de-woord dat dichtbij is."}, {"slide_index": 22, "cat": "§1.3 · OEFENING 15", "type": "word_bank", "prompt": "", "options": ["Die", "flat", "daar", "is", "veel", "moderner", "dan", "onze"], "answer": "Die flat daar is veel moderner dan onze.", "explanation": "Die bij een de-woord dat ver weg is."}, {"slide_index": 23, "cat": "§1.3 · OEFENING 16", "type": "word_bank", "prompt": "", "options": ["Dat", "huis", "aan", "de", "overkant", "heeft", "een", "grote", "tuin"], "answer": "Dat huis aan de overkant heeft een grote tuin.", "explanation": "Dat bij een het-woord dat ver weg is."}, {"slide_index": 24, "cat": "§1.3 · OEFENING 17", "type": "word_bank", "prompt": "", "options": ["Deze", "dozen", "moeten", "vandaag", "nog", "naar", "boven"], "answer": "Deze dozen moeten vandaag nog naar boven.", "explanation": "Deze bij meervoud dichtbij; moeten op plek 2."}, {"slide_index": 25, "cat": "§1.3 · OEFENING 18", "type": "word_bank", "prompt": "", "options": ["Mag", "ik", "die", "hamer", "daar", "even", "lenen"], "answer": "Mag ik die hamer daar even lenen?", "explanation": "Die bij een de-woord ver weg, en het hele werkwoord achteraan."}, {"slide_index": 26, "cat": "§1.3 · OEFENING 19", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Deze huis hier is van ons.", "Dit huis hier is van ons.", "Die huis hier is van ons."], "answer": 1, "explanation": "Huis is een het-woord en staat dichtbij, dus dit."}, {"slide_index": 27, "cat": "§1.3 · OEFENING 20", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Dat kast daar is te zwaar.", "Dit kast daar is te zwaar.", "Die kast daar is te zwaar."], "answer": 2, "explanation": "Kast is een de-woord en staat ver weg, dus die."}, {"slide_index": 28, "cat": "§1.3 · OEFENING 21", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Deze buren hier zijn heel aardig.", "Dit buren hier zijn heel aardig.", "Dat buren hier zijn heel aardig."], "answer": 0, "explanation": "Meervoud dichtbij geeft deze."}, {"slide_index": 29, "cat": "§1.3 · OEFENING 22", "type": "mcq", "prompt": "Je wijst naar een bank aan de andere kant van de kamer. Wat zeg je?", "options": ["Deze bank daar vind ik mooi.", "Die bank daar vind ik mooi.", "Dit bank daar vind ik mooi."], "answer": 1, "explanation": "Ver weg plus een de-woord geeft die."}, {"slide_index": 30, "cat": "§1.3 · OEFENING 23", "type": "mcq", "prompt": "Je geeft iemand een foto in zijn hand. Wat zeg je erbij?", "options": ["Dat is mijn oudste zoon.", "Die is mijn oudste zoon.", "Dit is mijn oudste zoon."], "answer": 2, "explanation": "Wat je aanwijst en dichtbij is, begint met dit is."}, {"slide_index": 31, "cat": "§1.3 · OEFENING 24", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Drie zinnen: hoofdletter vooraan, punt aan het eind."}, {"slide_index": 32, "cat": "§1.3 · OEFENING 25", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Let op de hoofdletter na elke punt."}, {"slide_index": 33, "cat": "§1.3 · OEFENING 26", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 34, "cat": "§1.3 · OEFENING 27", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 35, "cat": "§1.3 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 36, "cat": "§1.3 · OEFENING 29", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 37, "cat": "§1.3 · OEFENING 30", "type": "writing-prompt", "prompt": "Kijk om je heen. Schrijf drie zinnen over dingen dichtbij en ver weg, met dit, dat, deze en die.", "options": [], "answer": null, "explanation": ""}]}, "1.4": {"code": "1.4", "title": "Huiswerk plannen", "total_slides": 29, "slides": [{"type": "title_card", "cat": "§1.4 · INTRO", "title": "A2 Thema 1: Verhuizen — §1.4", "subtitle": "Huiswerk plannen", "concepts": []}, {"slide_index": 2, "cat": "§1.4 · OEFENING 1", "type": "mcq", "prompt": "Waarom krijgen de cursisten deze week meer huiswerk?", "options": ["Omdat er volgende week maar één les is.", "Omdat de cursisten te weinig oefenen.", "Omdat de toets bijna begint."], "answer": 0, "explanation": "De school is dinsdag dicht, dus er is maar één les."}, {"slide_index": 3, "cat": "§1.4 · OEFENING 2", "type": "mcq", "prompt": "Welke oefeningen moeten de cursisten maken?", "options": ["Alle oefeningen van bladzijde 12.", "Oefening 1 tot en met 5.", "Alleen oefening 5."], "answer": 1, "explanation": "Er staat: oefening 1 tot en met 5 op bladzijde 12."}, {"slide_index": 4, "cat": "§1.4 · OEFENING 3", "type": "mcq", "prompt": "Waarom raadt de docent een half uur per dag aan?", "options": ["Omdat je de woorden dan langer onthoudt.", "Omdat het huiswerk dan sneller klaar is.", "Omdat de les op zondag is."], "answer": 0, "explanation": "Er staat: je onthoudt de woorden dan ook langer."}, {"slide_index": 5, "cat": "§1.4 · OEFENING 4", "type": "mcq", "prompt": "Wat doe je als een oefening niet lukt?", "options": ["Je slaat de hele bladzijde over.", "Je belt meneer De Wit.", "Je zet er een vraagteken bij en gaat verder."], "answer": 2, "explanation": "Er staat: zet er een vraagteken bij en ga door met de volgende."}, {"slide_index": 6, "cat": "§1.4 · OEFENING 5", "type": "mcq", "prompt": "Wanneer worden de vraagtekens besproken?", "options": ["Aan het einde van de les.", "Aan het begin van de les.", "Per e-mail, thuis."], "answer": 1, "explanation": "Er staat: we bespreken die vraagtekens samen aan het begin van de les."}, {"slide_index": 7, "cat": "§1.4 · OEFENING 6", "type": "mcq", "prompt": "Wat vindt de docent van oefenen met de televisie aan?", "options": ["Je oefent dan wel, maar je leert er weinig van.", "Dat is juist handig, want je hoort Nederlands.", "Dat mag alleen in het weekend."], "answer": 0, "explanation": "Er staat letterlijk: je oefent wel, maar je leert er weinig van."}, {"slide_index": 8, "cat": "§1.4 · OEFENING 7", "type": "mcq", "prompt": "Wat moeten de cursisten meenemen naar de les?", "options": ["Een laptop.", "Hun schrift en hun pen.", "Bladzijde 12 uit het boek."], "answer": 1, "explanation": "Er staat: neem je schrift en je pen altijd mee."}, {"slide_index": 9, "cat": "§1.4 · OEFENING 8", "type": "mcq", "prompt": "Op welke dag is de volgende les?", "options": ["Op dinsdag.", "Op zondag.", "Op woensdag."], "answer": 2, "explanation": "De brief eindigt met: tot woensdag. Dinsdag is de school juist dicht."}, {"slide_index": 10, "cat": "§1.4 · OEFENING 9", "type": "mcq", "prompt": "Wat betekent 'tegelijk'?", "options": ["op hetzelfde moment", "elke dag opnieuw", "een beetje langzaam"], "answer": 0, "explanation": "Twee dingen tegelijk doen is twee dingen op hetzelfde moment doen."}, {"slide_index": 11, "cat": "§1.4 · OEFENING 10", "type": "mcq", "prompt": "Wat betekent 'oefenen'?", "options": ["iets kopen in een winkel", "iets vaak doen om het te leren", "iets aan iemand geven"], "answer": 1, "explanation": "Oefenen is iets herhalen tot je het kunt."}, {"slide_index": 12, "cat": "§1.4 · OEFENING 11", "type": "mcq", "prompt": "Wat betekent 'het huiswerk'?", "options": ["het werk dat je thuis doet voor school", "de kamer waar je slaapt", "de weg naar school"], "answer": 0, "explanation": "Huiswerk is schoolwerk dat je thuis maakt."}, {"slide_index": 13, "cat": "§1.4 · OEFENING 12", "type": "matching", "prompt": "Wat hoort bij elkaar?", "options": [], "answer": null, "explanation": "Elk woord past bij precies één uitleg."}, {"slide_index": 14, "cat": "§1.4 · OEFENING 13", "type": "matching", "prompt": "Wat hoort bij elkaar?", "options": [], "answer": null, "explanation": "Zoek het antwoord in de brief."}, {"slide_index": 15, "cat": "§1.4 · OEFENING 14", "type": "cloze", "prompt": "Ik maak mijn ……… altijd meteen na het eten.", "options": ["schrift", "vraagteken", "huiswerk"], "answer": "huiswerk", "explanation": "Huiswerk is het werk dat je thuis voor school doet."}, {"slide_index": 16, "cat": "§1.4 · OEFENING 15", "type": "cloze", "prompt": "Je kunt niet twee dingen ……… doen; kies er één.", "options": ["tegelijk", "duidelijk", "handig"], "answer": "tegelijk", "explanation": "Tegelijk betekent op hetzelfde moment."}, {"slide_index": 17, "cat": "§1.4 · OEFENING 16", "type": "cloze", "prompt": "Wij ……… elke dag een half uur met de nieuwe woorden.", "options": ["oefent", "oefen", "oefenen"], "answer": "oefenen", "explanation": "Wij krijgt het hele werkwoord."}, {"slide_index": 18, "cat": "§1.4 · OEFENING 17", "type": "cloze", "prompt": "Zet een ……… bij de oefening die je niet begrijpt.", "options": ["vraagteken", "schrift", "huiswerk"], "answer": "vraagteken", "explanation": "Dat is wat de docent in de brief vraagt."}, {"slide_index": 19, "cat": "§1.4 · OEFENING 18", "type": "cloze", "prompt": "Neem je ……… en je pen altijd mee naar de les.", "options": ["scherm", "schrift", "bericht"], "answer": "schrift", "explanation": "In je schrift schrijf je de antwoorden."}, {"slide
