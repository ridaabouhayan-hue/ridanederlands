</li><li>Birden fazla &rarr; <strong>er zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Er is</strong> een tuin.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Er zijn</strong> drie kamers.</bdi></p></div><div class=\"uitleg-box\"><h3>er nerede durur?</h3><table><tr><th>cümle türü</th><th>örnek</th></tr><tr><td>düz cümle</td><td><bdi dir=\"ltr\"><strong>Er</strong> is een lift in het gebouw.</bdi></td></tr><tr><td>soru</td><td><bdi dir=\"ltr\">Is <strong>er</strong> een lift?</bdi></td></tr><tr><td>başta zaman/yer ile</td><td><bdi dir=\"ltr\">In de keuken <strong>is</strong> er een raam.</bdi></td></tr></table></div>"}, {"type": "explanation_trans_ar", "cat": "§1.6 · UITLEG (AR)", "title": "Vertaling (Arabisch)", "content_html": "<div class=\"uitleg-box\"><h3>🏡 <bdi dir=\"ltr\">Er is</bdi> / <bdi dir=\"ltr\">Er zijn</bdi></h3><p>بـ <strong><bdi dir=\"ltr\">er is</bdi></strong> و <strong><bdi dir=\"ltr\">er zijn</bdi></strong> تقول إن شيئًا موجود أو في مكان ما.</p><ul><li>شيء واحد &rarr; <strong><bdi dir=\"ltr\">er is</bdi></strong>.</li><li>أكثر من شيء &rarr; <strong><bdi dir=\"ltr\">er zijn</bdi></strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Er is</strong> een tuin.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Er zijn</strong> drie kamers.</bdi></p></div><div class=\"uitleg-box\"><h3>أين يقع <bdi dir=\"ltr\">er</bdi>؟</h3><table><tr><th>نوع الجملة</th><th>مثال</th></tr><tr><td>جملة خبرية</td><td><bdi dir=\"ltr\"><strong>Er</strong> is een lift in het gebouw.</bdi></td></tr><tr><td>سؤال</td><td><bdi dir=\"ltr\">Is <strong>er</strong> een lift?</bdi></td></tr><tr><td>مع الزمان/المكان في البداية</td><td><bdi dir=\"ltr\">In de keuken <strong>is</strong> er een raam.</bdi></td></tr></table></div>"}, {"type": "explanation_trans_pt", "cat": "§1.6 · UITLEG (PT)", "title": "Vertaling (Portugees)", "content_html": "<div class=\"uitleg-box\"><h3>🏡 Er is / Er zijn</h3><p>Com <strong>er is</strong> e <strong>er zijn</strong> dizes que algo existe ou está em algum lugar.</p><ul><li>Uma coisa &rarr; <strong>er is</strong>.</li><li>Mais coisas &rarr; <strong>er zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Er is</strong> een tuin.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Er zijn</strong> drie kamers.</bdi></p></div><div class=\"uitleg-box\"><h3>Onde fica er?</h3><table><tr><th>tipo de frase</th><th>exemplo</th></tr><tr><td>afirmação</td><td><bdi dir=\"ltr\"><strong>Er</strong> is een lift in het gebouw.</bdi></td></tr><tr><td>pergunta</td><td><bdi dir=\"ltr\">Is <strong>er</strong> een lift?</bdi></td></tr><tr><td>com tempo/lugar no início</td><td><bdi dir=\"ltr\">In de keuken <strong>is</strong> er een raam.</bdi></td></tr></table></div>"}, {"type": "explanation_trans_om", "cat": "§1.6 · UITLEG (OM)", "title": "Vertaling (Oromo)", "content_html": "<div class=\"uitleg-box\"><h3>🏡 Er is / Er zijn</h3><p><strong>er is</strong> fi <strong>er zijn</strong>'n waan tokko akka jiru ykn bakka tokko akka jiru himta.</p><ul><li>Waan tokko &rarr; <strong>er is</strong>.</li><li>Waan hedduu &rarr; <strong>er zijn</strong>.</li></ul><p><bdi dir=\"ltr\"><strong>Er is</strong> een tuin.</bdi> &nbsp; <bdi dir=\"ltr\"><strong>Er zijn</strong> drie kamers.</bdi></p></div><div class=\"uitleg-box\"><h3>er eessa dhaabata?</h3><table><tr><th>gosa himaa</th><th>fakkeenya</th></tr><tr><td>ibsa</td><td><bdi dir=\"ltr\"><strong>Er</strong> is een lift in het gebouw.</bdi></td></tr><tr><td>gaaffii</td><td><bdi dir=\"ltr\">Is <strong>er</strong> een lift?</bdi></td></tr><tr><td>yeroo/bakka duraan qabu</td><td><bdi dir=\"ltr\">In de keuken <strong>is</strong> er een raam.</bdi></td></tr></table></div>"}, {"slide_index": 8, "cat": "§1.6 · OEFENING 1", "type": "cloze", "prompt": "……… is een grote tuin achter dit huis.", "options": ["Er", "Het", "Daar"], "answer": "Er", "explanation": "Je vertelt dát iets bestaat, en dan begin je met er."}, {"slide_index": 9, "cat": "§1.6 · OEFENING 2", "type": "cloze", "prompt": "……… zijn drie slaapkamers op de eerste verdieping.", "options": ["Het", "Er", "Die"], "answer": "Er", "explanation": "Drie slaapkamers is meervoud, dus er zijn."}, {"slide_index": 10, "cat": "§1.6 · OEFENING 3", "type": "cloze", "prompt": "In deze wijk ……… veel jonge gezinnen.", "options": ["wonen er", "er wonen", "is er"], "answer": "wonen er", "explanation": "Na een bepaling vooraan komt eerst het werkwoord, dan er."}, {"slide_index": 11, "cat": "§1.6 · OEFENING 4", "type": "cloze", "prompt": "Achter de flat ……… een kleine speeltuin.", "options": ["er is", "zijn er", "is er"], "answer": "is er", "explanation": "In de tuin is plek 1, dus het werkwoord komt vóór er."}, {"slide_index": 12, "cat": "§1.6 · OEFENING 5", "type": "cloze", "prompt": "……… nog een kamer vrij in dit huis?", "options": ["Is er", "Er is", "Zijn er"], "answer": "Is er", "explanation": "In een vraag begint de zin met het werkwoord, dan er."}, {"slide_index": 13, "cat": "§1.6 · OEFENING 6", "type": "cloze", "prompt": "……… geen lift in dit gebouw, dus je moet de trap nemen.", "options": ["Er zijn", "Er is", "Het is"], "answer": "Er is", "explanation": "Geen lift is enkelvoud, dus er is."}, {"slide_index": 14, "cat": "§1.6 · OEFENING 7", "type": "cloze", "prompt": "Hoeveel vierkante meter ……… in de woonkamer?", "options": ["zijn er", "er zijn", "is er"], "answer": "zijn er", "explanation": "Na een vraagwoord komt eerst het werkwoord, dan er."}, {"slide_index": 15, "cat": "§1.6 · OEFENING 8", "type": "cloze", "prompt": "……… veel licht in deze kamer, want het raam is heel groot.", "options": ["Er zijn", "Daar is", "Er is"], "answer": "Er is", "explanation": "Licht is enkelvoud en je zegt dát het er is."}, {"slide_index": 16, "cat": "§1.6 · OEFENING 9", "type": "cloze", "prompt": "Volgende week ……… twee nieuwe buren in de flat.", "options": ["komen er", "er komen", "is er"], "answer": "komen er", "explanation": "Volgende week staat vooraan, dus het werkwoord komt daarna en er erachter."}, {"slide_index": 17, "cat": "§1.6 · OEFENING 10", "type": "cloze", "prompt": "……… nog iemand die mij met de kast kan helpen?", "options": ["Er is", "Is er", "Zijn er"], "answer": "Is er", "explanation": "Iemand is enkelvoud, en het is een vraag: is er."}, {"slide_index": 18, "cat": "§1.6 · OEFENING 11", "type": "cloze", "prompt": "Op de tweede verdieping ……… vier appartementen.", "options": ["zijn er", "er zijn", "is er"], "answer": "zijn er", "explanation": "Vier appartementen is meervoud, en na een bepaling komt het werkwoord eerst."}, {"slide_index": 19, "cat": "§1.6 · OEFENING 12", "type": "cloze", "prompt": "……… niets meer in de koelkast, ik ga zo boodschappen doen.", "options": ["Er zijn", "Het is", "Er is"], "answer": "Er is", "explanation": "Niets is enkelvoud: er is."}, {"slide_index": 20, "cat": "§1.6 · OEFENING 13", "type": "word_bank", "prompt": "", "options": ["Er", "zijn", "drie", "kamers", "in", "dit", "huis"], "answer": "Er zijn drie kamers in dit huis.", "explanation": "Meervoud, dus er zijn."}, {"slide_index": 21, "cat": "§1.6 · OEFENING 14", "type": "word_bank", "prompt": "", "options": ["Achter", "het", "huis", "is", "er", "een", "ruime", "tuin"], "answer": "Achter het huis is er een ruime tuin.", "explanation": "Na een bepaling vooraan komt het werkwoord vóór er."}, {"slide_index": 22, "cat": "§1.6 · OEFENING 15", "type": "word_bank", "prompt": "", "options": ["Is", "er", "nog", "een", "kamer", "vrij", "in", "de", "flat"], "answer": "Is er nog een kamer vrij in de flat?", "explanation": "In een vraag staat het werkwoord vooraan."}, {"slide_index": 23, "cat": "§1.6 · OEFENING 16", "type": "word_bank", "prompt": "", "options": ["In", "deze", "wijk", "wonen", "er", "veel", "jonge", "gezinnen"], "answer": "In deze wijk wonen er veel jonge gezinnen.", "explanation": "In deze wijk is plek 1, dus wonen komt daarna."}, {"slide_index": 24, "cat": "§1.6 · OEFENING 17", "type": "word_bank", "prompt": "", "options": ["Er", "is", "geen", "lift", "in", "dit", "oude", "gebouw"], "answer": "Er is geen lift in dit oude gebouw.", "explanation": "Geen lift is enkelvoud: er is."}, {"slide_index": 25, "cat": "§1.6 · OEFENING 18", "type": "word_bank", "prompt": "", "options": ["Hoeveel", "kamers", "zijn", "er", "op", "de", "eerste", "verdieping"], "answer": "Hoeveel kamers zijn er op de eerste verdieping?", "explanation": "Na het vraagwoord komt het werkwoord, dan er."}, {"slide_index": 26, "cat": "§1.6 · OEFENING 19", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["In de tuin er staan twee bomen.", "In de tuin staan er twee bomen.", "In de tuin twee bomen staan er."], "answer": 1, "explanation": "Na een bepaling vooraan komt eerst het werkwoord, dan er."}, {"slide_index": 27, "cat": "§1.6 · OEFENING 20", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Er zijn geen lift in dit gebouw.", "Is er geen lift in dit gebouw.", "Er is geen lift in dit gebouw."], "answer": 2, "explanation": "Geen lift is enkelvoud, en dit is een mededeling en geen vraag."}, {"slide_index": 28, "cat": "§1.6 · OEFENING 21", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Er is nog een kamer vrij?", "Is er nog een kamer vrij?", "Nog een kamer vrij is er?"], "answer": 1, "explanation": "In een vraag begint de zin met het werkwoord."}, {"slide_index": 29, "cat": "§1.6 · OEFENING 22", "type": "mcq", "prompt": "Je wilt weten of het huis een tuin heeft. Wat vraag je?", "options": ["Is er een tuin bij dit huis?", "Er is een tuin bij dit huis?", "Een tuin er is bij dit huis?"], "answer": 0, "explanation": "In een vraag staat het werkwoord vooraan, en dan pas er."}, {"slide_index": 30, "cat": "§1.6 · OEFENING 23", "type": "mcq", "prompt": "Iemand vraagt hoeveel kamers het huis heeft. Wat antwoord je?", "options": ["Er is vier kamers.", "Vier kamers er zijn.", "Er zijn vier kamers."], "answer": 2, "explanation": "Vier kamers is meervoud, dus er zijn, en er staat vooraan in een mededeling."}, {"slide_index": 31, "cat": "§1.6 · OEFENING 24", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Drie zinnen over wat er wel en niet is."}, {"slide_index": 32, "cat": "§1.6 · OEFENING 25", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Let op: de tweede zin is een vraag en krijgt een vraagteken."}, {"slide_index": 33, "cat": "§1.6 · OEFENING 26", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 34, "cat": "§1.6 · OEFENING 27", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 35, "cat": "§1.6 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 36, "cat": "§1.6 · OEFENING 29", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 37, "cat": "§1.6 · OEFENING 30", "type": "writing-prompt", "prompt": "Beschrijf je eigen woning. Schrijf drie zinnen met er is of er zijn, en één vraag met is er.", "options": [], "answer": null, "explanation": ""}]}, "1.7": {"code": "1.7", "title": "En, maar, want, dus, of", "total_slides": 36, "slides": [{"type": "title_card", "cat": "§1.7 · INTRO", "title": "A2 Thema 1: Verhuizen — §1.7", "subtitle": "En, maar, want, dus, of", "concepts": ["voegwoorden-hoofdzin"]}, {"type": "explanation_nl", "cat": "§1.7 · GRAMMATICA", "title": "En, maar, want, dus, of", "content_html": "<div class=\"uitleg-box\"><h3>🔗 En, maar, want, dus, of</h3><p>Met deze woorden verbind je twee hoofdzinnen. De volgorde blijft gewoon.</p><table><tr><th>woord</th><th>betekenis</th></tr><tr><td><strong>en</strong></td><td>erbij</td></tr><tr><td><strong>maar</strong></td><td>tegenstelling</td></tr><tr><td><strong>want</strong></td><td>reden</td></tr><tr><td><strong>dus</strong></td><td>gevolg</td></tr><tr><td><strong>of</strong></td><td>keuze</td></tr></table></div><div class=\"uitleg-box\"><h3>In een zin</h3><p><bdi dir=\"ltr\">Ik woon hier <strong>en</strong> ik ben blij.</bdi></p><p><bdi dir=\"ltr\">Het huis is klein, <strong>maar</strong> het is gezellig.</bdi></p><p><bdi dir=\"ltr\">Ik blijf thuis, <strong>want</strong> het regent.</bdi></p><p><bdi dir=\"ltr\">Het regent, <strong>dus</strong> ik blijf thuis.</bdi></p><p><bdi dir=\"ltr\">Drink je koffie <strong>of</strong> thee?</bdi></p></div>"}, {"type": "explanation_trans_en", "cat": "§1.7 · UITLEG (EN)", "title": "Vertaling (Engels)", "content_html": "<div class=\"uitleg-box\"><h3>🔗 En, maar, want, dus, of</h3><p>With these words you join two main clauses. The word order stays normal.</p><table><tr><th>word</th><th>meaning</th></tr><tr><td><strong>en</strong></td><td>and (adds)</td></tr><tr><td><strong>maar</strong></td><td>but (contrast)</td></tr><tr><td><strong>want</strong></td><td>because (reason)</td></tr><tr><td><strong>dus</strong></td><td>so (result)</td></tr><tr><td><strong>of</strong></td><td>or (choice)</td></tr></table></div><div class=\"uitleg-box\"><h3>In a sentence</h3><p><bdi dir=\"ltr\">Ik woon hier <strong>en</strong> ik ben blij.</bdi></p><p><bdi dir=\"ltr\">Het huis is klein, <strong>maar</strong> het is gezellig.</bdi></p><p><bdi dir=\"ltr\">Ik blijf thuis, <strong>want</strong> het regent.</bdi></p><p><bdi dir=\"ltr\">Het regent, <strong>dus</strong> ik blijf thuis.</bdi></p><p><bdi dir=\"ltr\">Drink je koffie <strong>of</strong> thee?</bdi></p></div>"}, {"type": "explanation_trans_tr", "cat": "§1.7 · UITLEG (TR)", "title": "Vertaling (Turks)", "content_html": "<div class=\"uitleg-box\"><h3>🔗 En, maar, want, dus, of</h3><p>Bu kelimelerle iki temel cümleyi birleştirirsin. Kelime sırası normal kalır.</p><table><tr><th>kelime</th><th>anlamı</th></tr><tr><td><strong>en</strong></td><td>ve (ekler)</td></tr><tr><td><strong>maar</strong></td><td>ama (karşıtlık)</td></tr><tr><td><strong>want</strong></td><td>çünkü (neden)</td></tr><tr><td><strong>dus</strong></td><td>bu yüzden (sonuç)</td></tr><tr><td><strong>of</strong></td><td>veya (seçim)</td></tr></table></div><div class=\"uitleg-box\"><h3>Cümlede</h3><p><bdi dir=\"ltr\">Ik woon hier <strong>en</strong> ik ben blij.</bdi></p><p><bdi dir=\"ltr\">Het huis is klein, <strong>maar</strong> het is gezellig.</bdi></p><p><bdi dir=\"ltr\">Ik blijf thuis, <strong>want</strong> het regent.</bdi></p><p><bdi dir=\"ltr\">Het regent, <strong>dus</strong> ik blijf thuis.</bdi></p><p><bdi dir=\"ltr\">Drink je koffie <strong>of</strong> thee?</bdi></p></div>"}, {"type": "explanation_trans_ar", "cat": "§1.7 · UITLEG (AR)", "title": "Vertaling (Arabisch)", "content_html": "<div class=\"uitleg-box\"><h3>🔗 <bdi dir=\"ltr\">En, maar, want, dus, of</bdi></h3><p>بهذه الكلمات تربط جملتين رئيسيتين. يبقى ترتيب الكلمات عاديًا.</p><table><tr><th>كلمة</th><th>المعنى</th></tr><tr><td><strong><bdi dir=\"ltr\">en</bdi></strong></td><td>و (يضيف)</td></tr><tr><td><strong><bdi dir=\"ltr\">maar</bdi></strong></td><td>لكن (تناقض)</td></tr><tr><td><strong><bdi dir=\"ltr\">want</bdi></strong></td><td>لأن (سبب)</td></tr><tr><td><strong><bdi dir=\"ltr\">dus</bdi></strong></td><td>لذلك (نتيجة)</td></tr><tr><td><strong><bdi dir=\"ltr\">of</bdi></strong></td><td>أو (اختيار)</td></tr></table></div><div class=\"uitleg-box\"><h3>في جملة</h3><p><bdi dir=\"ltr\">Ik woon hier <strong>en</strong> ik ben blij.</bdi></p><p><bdi dir=\"ltr\">Het huis is klein, <strong>maar</strong> het is gezellig.</bdi></p><p><bdi dir=\"ltr\">Ik blijf thuis, <strong>want</strong> het regent.</bdi></p><p><bdi dir=\"ltr\">Het regent, <strong>dus</strong> ik blijf thuis.</bdi></p><p><bdi dir=\"ltr\">Drink je koffie <strong>of</strong> thee?</bdi></p></div>"}, {"type": "explanation_trans_pt", "cat": "§1.7 · UITLEG (PT)", "title": "Vertaling (Portugees)", "content_html": "<div class=\"uitleg-box\"><h3>🔗 En, maar, want, dus, of</h3><p>Com estas palavras juntas duas orações principais. A ordem das palavras mantém-se normal.</p><table><tr><th>palavra</th><th>significado</th></tr><tr><td><strong>en</strong></td><td>e (acrescenta)</td></tr><tr><td><strong>maar</strong></td><td>mas (contraste)</td></tr><tr><td><strong>want</strong></td><td>porque (razão)</td></tr><tr><td><strong>dus</strong></td><td>por isso (resultado)</td></tr><tr><td><strong>of</strong></td><td>ou (escolha)</td></tr></table></div><div class=\"uitleg-box\"><h3>Numa frase</h3><p><bdi dir=\"ltr\">Ik woon hier <strong>en</strong> ik ben blij.</bdi></p><p><bdi dir=\"ltr\">Het huis is klein, <strong>maar</strong> het is gezellig.</bdi></p><p><bdi dir=\"ltr\">Ik blijf thuis, <strong>want</strong> het regent.</bdi></p><p><bdi dir=\"ltr\">Het regent, <strong>dus</strong> ik blijf thuis.</bdi></p><p><bdi dir=\"ltr\">Drink je koffie <strong>of</strong> thee?</bdi></p></div>"}, {"type": "explanation_trans_om", "cat": "§1.7 · UITLEG (OM)", "title": "Vertaling (Oromo)", "content_html": "<div class=\"uitleg-box\"><h3>🔗 En, maar, want, dus, of</h3><p>Jechoota kanaan hima bu'uuraa lama walitti fidda. Tartiibni jechaa akkuma jirutti hafa.</p><table><tr><th>jecha</th><th>hiika</th></tr><tr><td><strong>en</strong></td><td>fi (dabala)</td></tr><tr><td><strong>maar</strong></td><td>garuu (faallaa)</td></tr><tr><td><strong>want</strong></td><td>sababa (sababa)</td></tr><tr><td><strong>dus</strong></td><td>kanaafuu (bu'aa)</td></tr><tr><td><strong>of</strong></td><td>ykn (filannoo)</td></tr></table></div><div class=\"uitleg-box\"><h3>Hima keessatti</h3><p><bdi dir=\"ltr\">Ik woon hier <strong>en</strong> ik ben blij.</bdi></p><p><bdi dir=\"ltr\">Het huis is klein, <strong>maar</strong> het is gezellig.</bdi></p><p><bdi dir=\"ltr\">Ik blijf thuis, <strong>want</strong> het regent.</bdi></p><p><bdi dir=\"ltr\">Het regent, <strong>dus</strong> ik blijf thuis.</bdi></p><p><bdi dir=\"ltr\">Drink je koffie <strong>of</strong> thee?</bdi></p></div>"}, {"slide_index": 8, "cat": "§1.7 · OEFENING 1", "type": "cloze", "prompt": "De huur is te hoog, ……… we zoeken verder.", "options": ["dus", "want", "of"], "answer": "dus", "explanation": "Verder zoeken is het gevolg van de te hoge huur."}, {"slide_index": 9, "cat": "§1.7 · OEFENING 2", "type": "cloze", "prompt": "We zoeken verder, ……… de huur is te hoog.", "options": ["dus", "want", "maar"], "answer": "want", "explanation": "Nu komt de reden erna, en dan gebruik je want."}, {"slide_index": 10, "cat": "§1.7 · OEFENING 3", "type": "cloze", "prompt": "Het huis is ruim, ……… de tuin is heel klein.", "options": ["maar", "en", "dus"], "answer": "maar", "explanation": "Het tweede deel gaat de andere kant op dan het eerste."}, {"slide_index": 11, "cat": "§1.7 · OEFENING 4", "type": "cloze", "prompt": "De keuken is modern ……… de badkamer is nieuw.", "options": ["maar", "want", "en"], "answer": "en", "explanation": "Er komt gewoon iets bij; allebei is positief."}, {"slide_index": 12, "cat": "§1.7 · OEFENING 5", "type": "cloze", "prompt": "Bel je vandaag ……… kom je morgen langs?", "options": ["of", "en", "dus"], "answer": "of", "explanation": "De ander moet kiezen tussen twee mogelijkheden."}, {"slide_index": 13, "cat": "§1.7 · OEFENING 6", "type": "cloze", "prompt": "Ik ben moe, ……… ik ga vroeg naar bed.", "options": ["want", "dus", "of"], "answer": "dus", "explanation": "Vroeg naar bed gaan volgt uit moe zijn."}, {"slide_index": 14, "cat": "§1.7 · OEFENING 7", "type": "cloze", "prompt": "Ik ga vroeg naar bed, ……… ik ben heel moe.", "options": ["want", "dus", "en"], "answer": "want", "explanation": "Dezelfde twee zinnen, maar nu staat de reden achteraan."}, {"slide_index": 15, "cat": "§1.7 · OEFENING 8", "type": "cloze", "prompt": "De buren zijn aardig, ……… ze maken 's nachts veel lawaai.", "options": ["en", "dus", "maar"], "answer": "maar", "explanation": "Aardig en lawaai maken botsen, dus maar."}, {"slide_index": 16, "cat": "§1.7 · OEFENING 9", "type": "cloze", "prompt": "Neem je de trein ……… ga je met de auto?", "options": ["of", "en", "want"], "answer": "of", "explanation": "Twee mogelijkheden waaruit gekozen moet worden."}, {"slide_index": 17, "cat": "§1.7 · OEFENING 10", "type": "cloze", "prompt": "De flat is licht ……… hij ligt in een rustige wijk.", "options": ["maar", "en", "of"], "answer": "en", "explanation": "Twee pluspunten die je gewoon aan elkaar plakt."}, {"slide_index": 18, "cat": "§1.7 · OEFENING 11", "type": "cloze", "prompt": "Er is geen lift, ……… we dragen de dozen via de trap.", "options": ["dus", "want", "of"], "answer": "dus", "explanation": "De trap nemen is het gevolg van geen lift."}, {"slide_index": 19, "cat": "§1.7 · OEFENING 12", "type": "cloze", "prompt": "We vieren het overmorgen, ……… vandaag heeft niemand tijd.", "options": ["dus", "maar", "want"], "answer": "want", "explanation": "Achteraan staat de reden waarom het overmorgen is."}, {"slide_index": 20, "cat": "§1.7 · OEFENING 13", "type": "word_bank", "prompt": "", "options": ["De", "huur", "is", "te", "hoog", "dus", "we", "zoeken", "verder"], "answer": "De huur is te hoog dus we zoeken verder.", "explanation": "Na dus begint een nieuwe hoofdzin met het onderwerp vooraan."}, {"slide_index": 21, "cat": "§1.7 · OEFENING 14", "type": "word_bank", "prompt": "", "options": ["Ik", "ga", "vroeg", "naar", "bed", "want", "ik", "ben", "moe"], "answer": "Ik ga vroeg naar bed want ik ben moe.", "explanation": "Na want blijft de volgorde onderwerp, werkwoord, rest."}, {"slide_index": 22, "cat": "§1.7 · OEFENING 15", "type": "word_bank", "prompt": "", "options": ["Het", "huis", "is", "ruim", "maar", "de", "tuin", "is", "klein"], "answer": "Het huis is ruim maar de tuin is klein.", "explanation": "Maar verbindt twee hoofdzinnen die tegenover elkaar staan."}, {"slide_index": 23, "cat": "§1.7 · OEFENING 16", "type": "word_bank", "prompt": "", "options": ["Bel", "je", "vandaag", "of", "kom", "je", "morgen", "langs"], "answer": "Bel je vandaag of kom je morgen langs?", "explanation": "Twee vragen aan elkaar met of; allebei beginnen met het werkwoord."}, {"slide_index": 24, "cat": "§1.7 · OEFENING 17", "type": "word_bank", "prompt": "", "options": ["De", "keuken", "is", "modern", "en", "de", "badkamer", "is", "nieuw"], "answer": "De keuken is modern en de badkamer is nieuw.", "explanation": "En plakt twee gelijkwaardige zinnen aan elkaar."}, {"slide_index": 25, "cat": "§1.7 · OEFENING 18", "type": "word_bank", "prompt": "", "options": ["Er", "is", "geen", "lift", "dus", "we", "nemen", "de", "trap"], "answer": "Er is geen lift dus we nemen de trap.", "explanation": "Na dus komt het gevolg, met het onderwerp weer vooraan."}, {"slide_index": 26, "cat": "§1.7 · OEFENING 19", "type": "mcq", "prompt": "De reden staat achteraan. Welk woord hoort ertussen?", "options": ["dus", "want", "maar"], "answer": 1, "explanation": "Want zet de reden erna; dus zet juist het gevolg erna."}, {"slide_index": 27, "cat": "§1.7 · OEFENING 20", "type": "mcq", "prompt": "Het gevolg staat achteraan. Welk woord hoort ertussen?", "options": ["want", "of", "dus"], "answer": 2, "explanation": "Dus zet het gevolg erna."}, {"slide_index": 28, "cat": "§1.7 · OEFENING 21", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Ik ben moe, dus ga ik naar bed.", "Ik ben moe, dus ik ga naar bed.", "Ik ben moe, dus naar bed ik ga."], "answer": 1, "explanation": "Dus verbindt twee hoofdzinnen; de tweede begint gewoon met het onderwerp."}, {"slide_index": 29, "cat": "§1.7 · OEFENING 22", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["De buren zijn aardig maar zij lawaai maken veel.", "De buren zijn aardig maar maken zij veel lawaai.", "De buren zijn aardig maar zij maken veel lawaai."], "answer": 2, "explanation": "Na maar staat het onderwerp weer vooraan en het werkwoord op plek 2."}, {"slide_index": 30, "cat": "§1.7 · OEFENING 23", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Twee zinnen, elk met een verbindingswoord in het midden."}, {"slide_index": 31, "cat": "§1.7 · OEFENING 24", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Let op de hoofdletter na de punt."}, {"slide_index": 32, "cat": "§1.7 · OEFENING 25", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 33, "cat": "§1.7 · OEFENING 26", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 34, "cat": "§1.7 · OEFENING 27", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 35, "cat": "§1.7 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 36, "cat": "§1.7 · OEFENING 29", "type": "writing-prompt", "prompt": "Schrijf drie zinnen over je woning: één met want, één met maar en één met dus.", "options": [], "answer": null, "explanation": ""}]}, "1.8": {"code": "1.8", "title": "Tweedehands kopen", "total_slides": 30, "slides": [{"type": "title_card", "cat": "§1.8 · INTRO", "title": "A2 Thema 1: Verhuizen — §1.8", "subtitle": "Tweedehands kopen", "concepts": []}, {"slide_index": 2, "cat": "§1.8 · OEFENING 1", "type": "mcq", "prompt": "Waarom verkoopt de eigenaar de spiegel?", "options": ["Hij is kapot.", "Hij past niet in het nieuwe huis.", "Hij is te licht."], "answer": 1, "explanation": "Er staat: hij past niet in ons nieuwe huis."}, {"slide_index": 3, "cat": "§1.8 · OEFENING 2", "type": "mcq", "prompt": "Waarom stuurt de verkoper de spiegel niet op?", "options": ["Omdat hij te zwaar en te breed is.", "Omdat de post te duur is.", "Omdat het hout donker is."], "answer": 0, "explanation": "Er staat: te zwaar en te breed om op te sturen."}, {"slide_index": 4, "cat": "§1.8 · OEFENING 3", "type": "mcq", "prompt": "Hoeveel betaalt Samir uiteindelijk?", "options": ["45 euro", "35 euro", "40 euro"], "answer": 2, "explanation": "De vraagprijs was 45, Samir bood 35, en ze werden het eens op 40."}, {"slide_index": 5, "cat": "§1.8 · OEFENING 4", "type": "mcq", "prompt": "Wanneer haalt Samir de spiegel op?", "options": ["Zaterdagochtend om tien uur.", "Doordeweeks na zes uur.", "Zondagmiddag."], "answer": 0, "explanation": "De verkoper is zaterdagochtend thuis en Samir komt om tien uur."}, {"slide_index": 6, "cat": "§1.8 · OEFENING 5", "type": "mcq", "prompt": "In welke staat is de spiegel?", "options": ["Helemaal kapot.", "Heel, met een klein krasje achterop.", "Nieuw, nog in de doos."], "answer": 1, "explanation": "Er staat: nog helemaal heel, alleen achterop een klein krasje."}, {"slide_index": 7, "cat": "§1.8 · OEFENING 6", "type": "mcq", "prompt": "Wat betekent 'bieden mag' in de advertentie?", "options": ["Je mag een lagere prijs voorstellen.", "De prijs staat vast.", "Je moet contant betalen."], "answer": 0, "explanation": "Bieden is zelf een prijs noemen; de verkoper zegt dat dat mag."}, {"slide_index": 8, "cat": "§1.8 · OEFENING 7", "type": "mcq", "prompt": "Waarom vindt de verkoper 35 euro niet genoeg?", "options": ["Hij wil niet verkopen.", "Hij wil de spiegel opsturen.", "Hij vindt dat bod te laag."], "answer": 2, "explanation": "Hij antwoordt letterlijk: 35 vind ik te laag."}, {"slide_index": 9, "cat": "§1.8 · OEFENING 8", "type": "mcq", "prompt": "Hoe groot is de spiegel?", "options": ["Tien jaar oud.", "Zestig centimeter doorsnede.", "Vijfenveertig centimeter breed."], "answer": 1, "explanation": "Er staat: rond, doorsnede 60 cm. Tien jaar is hoe lang hij er hing."}, {"slide_index": 10, "cat": "§1.8 · OEFENING 9", "type": "mcq", "prompt": "Wat betekent 'tweedehands'?", "options": ["al eerder door iemand anders gebruikt", "helemaal nieuw", "van twee stukken gemaakt"], "answer": 0, "explanation": "Tweedehands is wat iemand anders al gebruikt heeft."}, {"slide_index": 11, "cat": "§1.8 · OEFENING 10", "type": "mcq", "prompt": "Wat betekent 'opsturen'?", "options": ["iets omhoog tillen", "iets terugbrengen naar de winkel", "met de post naar iemand toe sturen"], "answer": 2, "explanation": "Opsturen is per post versturen."}, {"slide_index": 12, "cat": "§1.8 · OEFENING 11", "type": "matching", "prompt": "Wat hoort bij elkaar?", "options": [], "answer": null, "explanation": "Elk woord past bij precies één uitleg."}, {"slide_index": 13, "cat": "§1.8 · OEFENING 12", "type": "matching", "prompt": "Wat hoort bij elkaar?", "options": [], "answer": null, "explanation": "Zoek de uitleg die erbij hoort."}, {"slide_index": 14, "cat": "§1.8 · OEFENING 13", "type": "cloze", "prompt": "Ik heb de kast ……… gekocht, hij was al vijf jaar oud.", "options": ["tweedehands", "rond", "breed"], "answer": "tweedehands", "explanation": "Tweedehands is al eerder gebruikt."}, {"slide_index": 15, "cat": "§1.8 · OEFENING 14", "type": "cloze", "prompt": "De tafel is te ……… om alleen te tillen.", "options": ["zware", "zwaar", "zwaarder"], "answer": "zwaar", "explanation": "Achter het werkwoord blijft het bijvoeglijk naamwoord kaal."}, {"slide_index": 16, "cat": "§1.8 · OEFENING 15", "type": "cloze", "prompt": "Het kleed is van ……… en voelt heel warm aan.", "options": ["wol", "hout", "glas"], "answer": "wol", "explanation": "Wol is het materiaal van veel kleden."}, {"slide_index": 17, "cat": "§1.8 · OEFENING 16", "type": "cloze", "prompt": "Zij ……… hun oude bank via een advertentie.", "options": ["verkoopt", "verkoop", "verkopen"], "answer": "verkopen", "explanation": "Zij is hier meer mensen; zonder teken zou het één persoon zijn."}, {"slide_index": 18, "cat": "§1.8 · OEFENING 17", "type": "cloze", "prompt": "Ik ……… veertig euro voor die spiegel.", "options": ["bied", "biedt", "bieden"], "answer": "bied", "explanation": "De ik-vorm is de stam zonder t."}, {"slide_index": 19, "cat": "§1.8 · OEFENING 18", "type": "cloze", "prompt": "De spiegel is te breed, dus ik kan hem niet ……… .", "options": ["stuur op", "opsturen", "opgestuurd"], "answer": "opsturen", "explanation": "Na kan komt het hele werkwoord, achteraan."}, {"slide_index": 20, "cat": "§1.8 · OEFENING 19", "type": "cloze", "prompt": "Op de ……… stond dat de spiegel veertig euro moest kosten.", "options": ["advertentie", "spiegel", "centimeter"], "answer": "advertentie", "explanation": "Een advertentie is het bericht waarin iets te koop staat."}, {"slide_index": 21, "cat": "§1.8 · OEFENING 20", "type": "cloze", "prompt": "Deze tafel is honderd twintig ……… breed.", "options": ["meter", "kilo", "centimeter"], "answer": "centimeter", "explanation": "Voor een meubel meet je in centimeters."}, {"slide_index": 22, "cat": "§1.8 · OEFENING 21", "type": "word_bank", "prompt": "", "options": ["Ik", "heb", "deze", "kast", "tweedehands", "gekocht"], "answer": "Ik heb deze kast tweedehands gekocht.", "explanation": "Heb op plek 2, gekocht helemaal achteraan."}, {"slide_index": 23, "cat": "§1.8 · OEFENING 22", "type": "word_bank", "prompt": "", "options": ["De", "spiegel", "is", "te", "zwaar", "om", "op", "te", "sturen"], "answer": "De spiegel is te zwaar om op te sturen.", "explanation": "Bij een scheidbaar werkwoord komt te tussen op en sturen."}, {"slide_index": 24, "cat": "§1.8 · OEFENING 23", "type": "word_bank", "prompt": "", "options": ["Zaterdagochtend", "kom", "ik", "de", "spiegel", "ophalen"], "answer": "Zaterdagochtend kom ik de spiegel ophalen.", "explanation": "De tijd staat vooraan, dus het werkwoord komt vóór ik."}, {"slide_index": 25, "cat": "§1.8 · OEFENING 24", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Drie zinnen; hoofdletter vooraan, punt aan het eind."}, {"slide_index": 26, "cat": "§1.8 · OEFENING 25", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 27, "cat": "§1.8 · OEFENING 26", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 28, "cat": "§1.8 · OEFENING 27", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 29, "cat": "§1.8 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 30, "cat": "§1.8 · OEFENING 29", "type": "writing-prompt", "prompt": "Schrijf zelf een advertentie voor iets tweedehands: wat het is, hoe groot, in welke staat, de prijs, en hoe iemand het krijgt.", "options": [], "answer": null, "explanation": ""}]}, "1.9": {"code": "1.9", "title": "De grote kast, de kleine spiegel", "total_slides": 36, "slides": [{"type": "title_card", "cat": "§1.9 · INTRO", "title": "A2 Thema 1: Verhuizen — §1.9", "subtitle": "De grote kast, de kleine spiegel", "concepts": ["bijvoeglijk-naamwoord-basis"]}, {"type": "explanation_nl", "cat": "§1.9 · GRAMMATICA", "title": "De grote kast, de kleine spiegel", "content_html": "<div class=\"uitleg-box\"><h3>🎨 Het bijvoeglijk naamwoord krijgt meestal -e</h3><table><tr><th>woord</th><th>voorbeeld</th></tr><tr><td>de-woord</td><td><bdi dir=\"ltr\">de <strong>grote</strong> kast</bdi></td></tr><tr><td>het-woord met <em>het</em></td><td><bdi dir=\"ltr\">het <strong>grote</strong> huis</bdi></td></tr><tr><td>een + de-woord</td><td><bdi dir=\"ltr\">een <strong>grote</strong> kast</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>De uitzondering: een + het-woord</h3><p>Bij <strong>een</strong> + een het-woord komt er <strong>geen -e</strong>.</p><p><bdi dir=\"ltr\">een <strong>groot</strong> huis</bdi> &nbsp; <bdi dir=\"ltr\">een <strong>klein</strong> balkon</bdi></p><p>Vergelijk: <em>het grote huis</em> (met -e) &rarr; <em>een groot huis</em> (zonder -e).</p></div>"}, {"type": "explanation_trans_en", "cat": "§1.9 · UITLEG (EN)", "title": "Vertaling (Engels)", "content_html": "<div class=\"uitleg-box\"><h3>🎨 The adjective usually gets -e</h3><table><tr><th>word</th><th>example</th></tr><tr><td>de-word</td><td><bdi dir=\"ltr\">de <strong>grote</strong> kast</bdi></td></tr><tr><td>het-word with het</td><td><bdi dir=\"ltr\">het <strong>grote</strong> huis</bdi></td></tr><tr><td>een + de-word</td><td><bdi dir=\"ltr\">een <strong>grote</strong> kast</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>The exception: een + het-word</h3><p>After <strong>een</strong> + a het-word there is <strong>no -e</strong>.</p><p><bdi dir=\"ltr\">een <strong>groot</strong> huis</bdi> &nbsp; <bdi dir=\"ltr\">een <strong>klein</strong> balkon</bdi></p><p>Compare: <em>het grote huis</em> (with -e) &rarr; <em>een groot huis</em> (without -e).</p></div>"}, {"type": "explanation_trans_tr", "cat": "§1.9 · UITLEG (TR)", "title": "Vertaling (Turks)", "content_html": "<div class=\"uitleg-box\"><h3>🎨 Sıfat genellikle -e alır</h3><table><tr><th>kelime</th><th>örnek</th></tr><tr><td>de-kelimesi</td><td><bdi dir=\"ltr\">de <strong>grote</strong> kast</bdi></td></tr><tr><td>het ile het-kelimesi</td><td><bdi dir=\"ltr\">het <strong>grote</strong> huis</bdi></td></tr><tr><td>een + de-kelimesi</td><td><bdi dir=\"ltr\">een <strong>grote</strong> kast</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>İstisna: een + het-kelimesi</h3><p><strong>een</strong> + het-kelimesinden sonra <strong>-e yoktur</strong>.</p><p><bdi dir=\"ltr\">een <strong>groot</strong> huis</bdi> &nbsp; <bdi dir=\"ltr\">een <strong>klein</strong> balkon</bdi></p><p>Karşılaştır: <em>het grote huis</em> (-e ile) &rarr; <em>een groot huis</em> (-e siz).</p></div>"}, {"type": "explanation_trans_ar", "cat": "§1.9 · UITLEG (AR)", "title": "Vertaling (Arabisch)", "content_html": "<div class=\"uitleg-box\"><h3>🎨 الصفة تأخذ عادةً <bdi dir=\"ltr\">-e</bdi></h3><table><tr><th>كلمة</th><th>مثال</th></tr><tr><td>كلمة <bdi dir=\"ltr\">de</bdi></td><td><bdi dir=\"ltr\">de <strong>grote</strong> kast</bdi></td></tr><tr><td>كلمة <bdi dir=\"ltr\">het</bdi> مع <bdi dir=\"ltr\">het</bdi></td><td><bdi dir=\"ltr\">het <strong>grote</strong> huis</bdi></td></tr><tr><td><bdi dir=\"ltr\">een</bdi> + كلمة <bdi dir=\"ltr\">de</bdi></td><td><bdi dir=\"ltr\">een <strong>grote</strong> kast</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>الاستثناء: <bdi dir=\"ltr\">een</bdi> + كلمة <bdi dir=\"ltr\">het</bdi></h3><p>بعد <strong><bdi dir=\"ltr\">een</bdi></strong> + كلمة <bdi dir=\"ltr\">het</bdi> لا يوجد <strong><bdi dir=\"ltr\">-e</bdi></strong>.</p><p><bdi dir=\"ltr\">een <strong>groot</strong> huis</bdi> &nbsp; <bdi dir=\"ltr\">een <strong>klein</strong> balkon</bdi></p><p>قارن: <em><bdi dir=\"ltr\">het grote huis</bdi></em> (مع <bdi dir=\"ltr\">-e</bdi>) &rarr; <em><bdi dir=\"ltr\">een groot huis</bdi></em> (بدون <bdi dir=\"ltr\">-e</bdi>).</p></div>"}, {"type": "explanation_trans_pt", "cat": "§1.9 · UITLEG (PT)", "title": "Vertaling (Portugees)", "content_html": "<div class=\"uitleg-box\"><h3>🎨 O adjetivo geralmente recebe -e</h3><table><tr><th>palavra</th><th>exemplo</th></tr><tr><td>palavra de</td><td><bdi dir=\"ltr\">de <strong>grote</strong> kast</bdi></td></tr><tr><td>palavra het com het</td><td><bdi dir=\"ltr\">het <strong>grote</strong> huis</bdi></td></tr><tr><td>een + palavra de</td><td><bdi dir=\"ltr\">een <strong>grote</strong> kast</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>A exceção: een + palavra het</h3><p>Depois de <strong>een</strong> + palavra het <strong>não há -e</strong>.</p><p><bdi dir=\"ltr\">een <strong>groot</strong> huis</bdi> &nbsp; <bdi dir=\"ltr\">een <strong>klein</strong> balkon</bdi></p><p>Compara: <em>het grote huis</em> (com -e) &rarr; <em>een groot huis</em> (sem -e).</p></div>"}, {"type": "explanation_trans_om", "cat": "§1.9 · UITLEG (OM)", "title": "Vertaling (Oromo)", "content_html": "<div class=\"uitleg-box\"><h3>🎨 Ibsi maqaa yeroo baay'ee -e fudhata</h3><table><tr><th>jecha</th><th>fakkeenya</th></tr><tr><td>jecha de</td><td><bdi dir=\"ltr\">de <strong>grote</strong> kast</bdi></td></tr><tr><td>jecha het het waliin</td><td><bdi dir=\"ltr\">het <strong>grote</strong> huis</bdi></td></tr><tr><td>een + jecha de</td><td><bdi dir=\"ltr\">een <strong>grote</strong> kast</bdi></td></tr></table></div><div class=\"uitleg-box\"><h3>Waan addaa: een + jecha het</h3><p><strong>een</strong> + jecha het booda <strong>-e hin jiru</strong>.</p><p><bdi dir=\"ltr\">een <strong>groot</strong> huis</bdi> &nbsp; <bdi dir=\"ltr\">een <strong>klein</strong> balkon</bdi></p><p>Wal bira qabi: <em>het grote huis</em> (-e waliin) &rarr; <em>een groot huis</em> (-e malee).</p></div>"}, {"slide_index": 8, "cat": "§1.9 · OEFENING 1", "type": "cloze", "prompt": "Ik zoek een ……… kast voor in de slaapkamer.", "options": ["grote", "groot", "groten"], "answer": "grote", "explanation": "Kast is een de-woord, dus ook na een komt er een -e bij."}, {"slide_index": 9, "cat": "§1.9 · OEFENING 2", "type": "cloze", "prompt": "Wij hebben een ……… kleed in de woonkamer gelegd.", "options": ["kleine", "klein", "kleinen"], "answer": "klein", "explanation": "Kleed is een het-woord, en na een blijft het bijvoeglijk naamwoord dan kaal."}, {"slide_index": 10, "cat": "§1.9 · OEFENING 3", "type": "cloze", "prompt": "De ……… spiegel in de gang is tweedehands.", "options": ["ronde", "rond", "ronden"], "answer": "ronde", "explanation": "Na de komt er altijd een -e bij."}, {"slide_index": 11, "cat": "§1.9 · OEFENING 4", "type": "cloze", "prompt": "Het ……… kastje naast de deur is van hout.", "options": ["laag", "lagen", "lage"], "answer": "lage", "explanation": "Na het komt er ook een -e bij; alleen na een blijft het kaal."}, {"slide_index": 12, "cat": "§1.9 · OEFENING 5", "type": "cloze", "prompt": "In de advertentie staat een ……… tafel van oud hout.", "options": ["brede", "breed", "breden"], "answer": "brede", "explanation": "Tafel is een de-woord, dus met -e."}, {"slide_index": 13, "cat": "§1.9 · OEFENING 6", "type": "cloze", "prompt": "Zij verkoopt een ……… kleed van wol.", "options": ["ronde", "rond", "ronden"], "answer": "rond", "explanation": "Kleed is een het-woord en er staat een voor: geen -e."}, {"slide_index": 14, "cat": "§1.9 · OEFENING 7", "type": "cloze", "prompt": "De dozen zijn te ……… om alleen te dragen.", "options": ["zwaar", "zware", "zwaren"], "answer": "zwaar", "explanation": "Hier staat het bijvoeglijk naamwoord achter het werkwoord, en dan blijft het kaal."}, {"slide_index": 15, "cat": "§1.9 · OEFENING 8", "type": "cloze", "prompt": "We hebben ……… dozen naar boven gedragen.", "options": ["zwaar", "zwaren", "zware"], "answer": "zware", "explanation": "Voor een meervoud komt er altijd een -e bij, ook zonder lidwoord."}, {"slide_index": 16, "cat": "§1.9 · OEFENING 9", "type": "cloze", "prompt": "Mijn buurvrouw heeft een ……… tuin achter haar huis.", "options": ["mooie", "mooi", "mooien"], "answer": "mooie", "explanation": "Tuin is een de-woord, dus met -e."}, {"slide_index": 17, "cat": "§1.9 · OEFENING 10", "type": "cloze", "prompt": "Dat is een ……… bericht, ik begrijp het niet.", "options": ["onduidelijke", "onduidelijk", "onduidelijken"], "answer": "onduidelijk", "explanation": "Bericht is een het-woord met een ervoor: geen -e."}, {"slide_index": 18, "cat": "§1.9 · OEFENING 11", "type": "cloze", "prompt": "Het ……… huis aan de overkant staat te koop.", "options": ["oude", "oud", "ouden"], "answer": "oude", "explanation": "Na het komt er een -e bij."}, {"slide_index": 19, "cat": "§1.9 · OEFENING 12", "type": "cloze", "prompt": "Zij zoekt een ……… kast, niet zo'n grote.", "options": ["klein", "kleinen", "kleine"], "answer": "kleine", "explanation": "Kast is een de-woord, dus ook na een met -e."}, {"slide_index": 20, "cat": "§1.9 · OEFENING 13", "type": "word_bank", "prompt": "", "options": ["Ik", "zoek", "een", "grote", "kast", "voor", "de", "slaapkamer"], "answer": "Ik zoek een grote kast voor de slaapkamer.", "explanation": "Een plus een de-woord geeft de -e."}, {"slide_index": 21, "cat": "§1.9 · OEFENING 14", "type": "word_bank", "prompt": "", "options": ["Wij", "hebben", "een", "klein", "kleed", "in", "de", "gang"], "answer": "Wij hebben een klein kleed in de gang.", "explanation": "Een plus een het-woord geeft geen -e."}, {"slide_index": 22, "cat": "§1.9 · OEFENING 15", "type": "word_bank", "prompt": "", "options": ["De", "ronde", "spiegel", "is", "van", "oud", "hout"], "answer": "De ronde spiegel is van oud hout.", "explanation": "Na de een -e; hout heeft geen lidwoord en blijft in dit geval kaal."}, {"slide_index": 23, "cat": "§1.9 · OEFENING 16", "type": "word_bank", "prompt": "", "options": ["Die", "zware", "dozen", "moeten", "naar", "boven"], "answer": "Die zware dozen moeten naar boven.", "explanation": "Voor een meervoud altijd een -e."}, {"slide_index": 24, "cat": "§1.9 · OEFENING 17", "type": "word_bank", "prompt": "", "options": ["Het", "lage", "kastje", "past", "precies", "naast", "de", "deur"], "answer": "Het lage kastje past precies naast de deur.", "explanation": "Na het komt er een -e bij."}, {"slide_index": 25, "cat": "§1.9 · OEFENING 18", "type": "word_bank", "prompt": "", "options": ["Zij", "verkoopt", "een", "breed", "bed", "van", "hout"], "answer": "Zij verkoopt een breed bed van hout.", "explanation": "Bed is een het-woord met een ervoor: kaal."}, {"slide_index": 26, "cat": "§1.9 · OEFENING 19", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Ik heb een kleine kleed gekocht.", "Ik heb een klein kleed gekocht.", "Ik heb een kleinen kleed gekocht."], "answer": 1, "explanation": "Kleed is een het-woord, en na een blijft het bijvoeglijk naamwoord kaal."}, {"slide_index": 27, "cat": "§1.9 · OEFENING 20", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["De groot kast staat in de gang.", "De groten kast staat in de gang.", "De grote kast staat in de gang."], "answer": 2, "explanation": "Na de komt er altijd een -e bij."}, {"slide_index": 28, "cat": "§1.9 · OEFENING 21", "type": "mcq", "prompt": "Welke zin is goed?", "options": ["Die dozen zijn te zware.", "Die dozen zijn te zwaar.", "Die zware dozen zijn te."], "answer": 1, "explanation": "Achter het werkwoord blijft het bijvoeglijk naamwoord kaal."}, {"slide_index": 29, "cat": "§1.9 · OEFENING 22", "type": "mcq", "prompt": "Wanneer krijgt het bijvoeglijk naamwoord GEEN -e?", "options": ["Na de bij een de-woord.", "Voor een meervoud.", "Na een bij een het-woord."], "answer": 2, "explanation": "Alleen een plus een het-woord laat de -e weg: een klein kleed."}, {"slide_index": 30, "cat": "§1.9 · OEFENING 23", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Twee zinnen; let op waar de -e wel en niet staat."}, {"slide_index": 31, "cat": "§1.9 · OEFENING 24", "type": "herschrijven", "prompt": "", "options": [], "answer": null, "explanation": "Hoofdletter vooraan, punt aan het eind."}, {"slide_index": 32, "cat": "§1.9 · OEFENING 25", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 33, "cat": "§1.9 · OEFENING 26", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 34, "cat": "§1.9 · OEFENING 27", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 35, "cat": "§1.9 · OEFENING 28", "type": "speaking", "prompt": "Zeg deze zin hardop na.", "options": [], "answer": null, "explanation": ""}, {"slide_index": 36, "cat": "§1.9 · OEFENING 29", "type": "writing-prompt", "prompt": "Beschrijf drie meubels bij jou thuis. Gebruik bij elk een bijvoeglijk naamwoord, en let op de -e.", "options": [], "answer": null, "explanation": ""}]}};
        let currentCode = "1.2";
        let currentSlideIndex = 0;

        function init() {
            const select = document.getElementById("lesSelect");
            select.innerHTML = "";
            Object.keys(DECKS).forEach(code => {
                const d = DECKS[code];
                const opt = document.createElement("option");
                opt.value = code;
                opt.textContent = `§${code}: ${d.title} (${d.total_slides} dia's)`;
                select.appendChild(opt);
            });
            switchLesson(Object.keys(DECKS)[0]);
        }

        function switchLesson(code) {
            currentCode = code;
            currentSlideIndex = 0;
            buildProgressBar();
            renderSlide();
        }

        function buildProgressBar() {
            const deck = DECKS[currentCode];
            const bar = document.getElementById("progressBar");
            bar.innerHTML = "";
            for (let i = 0; i < deck.total_slides; i++) {
                const step = document.createElement("div");
                step.className = "progress-step" + (i === 0 ? " active" : "");
                bar.appendChild(step);
            }
        }

        function renderSlide() {
            const deck = DECKS[currentCode];
            const slide = deck.slides[currentSlideIndex];
            const total = deck.total_slides;

            // Update Progress Header
            const steps = document.querySelectorAll('.progress-step');
            steps.forEach((step, idx) => {
                step.className = 'progress-step';
                if (idx < currentSlideIndex) step.classList.add('completed');
                if (idx === currentSlideIndex) step.classList.add('active');
            });

            document.getElementById('stepCategory').innerText = slide.cat || 'GRAMMATICA';
            document.getElementById('stepNumber').innerText = `BLADZIJDE ${currentSlideIndex + 1} VAN ${total}`;
            document.getElementById('slideCounter').innerText = `${currentSlideIndex + 1} / ${total}`;

            document.getElementById('btnPrev').disabled = currentSlideIndex === 0;
            document.getElementById('btnNext').innerText = currentSlideIndex === total - 1 ? 'Klaar ✓' : 'Volgende →';

            const container = document.getElementById("screenContent");
            container.innerHTML = "";

            if (slide.type === "title_card") {
                container.innerHTML = `
                    <div class="card-box" style="text-align:center; padding: 40px 20px;">
                        <span class="tag-pill">PARAGRAAF ${currentCode}</span>
                        <h1 class="card-title" style="justify-content:center; font-size:28px; margin-top:12px;">${slide.title}</h1>
                        <p style="font-size:18px; color:var(--text-muted); margin-top:8px;">${slide.subtitle}</p>
                    </div>

                    <div class="card-box" style="text-align:center;">
                        <h3 style="font-size:16px; font-weight:800; margin-bottom:12px;">Te behandelen grammaticaconcepten:</h3>
                        <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
                            ${(slide.concepts || []).map(c => `<span class="tag-pill" style="background:var(--bg-muted); color:var(--text-main); border:1px solid var(--border-card);">📌 ${c}</span>`).join('')}
                        </div>
                    </div>
                `;
            } else if (slide.type.startsWith("explanation")) {
                container.innerHTML = `
                    <div class="card-box">
                        <span class="tag-pill">${slide.cat}</span>
                        <h2 class="card-title" style="margin-top:8px;">${slide.title || 'Uitleg & Regels'}</h2>
                    </div>

                    <div class="card-box" style="line-height:1.6; font-size:16px;">
                        ${slide.content_html}
                    </div>
                `;
            } else {
                // Exercise Slide
                let optionsHtml = "";
                let isWordBank = slide.type === "word_bank" || slide.type === "herschrijven";

                if (isWordBank) {
                    const tiles = slide.options || [];
                    optionsHtml = `
                        <div class="card-box">
                            <span class="tag-pill">TEGELS SCHUIVEN</span>
                            <p style="font-size:14px; color:var(--text-muted); margin-top:4px;">Klik op de woorden om de juiste zin te bouwen:</p>
                        </div>

                        <div class="word-bank-target" id="targetBox"></div>

                        <div class="word-tiles" id="tilesBox">
                            ${tiles.map((t, idx) => `<button class="tile-btn" onclick="clickTile(this, '${t.replace(/'/g, "\'")}')">${t}</button>`).join('')}
                        </div>

                        <button class="toggle-btn" style="margin-top:12px; width:100%; justify-content:center;" onclick="resetTiles()">🔄 Opnieuw proberen</button>
                    `;
                } else if (slide.options && slide.options.length > 0) {
                    optionsHtml = `
                        <div class="options-grid">
                            ${slide.options.map((opt, idx) => `
                                <button class="option-btn" onclick="checkMcq(this, ${idx}, ${JSON.stringify(slide.answer)})">
                                    <span>${typeof opt === 'object' ? (opt.text || JSON.stringify(opt)) : opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    `;
                }

                let answerStr = "";
                if (typeof slide.answer === "number" && slide.options && slide.options[slide.answer]) {
                    answerStr = slide.options[slide.answer];
                } else if (slide.answer !== undefined) {
                    answerStr = slide.answer;
                }

                container.innerHTML = `
                    <div class="card-box">
                        <span class="tag-pill">${slide.cat}</span>
                        <h2 class="card-title" style="margin-top:8px;">${slide.prompt}</h2>
                    </div>

                    ${optionsHtml}

                    <div class="feedback-drawer" id="feedbackDrawer">
                        <div style="font-weight:900; font-size:16px; margin-bottom:4px;">✅ Correct Antwoord:</div>
                        <div style="font-weight:800; font-size:18px; color:var(--text-main);">${answerStr}</div>
                        ${slide.explanation ? `<div style="font-size:14px; margin-top:6px; color:var(--text-muted);">💡 <em>${slide.explanation}</em></div>` : ''}
                    </div>

                    <button class="toggle-btn" style="margin-top:10px; width:100%; justify-center;" onclick="toggleAnswerDrawer()">👁️ Toon Antwoord & Uitleg</button>
                `;
            }
        }

        function checkMcq(btn, idx, answer) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.remove('correct', 'wrong'));
            
            let isCorrect = (idx === answer) || (btn.innerText.trim() === String(answer).trim());
            if (isCorrect) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
            }
            toggleAnswerDrawer(true);
        }

        function toggleAnswerDrawer(forceShow = false) {
            const drawer = document.getElementById("feedbackDrawer");
            if (drawer) {
                if (forceShow) {
                    drawer.style.display = "block";
                } else {
                    drawer.style.display = drawer.style.display === "block" ? "none" : "block";
                }
            }
        }

        let sentenceWords = [];
        function clickTile(btn, word) {
            if (btn.classList.contains('selected')) return;
            btn.classList.add('selected');
            sentenceWords.push(word);
            renderTarget();
        }

        function renderTarget() {
            const target = document.getElementById('targetBox');
            if (target) {
                target.innerHTML = '';
                sentenceWords.forEach(w => {
                    const chip = document.createElement('span');
                    chip.className = 'tile-btn';
                    chip.style.background = 'var(--leskleur-light)';
                    chip.style.color = 'var(--leskleur)';
                    chip.innerText = w;
                    target.appendChild(chip);
                });
            }
        }

        function resetTiles() {
            sentenceWords = [];
            const target = document.getElementById('targetBox');
            if (target) target.innerHTML = '';
            document.querySelectorAll('.word-tiles .tile-btn').forEach(b => b.classList.remove('selected'));
        }

        function changeSlide(dir) {
            const deck = DECKS[currentCode];
            currentSlideIndex += dir;
            if (currentSlideIndex < 0) currentSlideIndex = 0;
            if (currentSlideIndex >= deck.total_slides) currentSlideIndex = deck.total_slides - 1;
            renderSlide();
        }

        function setMode(mode) {
            const frame = document.getElementById('mainFrame');
            const btnPhone = document.getElementById('btnPhone');
            const btnBeamer = document.getElementById('btnBeamer');

            if (mode === 'beamer') {
                frame.classList.add('beamer-mode');
                btnBeamer.classList.add('active');
                btnPhone.classList.remove('active');
            } else {
                frame.classList.remove('beamer-mode');
                btnPhone.classList.add('active');
                btnBeamer.classList.remove('active');
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('btnTheme').innerText = newTheme === 'dark' ? '☀️ Licht Thema' : '🌙 Donker Thema';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'Space') changeSlide(1);
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'Enter') toggleAnswerDrawer();
        });

        window.onload = init;
    </script>
</body>
</html>
