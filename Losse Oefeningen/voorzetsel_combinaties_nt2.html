function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const filtered = data.filter(d => {
    if (!q) return true;
    return d.v.toLowerCase().includes(q) ||
           d.p.includes(q) ||
           d.en.toLowerCase().includes(q) ||
           d.nl.toLowerCase().includes(q) ||
           d.en_m.toLowerCase().includes(q);
  });

  document.getElementById("count").textContent =
    filtered.length + (filtered.length === 1 ? " combinatie zichtbaar" : " combinaties zichtbaar");

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">Geen resultaten gevonden. Probeer een ander woord.</div>';
    return;
  }

  filtered.forEach((d, i) => {
    const prev = filtered[i - 1];
    const next = filtered[i + 1];
    const linkedTop = next && next.v === d.v;
    const linkedBottom = prev && prev.v === d.v;

    const classes = ["card"];
    if (linkedTop) classes.push("linked-top");
    if (linkedBottom) classes.push("linked-bottom");

    const card = document.createElement("div");
    card.className = classes.join(" ");
    card.innerHTML = `
      <div class="head">
        <span class="verb">${d.v}</span>
        <span class="prep">${d.p}</span>
        <span class="en-tag">${d.en}</span>
      </div>
      <div class="meaning">
        ${d.nl}
        <span class="en-m">${d.en_m}</span>
      </div>
      <div class="examples">
        ${d.ex.map(e => `
          <div class="ex">
            <div class="nl">${e.nl}</div>
            <div class="en-ex">${e.en}</div>
          </div>
        `).join("")}
      </div>
    `;
    grid.appendChild(card);
  });
}
