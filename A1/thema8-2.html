<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>8.2 Woorden leren — Gesloten — NT2 A1</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const t = localStorage.getItem('a1-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <nav class="language-bar" aria-label="Taalkeuze">
        <button id="theme-toggle" class="lang-btn" style="border-color:var(--secondary);color:var(--secondary);">🌓</button>

        <span class="lang-btn">🇸🇦 العربية</span>
        <span class="lang-btn">🇹🇷 Türkçe</span>
    </nav>

    <main class="page-container">
        <a href="thema8.html" class="back-link">← Terug naar Thema 8</a>
        
        <header class="page-header" style="text-align: center; padding: 60px 20px; background: var(--theme-bg); border-radius: var(--radius-md); border: 2px dashed var(--border-med); margin-top: 40px;">
            <div class="breadcrumb" style="justify-content: center; margin-bottom: 20px;">
                <a href="index.html">Thema's</a><span>›</span>
                <a href="thema8.html">Thema 8</a><span>›</span>
                <span>8.2</span>
            </div>
            <div style="font-size: 4rem; margin-bottom: 20px;">🔒</div>
            <h1 style="font-size: 2.2rem; margin-bottom: 15px; color: var(--text-dark);">Paragraaf 8.2 is gesloten</h1>

    <footer class="site-footer" style="margin-top: 60px;">NT2 A1 Leerplatform &copy; 2026</footer>

    <script>
        // Theme Toggle
        (function(){
            const t = document.getElementById('theme-toggle');
            if(!t) return;
            t.addEventListener('click', () => {
                let th = document.documentElement.getAttribute('data-theme') || 'light';
                let nt = th === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', nt);
                localStorage.setItem('a1-theme', nt);
            });
        })();
    </script>
</body>
