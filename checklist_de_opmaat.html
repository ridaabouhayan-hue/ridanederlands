<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammatica Checklist & Zinnenbouwer (De Opmaat) — NT2</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f1729;
            --bg-card: #182040;
            --bg-card-light: #222b54;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-orange: #e67e22;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(148, 163, 184, 0.1);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(ellipse at 10% 10%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 90%, rgba(230, 126, 34, 0.06) 0%, transparent 50%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Back button */
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 700;
            padding: 10px 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .back-link:hover {
            transform: translateX(-3px);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 600;
        }

        /* Progress Bar Card */
        .progress-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.15);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(148, 163, 184, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: var(--text-primary);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        /* Grid */
        .checklist-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        /* Checklist Item */
        .checklist-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .checklist-item:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .checklist-checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        .checklist-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--text-secondary);
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .checklist-checkbox:checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checklist-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 0.95rem;
            font-weight: 900;
        }

        .checklist-content {
            flex: 1;
        }

        .checklist-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .checklist-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .checklist-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .example-badge {
            display: inline-block;
            background: rgba(230, 126, 34, 0.12);
            color: var(--accent-orange);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(230, 126, 34, 0.2);
        }

        .lang-switch-inline {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .lang-switch-btn {
            cursor: pointer;
            font-weight: 800;
            text-decoration: underline;
        }
        .lang-switch-btn:hover {
            color: var(--text-primary);
        }

        /* ── SECTION ZINNENBOUWER ── */
        .builder-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid var(--border-color);
            margin-top: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .builder-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .builder-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .challenge-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .challenge-btn {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-card-light);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .challenge-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .challenge-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: var(--text-primary);
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        .workspace {
            background: var(--bg-dark);
            border-radius: 16px;
            padding: 24px;
            border: 2px dashed rgba(148, 163, 184, 0.2);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .workspace-placeholder {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .workspace-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .word-bank {
            background: var(--bg-card-light);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bank-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bank-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .word-chip {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }

        .word-chip:hover {
            border-color: var(--accent-blue);
            transform: scale(1.03);
            background: var(--bg-card-light);
        }

        .word-chip.used {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 10px 22px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            background: rgba(148, 163, 184, 0.15);
        }

        .builder-feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            display: none;
            line-height: 1.5;
        }

        .builder-feedback.correct {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .builder-feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .speech-btn-inline {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            vertical-align: middle;
            margin-left: 6px;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-wrap: nowrap;
            }
            .challenge-tabs {
                flex-direction: column;
            }
        }

        /* Expanded Practice Area Styles */
        .checklist-item {
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: all 0.2s ease;
        }
        .checklist-item.expanded {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
        }
        .expand-chevron {
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: transform 0.2s ease;
            margin-left: 8px;
            pointer-events: none;
        }
        .checklist-item.expanded .expand-chevron {
            transform: rotate(180deg);
            color: var(--accent-blue);
        }
        .practice-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: none;
            cursor: default;
            width: 100%;
        }
        .practice-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin-bottom: 10px;
        }
        .examples-wrap {
            margin-bottom: 15px;
        }
        .example-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .example-text {
            color: var(--text-primary);
            font-style: italic;
        }
        .quiz-card {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
        }
        .quiz-q {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .quiz-opt {
            background: var(--bg-card-light);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
            color: var(--text-secondary);
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            transition: all 0.15s ease;
            width: 100%;
        }
        .quiz-opt:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.08);
        }
        .quiz-opt.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
        }
        .quiz-opt.incorrect {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }
        .quiz-fb {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .quiz-fb.correct {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }
        .quiz-fb.incorrect {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .quiz-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: opacity 0.15s;
        }
        .quiz-btn:hover {
            opacity: 0.9;
        }
        .quiz-score-view {
            text-align: center;
            padding: 10px 0;
        }
        .quiz-score-view h4 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- TERUG LINK -->
    <a href="index.html" class="back-link">← Terug naar Hoofdmenu</a>

    <!-- HEADER -->
    <div class="header">
        <h1>📋 Grammatica Checklist (De Opmaat)</h1>
        <p>Volg je voortgang door alle 31 grammaticasystemen van De Opmaat af te vinken. Gebruik onderaan de zinnenbouwer om te oefenen!</p>
    </div>

    <!-- PROGRESS CARD -->
    <div class="progress-card">
        <div class="progress-info">
            <span>Mijn Voortgang</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); text-align: right; font-weight: 600;">
            <span id="completed-count">0</span> van de 31 onderwerpen beheerst
        </div>
    </div>

    <!-- CATEGORY TABS -->
    <div class="tabs" id="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('all')">Alles tonen</button>
        <button class="tab-btn" onclick="switchCategory('cat1')">Thema 1 & 2</button>
        <button class="tab-btn" onclick="switchCategory('cat2')">Thema 3 & 4</button>
        <button class="tab-btn" onclick="switchCategory('cat3')">Thema 5 & 6</button>
        <button class="tab-btn" onclick="switchCategory('cat4')">Thema 7 & 8</button>
        <button class="tab-btn" onclick="switchCategory('cat5')">Thema 9 & Werk</button>
    </div>

    <!-- CHECKLIST GRID -->
    <div class="checklist-grid" id="checklist-container">
        <!-- Rendered dynamically by JS -->
    </div>
</div>

<!-- DATA AND SCRIPT LOGIC -->
<script>
    // 31 Grammar topics for De Opmaat
    const grammarTopics = [
        // Categorie 1: Thema 1 & 2
        { id: 1, cat: 'cat1', title: 'Verbum presens (Stam + t)', desc_nl: 'Vervoegen van werkwoorden in de tegenwoordige tijd (ik werk, jij werkt, hij werkt).', desc_en: 'Conjugating singular and plural verbs in the present tense (stem + t).', desc_pl: 'Odmiana czasowników w czasie teraźniejszym (temat + t).', ex: 'Ik heet Alex, jij woont in Amsterdam.' },
        { id: 2, cat: 'cat1', title: 'Zinsbouw: Hoofdzin (Onderwerp-Werkwoord-TOP)', desc_nl: 'De normale zinsvolgorde in het Nederlands: het werkwoord staat ALTIJD op de tweede positie.', desc_en: 'Standard main clause word order: Verb is always in position 2.', desc_pl: 'Szyk zdania głównego: Czasownik zawsze na drugiej pozycji.', ex: 'Wij maken vandaag een afspraak.' },
        { id: 3, cat: 'cat1', title: 'Zinsbouw: Vraagzinnen', desc_nl: 'Vraagzinnen maken met inversie (werkwoord vooraan) of met een interrogatief vraagwoord (wie, wat, hoe).', desc_en: 'Forming questions with inversion (verb first) or question words.', desc_pl: 'Tworzenie pytań przez inwersję lub zaimki pytajne.', ex: 'Kom je morgen? / Wat doe jij?' },
        { id: 4, cat: 'cat1', title: 'Klokkijken (Deel 1)', desc_nl: 'De analoge klok aflezen en verwoorden (over, voor, half, kwart).', desc_en: 'Analog time telling (past, to, half, quarter).', desc_pl: 'Określanie czasu zegarowego (po, przed, wpół do).', ex: 'Het is half acht / Het is kwart over tien.' },
        { id: 5, cat: 'cat1', title: 'Bezittelijk voornaamwoord (pronomen possessief)', desc_nl: 'Bezit aangeven met mijn, jouw, zijn, haar, ons/onze, jullie, hun.', desc_en: 'Possessive pronouns: my, your, his, her, our, their.', desc_pl: 'Zaimki dzierżawcze: mój, twój, jego, jej, nasz, ich.', ex: 'Dit is haar familie en dat is ons huis.' },
        { id: 6, cat: 'cat1', title: 'Ontkenning: geen / niet', desc_nl: 'Gebruik \'geen\' voor onbepaalde zelfstandige naamwoorden (met een/geen lidwoord), en \'niet\' voor de rest.', desc_en: 'Use \'geen\' for indefinite nouns, \'niet\' for verbs, adjectives, and definite nouns.', desc_pl: 'Używaj \'geen\' dla rzeczowników nieokreślonych, \'niet\' w innych przypadkach.', ex: 'Ik heb geen kinderen. Ik feest niet.' },
        { id: 7, cat: 'cat1', title: 'Lidwoorden: de / het / een', desc_nl: 'Gebruik van de juiste bepaalde lidwoorden (de/het) en het onbepaalde lidwoord (een).', desc_en: 'Definite articles (de/het) and the indefinite article (een).', desc_pl: 'Przedimki określone (de/het) i nieokreślony (een).', ex: 'De vader, het kind, een cadeau.' },
        { id: 8, cat: 'cat1', title: 'Zinsbouw: Inversie', desc_nl: 'Werkwoord en onderwerp wisselen van plek als de zin met tijd of plaats begint.', desc_en: 'Subject and verb swap places when the sentence starts with time or place.', desc_pl: 'Czasownik i podmiot zamieniają się miejscami, gdy zdanie zaczyna się od czasu lub miejsca.', ex: 'Vandaag vieren we haar verjaardag.' },
        { id: 9, cat: 'cat1', title: 'Modale verba (hulpwerkwoorden)', desc_nl: 'Moeten, kunnen, willen, mogen en zullen vervoegen met het hoofdwerkwoord helemaal achteraan.', desc_en: 'Conjugating modal verbs. The main verb goes to the end of the sentence.', desc_pl: 'Odmiana czasowników modalnych. Główny czasownik idzie na koniec zdania.', ex: 'Ik wil op jouw feestje komen.' },

        // Categorie 2: Thema 3 & 4
        { id: 10, cat: 'cat2', title: 'Adjectief (bijvoeglijk naamwoord)', desc_nl: 'Przymiotnik z końcówką -e (de groene broek) of zonder -e (een groot eetcafé bij het-woorden).', desc_en: 'Adjective endings with or without -e depending on the noun gender and article.', desc_pl: 'Przymiotnik z końcówką -e lub bez (w zależności od rodzaju i przedimka).', ex: 'Ik koop een groene broek en een mooi shirt.' },
        { id: 11, cat: 'cat2', title: 'Er + numerale (getal)', desc_nl: 'Het woordje \'er\' gebruiken in combinatie met een getal of hoeveelheid om herhaling te voorkomen.', desc_en: 'Using \'er\' with numbers to replace a noun.', desc_pl: 'Używanie \'er\' z liczbami, aby uniknąć powtarzania rzeczownika.', ex: 'Hoeveel appels wil je? Ik wil er drie.' },

                { q: "Kies de juiste zin met inversie:", o: ["Soms ga ik naar de bioscoop.", "Soms ik ga naar de bioscoop.", "Ga ik soms naar de bioscoop."], c: 0, e: "Soms (frequentiewoord vooraan) zorgt voor inversie: 'ga ik'." }
            ]
        },
        18: {
            examples: ["De film begint om tien voor acht 's avonds.", "Zij komt om half drie middags."],
            questions: [
                { q: "Hoe zeg je 19:50?", o: ["tien voor acht 's avonds", "tien over half acht 's avonds", "tien voor acht 's morgens"], c: 0, e: "19:50 is 10 minuten voor 8 uur in de avond ('s avonds)." },
                { q: "Hoe geef je 'in de ochtend' aan in een tijdsaanduiding?", o: ["'s middags", "'s morgens", "'s avonds"], c: 1, e: "'s morgens (of 's ochtends)." },
                { q: "Kies de juiste zin:", o: ["De les begint om negen uur 's ochtends.", "De les begint negen uur in ochtend.", "Om negen uur de les begint."], c: 0, e: "De les begint om negen uur 's ochtends." }
            ]
        },
        19: {
            examples: ["Zij is naar de stad gefietst.", "We hebben een brief geschreven.", "Ik ben vorig jaar verhuisd."],
            questions: [
                { q: "Wat is het voltooid deelwoord van 'schrijven'?", o: ["gescheven", "geschreven", "geschtift"], c: 1, e: "'schrijven' is onregelmatig: 'geschreven'." },
                { q: "Vul in: 'Waarom ___ jij niet gekomen?'", o: ["heb", "ben", "bent"], c: 2, e: "Bij 'komen' hoort het hulpwerkwoord 'zijn'. Voor 'jij' is dat 'bent'." },
                { q: "Kies de juiste zin:", o: ["Zij is gisteren naar Amsterdam gegaan.", "Zij heeft gisteren naar Amsterdam gegaan.", "Zij is gisteren naar Amsterdam gegaan zijn."], c: 0, e: "'Gaan' drukt beweging uit en krijgt 'zijn' ('is gegaan')." }
            ]
        },
        20: {
            examples: ["Fietsen is gezonder dan autorijden.", "Dit is het leukste boek dat ik ken.", "Zij rent even snel als ik."],
            questions: [
                { q: "Welk woord gebruik je bij een vergelijking die groter/beter is?", o: ["als", "dan", "of"], c: 1, e: "Vergrotende trap + 'dan' (groter dan, beter dan)." },
                { q: "Welk woord gebruik je bij een gelijke vergelijking?", o: ["even ... als", "even ... dan", "zo ... dan"], c: 0, e: "Even groot als, even snel als." },
                { q: "Wat is de overtreffende trap van 'goed'?", o: ["goeder", "het best", "het leukst"], c: 1, e: "Goed - beter - het best." }
            ]
        },
        21: {
            examples: ["Deze bank zit lekker.", "Dat kantoor is ruim."],
            questions: [
                { q: "Welk aanwijzend voornaamwoord hoort bij 'stoel' (de-woord, dichtbij)?", o: ["deze", "dit", "die"], c: 0, e: "De stoel &rarr; deze stoel." },
                { q: "Welk aanwijzend voornaamwoord hoort bij 'appartement' (het-woord, ver weg)?", o: ["die", "dat", "deze"], c: 1, e: "Het appartement &rarr; dat appartement." },
                { q: "Kies de correcte zin:", o: ["Dit huis is groter dan die appartement.", "Dit huis is groter dan dat appartement.", "Deze huis is groter dan dat appartement."], c: 1, e: "'Huis' en 'appartement' zijn het-woorden, dus 'dit huis' en 'dat appartement'." }
            ]
        },
        22: {
            examples: ["Woon je in Utrecht? Ja, ik woon er al ver jaar.", "Is er koffie in de keuken? Ja, er staat koffie."],
            questions: [
                { q: "Welk woord vervangt een plaats in: 'Ik woon in Amsterdam.'", o: ["daar", "er", "hier"], c: 1, e: "'er' kan een plaats aanduiden ('Ik woon er')." },
                { q: "Vul in: 'Gaan jullie naar het park?' - 'Ja, we gaan ___ naartoe.'", o: ["er", "daar", "heen"], c: 0, e: "Ja, we gaan er naartoe." },
                { q: "Kies de juiste zin:", o: ["Ik werk er al twee jaar.", "Ik werk al twee jaar er.", "Er ik werk al twee jaar."], c: 0, e: "'er' staat zo vroeg mogelijk in de zin, na het werkwoord." }
            ]
        },
        23: {
            examples: ["Ik schrijf ermee (met de pen).", "Zij kijkt ernaar (naar de tv).", "Er liggen boeken in (in de kast)."],
            questions: [
                { q: "Wat is 'ermee'?", o: ["er + met", "er + mee", "met het"], c: 1, e: "Voorzetsel 'met' wordt 'mee' als het gecombineerd wordt met 'er'." },
                { q: "Vul in: 'Dit is een stoel. Je kunt ___ zitten.'", o: ["erop", "erin", "ermee"], c: 0, e: "Op een stoel zitten &rarr; erop zitten." },
                { q: "Vul in: 'Dat is de doos. Wat zit ___?'", o: ["erin", "erop", "ervan"], c: 0, e: "In een doos zitten &rarr; erin zitten." }
            ]
        },
        24: {
            examples: ["Neem dit medicijn in.", "Kom hier!", "Bel me morgen op."],
            questions: [
                { q: "Hoe maak je de gebiedende wijs (imperatief)?", o: ["Je gebruikt het hele werkwoord.", "Je gebruikt alleen de stam van het werkwoord en géén onderwerp.", "Je zet 'moeten' voor de zin."], c: 1, e: "Gebiedende wijs gebruikt alleen de stam (bijv. 'Kom!', 'Wacht!')." },
                { q: "Kies de juiste gebiedende wijs voor 'opstaan':", o: ["Sta op!", "Opstaan!", "Je staat op!"], c: 0, e: "'Sta op!' is de imperatief van het scheidbare werkwoord 'opstaan'." },
                { q: "Kies de juiste zin:", o: ["Eet uw groenten.", "Eet je groenten (zonder 'je' is correcter: Eet groenten!).", "Eet je groenten!"], c: 2, e: "'Eet je groenten!' is een informele imperatief." }
            ]
        },
        25: {
            examples: ["De dokter zegt dat ik koorts heb.", "Hij vraagt of ik morgen kom."],
            questions: [
                { q: "Welkie woordvolgorde gebruikt de indirecte rede na 'dat' of 'of'?", o: ["Hoofdzinvolgorde (werkwoord op pos 2)", "Bijzinvolgorde (alle werkwoorden achteraan)", "Vraagzinvolgorde (werkwoord vooraan)"], c: 1, e: "Indirecte rede na 'dat/of' gedraagt zich als een bijzin." },
                { q: "Kies de juiste zin:", o: ["Hij zegt dat hij ziek is.", "Hij zegt dat hij is ziek.", "Hij zegt dat is hij ziek."], c: 0, e: "Werkwoord 'is' gaat naar het einde van de bijzin." },
                { q: "Kies de juiste zin:", o: ["Zij vraagt of ik koffie wil.", "Zij vraagt of ik wil koffie.", "Zij vraagt of wil ik koffie."], c: 0, e: "Werkwoord 'wil' gaat naar het einde." }
            ]
        },
        26: {
            examples: ["Ik bel de dokter op.", "Zij wast de kleding af.", "Hij maakt de computer schoon."],
            questions: [
                { q: "Wat gebeurt er met een scheidbaar werkwoord in een normale tegenwoordige tijd hoofdzin?", o: ["Het blijft aan elkaar.", "Het voorvoegsel gaat naar het einde van de zin.", "Het hele werkwoord gaat naar het einde."], c: 1, e: "Het voorvoegsel (op, af, schoon) splitst en gaat naar het einde." },
                { q: "Kies de juiste zin voor 'opbellen':", o: ["Ik bel mijn moeder vanavond op.", "Ik opbel mijn moeder vanavond.", "Ik bel op mijn moeder vanavond."], c: 0, e: "bel (pos 2) ... op (einde)." },
                { q: "Kies de juiste zin voor 'schoonmaken':", o: ["Zij maakt haar kamer schoon.", "Zij schoonmaakt haar kamer.", "Zij maakt schoon haar kamer."], c: 0, e: "maakt (pos 2) ... schoon (einde)." }
            ]
        },
        27: {
            examples: ["Vroeger had ik een hond.", "Toen ik klein was, woonde ik in Polen.", "Zij waren gisteren erg druk."],
            questions: [
                { q: "Wanneer gebruik je het imperfectum (verleden tijd) meestal?", o: ["Bij eenmalige gebeurtenissen in het verleden", "Voor beschrijvingen, gewoontes of toestanden in het verleden", "Bij toekomstige plannen"], c: 1, e: "Imperfectum is voor achtergrondbeschrijvingen of toestanden (was, had, woonde)." },
                { q: "Wat is het imperfectum van 'werken' (enkelvoud)?", o: ["werkte", "werkt", "gewerkt"], c: 0, e: "Regelmatig: stam + te/de &rarr; werkte." },
                { q: "Kies de juiste zin:", o: ["Vorig jaar had ik geen auto.", "Vorig jaar ik had geen auto.", "Vorig jaar had geen auto ik."], c: 0, e: "Inversie na tijdsaanduiding vorig jaar: 'had ik'." }
            ]
        },
        28: {
            examples: ["Ik voel me goed.", "Zij wast zich.", "Wij herinneren ons de les."],
            questions: [
                { q: "Wat is het wederkerend voornaamwoord bij 'wij'?", o: ["me", "zich", "ons"], c: 2, e: "Wij wassen ons &rarr; 'ons'." },
                { q: "Vul in: 'Thomas scheert ___ elke ochtend.'", o: ["hem", "zich", "je"], c: 1, e: "Bij 'hij/zij' hoort 'zich'." },
                { q: "Kies de juiste zin:", o: ["Ik voel me vandaag niet zo lekker.", "Ik voel vandaag me niet zo lekker.", "Ik me voel vandaag niet zo lekker."], c: 0, e: "Het reflexief pronomen ('me') staat direct na het werkwoord." }
            ]
        },
        29: {
            examples: ["Er staat een man in de gang.", "Er lopen mensen op straat."],
            questions: [
                { q: "Wanneer gebruik je 'er' + onbepaald onderwerp?", o: ["Als we niet weten waar de plaats is", "Als het onderwerp niet specifiek of bekend is (bijv. 'een man' / 'mensen')", "Om een vraag te stellen"], c: 1, e: "Bij onbepaalde onderwerpen beginnen we de zin vaak met 'er'." },
                { q: "Kies de juiste zin:", o: ["Er wonen veel mensen in deze straat.", "Veel mensen wonen er in deze straat.", "Er veel mensen wonen in deze straat."], c: 0, e: "Er + Werkwoord + Onbepaald onderwerp." },
                { q: "Kies de juiste zin:", o: ["Er ligt een pen op tafel.", "Een pen ligt er op tafel.", "Ligt er een pen op tafel (als vraag)."], c: 0, e: "'Er ligt een pen op tafel' is de normale basiszin." }
            ]
        },
        30: {
            examples: ["Ik leer Nederlands om een baan te vinden.", "Zij gaat naar de supermarkt om eten te kopen."],
            questions: [
                { q: "Waar staat het hele werkwoord (infinitief) in de constructie 'om ... te'?", o: ["Direct na 'om'", "Helemaal aan het einde, na 'te'", "Voor het woord 'te'"], c: 1, e: "Het werkwoord staat na 'te' helemaal aan het einde." },
                { q: "Kies de juiste zin:", o: ["Ik ga naar school om te leren Nederlands.", "Ik ga naar school om Nederlands te leren.", "Ik ga naar school voor Nederlands te leren."], c: 1, e: "om + rest ('Nederlands') + te + infinitief ('leren')." },
                { q: "Kies de juiste zin:", o: ["Zij belt haar moeder om hulp te vragen.", "Zij belt haar moeder om te vragen hulp.", "Zij belt haar moeder voor hulp vragen."], c: 0, e: "om + rest ('hulp') + te + infinitief ('vragen')." }
            ]
        },
        31: {
            examples: ["Volgend jaar ga ik studeren.", "Wij zullen u morgen bellen."],
            questions: [
                { q: "Welk hulpwerkwoord gebruiken we het meest voor de toekomst in dagelijks Nederlands?", o: ["zullen", "gaan", "willen"], c: 1, e: "'gaan' + infinitief wordt het meest gebruikt voor plannen." },
                { q: "Kies de juiste zin:", o: ["Ik ga vanavond een pizza eten.", "Ik ga vanavond eten een pizza.", "Ik vanavond ga een pizza eten."], c: 0, e: "Hulpwerkwoord ('ga') op pos 2, hele werkwoord ('eten') aan het einde." },
                { q: "Kies de juiste zin met 'zullen':", o: ["Wij zullen u morgen helpen.", "Wij zullen u helpen morgen.", "Morgen wij zullen u helpen."], c: 0, e: "Wij (Onderwerp) + zullen (hulpwerkwoord) + rest + hele werkwoord ('helpen')." }
            ]
        }
    };

    let quizState = {};
    let currentCategoryFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
        loadChecklistState();
        renderChecklist();
    });

    // RENDER CHECKLIST
    function renderChecklist() {
        const container = document.getElementById('checklist-container');
        container.innerHTML = '';

        const filtered = grammarTopics.filter(t => currentCategoryFilter === 'all' || t.cat === currentCategoryFilter);

        filtered.forEach(topic => {
            const isCompleted = localStorage.getItem(`opmaat_topic_${topic.id}`) === 'true';

            const card = document.createElement('div');
            card.className = 'checklist-item';
            card.id = `item-${topic.id}`;
            card.setAttribute('onclick', `expandTopic(${topic.id}, event)`);

            card.innerHTML = `
                <div class="checklist-checkbox-wrapper" onclick="event.stopPropagation();">
                    <input type="checkbox" class="checklist-checkbox" id="check-${topic.id}" ${isCompleted ? 'checked' : ''} onclick="event.stopPropagation(); toggleTopic(${topic.id})">
                </div>
                <div class="checklist-content">
                    <div class="checklist-title-row">
                        <span class="checklist-title">${topic.id}. ${topic.title} <span class="expand-chevron">▼</span></span>
                        <span class="example-badge">Bijv: ${topic.ex}</span>
                    </div>
                    <div class="checklist-desc" id="desc-${topic.id}" data-nl="${topic.desc_nl}" data-en="${topic.desc_en}" data-pl="${topic.desc_pl}">
                        ${topic.desc_nl}
                    </div>
                    <div class="lang-switch-inline" onclick="event.stopPropagation();">
                        <span class="lang-switch-btn" onclick="event.stopPropagation(); setListItemLang(${topic.id}, 'nl')">Nederlands</span> · 
                        <span class="lang-switch-btn" onclick="event.stopPropagation(); setListItemLang(${topic.id}, 'en')">🇬🇧 English</span> · 
                        <span class="lang-switch-btn" onclick="event.stopPropagation(); setListItemLang(${topic.id}, 'pl')">🇵🇱 Polski</span>
                        <button class="speech-btn-inline" onclick="event.stopPropagation(); speakText('${topic.ex.replace(/'/g, "\\'")}')">🔊</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        updateProgressBar();
    }

    function setListItemLang(id, lang) {
        const descDiv = document.getElementById(`desc-${id}`);
        if (!descDiv) return;
        const translation = descDiv.getAttribute('data-' + lang);
        if (translation) {
            descDiv.innerHTML = translation;
        }
    }

    function switchCategory(cat) {
        currentCategoryFilter = cat;
        document.querySelectorAll('#category-tabs .tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        // Mark active button
        const clickedBtn = Array.from(document.querySelectorAll('#category-tabs .tab-btn')).find(btn => 
            btn.getAttribute('onclick').includes(`'${cat}'`)
        );
        if (clickedBtn) clickedBtn.classList.add('active');

        renderChecklist();
    }

    function toggleTopic(id) {
        const checkbox = document.getElementById(`check-${id}`);
        localStorage.setItem(`opmaat_topic_${id}`, checkbox.checked ? 'true' : 'false');
        updateProgressBar();
    }

    function loadChecklistState() {
        // State loaded dynamically inside renderChecklist
    }

    function updateProgressBar() {
        let completed = 0;
        grammarTopics.forEach(t => {
            if (localStorage.getItem(`opmaat_topic_${t.id}`) === 'true') {
                completed++;
            }
        });

        const percent = Math.round((completed / grammarTopics.length) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-percent').textContent = percent + '%';
        document.getElementById('completed-count').textContent = completed;
    }

    // ── PRACTICE & QUIZ LOGIC ──
    function expandTopic(id, event) {
        if (event.target.closest('.checklist-checkbox') || 
            event.target.closest('.lang-switch-inline') ||
            event.target.closest('.checklist-checkbox-wrapper')) {
            return;
        }
        
        const card = document.getElementById(`item-${id}`);
        if (!card) return;
        
        const isExpanded = card.classList.contains('expanded');
        
        document.querySelectorAll('.checklist-item.expanded').forEach(el => {
            if (el.id !== `item-${id}`) {
                el.classList.remove('expanded');
                const innerArea = el.querySelector('.practice-area');
                if (innerArea) innerArea.style.display = 'none';
            }
        });
        
        if (isExpanded) {
            card.classList.remove('expanded');
            const practiceArea = card.querySelector('.practice-area');
            if (practiceArea) practiceArea.style.display = 'none';
        } else {
            card.classList.add('expanded');
            
            let practiceArea = card.querySelector('.practice-area');
            if (!practiceArea) {
                practiceArea = document.createElement('div');
                practiceArea.className = 'practice-area';
                practiceArea.id = `practice-${id}`;
                practiceArea.addEventListener('click', (e) => e.stopPropagation());
                card.querySelector('.checklist-content').appendChild(practiceArea);
            }
            practiceArea.style.display = 'block';
            
            renderTopicPractice(id);
            
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 150);
        }
    }

    function renderTopicPractice(id) {
        const area = document.getElementById(`practice-${id}`);
        if (!area) return;
        
        const data = topicQuizData[id];
        if (!data) {
            area.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">Geen extra oefeningen beschikbaar voor dit onderwerp.</div>';
            return;
        }
        
        if (!quizState[id]) {
            quizState[id] = {
                currentQuestionIdx: 0,
                correctCount: 0,
                answered: false,
                selectedOption: null
            };
        }
        
        const state = quizState[id];
        
        let html = `
            <div class="practice-title">💡 Voorbeelden &amp; Oefeningen</div>
            <div class="examples-wrap">
                ${data.examples.map(ex => `
                    <div class="example-item">
                        <span class="example-text">${ex}</span>
                        <button class="speech-btn-inline" onclick="event.stopPropagation(); speakText('${ex.replace(/'/g, "\\'")}')">🔊</button>
                    </div>
                `).join('')}
            </div>
        `;
        
        if (state.currentQuestionIdx < data.questions.length) {
            const q = data.questions[state.currentQuestionIdx];
            html += `
                <div class="quiz-card">
                    <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-secondary); margin-bottom:8px; font-weight:800;">
                        <span>VRAAG ${state.currentQuestionIdx + 1} VAN ${data.questions.length}</span>
                        <span>Score: ${state.correctCount}/${state.currentQuestionIdx}</span>
                    </div>
                    <div class="quiz-q">${q.q}</div>
                    <div class="quiz-opts">
                        ${q.o.map((opt, oIdx) => {
                            let cls = '';
                            if (state.answered) {
                                if (oIdx === q.c) cls = 'correct';
                                else if (state.selectedOption === oIdx) cls = 'incorrect';
                            }
                            return `<button class="quiz-opt ${cls}" onclick="answerQuizQuestion(${id}, ${oIdx})" ${state.answered ? 'disabled' : ''}>${opt}</button>`;
                        }).join('')}
                    </div>
                    
                    <div class="quiz-fb" id="quiz-fb-${id}" style="display:${state.answered ? 'block' : 'none'};"></div>
                    
                    ${state.answered ? `
                        <div style="text-align:right;">
                            <button class="quiz-btn" onclick="nextQuizQuestion(${id})">
                                ${state.currentQuestionIdx === data.questions.length - 1 ? 'Afronden' : 'Volgende vraag →'}
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        } else {
            const pass = state.correctCount === data.questions.length;
            html += `
                <div class="quiz-card quiz-score-view">
                    <h4>Quiz Afgerond! 🎉</h4>
                    <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:12px;">
                        Je scoorde <strong>${state.correctCount} van de ${data.questions.length}</strong> goed.
                    </p>
                    ${pass ? `
                        <div style="color:var(--accent-green); font-weight:800; font-size:0.85rem; margin-bottom:12px;">
                            Geweldig! Je beheerst dit onderwerp volledig! 🌟
                        </div>
                    ` : `
                        <div style="color:var(--accent-orange); font-weight:800; font-size:0.85rem; margin-bottom:12px;">
                            Tip: Oefen nog eens om een perfecte score te halen!
                        </div>
                    `}
                    <div style="display:flex; gap:10px; justify-content:center;">
                        <button class="quiz-btn" style="background:var(--bg-card-light); border:1px solid var(--border-color); color:var(--text-primary);" onclick="resetQuizState(${id})">
                            Opnieuw Oefenen
                        </button>
                    </div>
                </div>
            `;
            
            if (pass) {
                const checkbox = document.getElementById(`check-${id}`);
                if (checkbox && !checkbox.checked) {
                    checkbox.checked = true;
                    toggleTopic(id);
                }
            }
        }
        
        area.innerHTML = html;
        
        if (state.answered) {
            const q = data.questions[state.currentQuestionIdx];
            const isCorrect = state.selectedOption === q.c;
            const fbEl = document.getElementById(`quiz-fb-${id}`);
            if (fbEl) {
                fbEl.className = `quiz-fb ${isCorrect ? 'correct' : 'incorrect'}`;
                fbEl.innerHTML = isCorrect ? `🎉 Correct! ${q.e}` : `❌ Helaas, dat is niet juist. ${q.e}`;
                fbEl.style.display = 'block';
            }
        }
    }

    function answerQuizQuestion(id, optIdx) {
        const state = quizState[id];
        if (!state || state.answered) return;
        
        state.answered = true;
        state.selectedOption = optIdx;
        
        const data = topicQuizData[id];
        const q = data.questions[state.currentQuestionIdx];
        if (optIdx === q.c) {
            state.correctCount++;
        }
        
        renderTopicPractice(id);
    }

    function nextQuizQuestion(id) {
        const state = quizState[id];
        if (!state) return;
        
        state.currentQuestionIdx++;
        state.answered = false;
        state.selectedOption = null;
        
        renderTopicPractice(id);
    }

    function resetQuizState(id) {
        quizState[id] = {
            currentQuestionIdx: 0,
            correctCount: 0,
            answered: false,
            selectedOption: null
        };
        renderTopicPractice(id);
    }

    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'nl-NL';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
    }
</script>
</body>
</html>
