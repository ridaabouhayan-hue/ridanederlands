<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONA Dashboard - Overzicht</title>
    <!-- NOS Makkelijke Taal + Dashboard Styling -->
    <link rel="stylesheet" href="ona_style.css">
    <script>
        // Direct blokkeren als geen sessie
        if (sessionStorage.getItem('ona_auth_v2') !== '1') {
            window.location.replace('index.html');
        }

        function logoutOna() {
            sessionStorage.removeItem('ona_auth_v2');
            window.location.replace('index.html');
        }
    </script>
</head>
<body>

<div class="container">
    
    <!-- HEADER -->
    <div class="header">
        <a href="index.html" class="dark-mode-toggle" style="left: 20px; right: auto; text-decoration: none; text-align: center;">← Portaal</a>
        <h1>📊 ONA Dashboard</h1>
        <p>Voortgangsmonitor voor portfolio & resultaatkaarten</p>
        <button class="dark-mode-toggle" onclick="logoutOna()" style="right: 175px;">🔒 Uitloggen</button>
        <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙 / ☀️ Dark Mode</button>
    </div>

    <!-- GROEP SELECTIE -->
    <div class="group-tabs">
        <button id="btn-groep-42" class="tab-btn">Groep 42</button>
        <button id="btn-groep-43" class="tab-btn active">Groep 43</button>
    </div>

    <!-- DASHBOARD GRID -->
    <!-- JS vult dit met student cards -->
    <div id="dashboard-grid" class="dashboard-grid">
        <!-- Voorbeeld van hoe een kaart eruitziet in HTML (wordt overschreven door JS) -->
        <div class="student-card">
            <div class="student-header">
                <div class="student-name">👤 Lading...</div>
            </div>
            <div class="progress-section">
                <p>Momentje, data wordt geladen...</p>
            </div>
        </div>
    </div>

</div>

<!-- Inladen van de functionaliteit -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="ona_data.js"></script>

</body>
</html>
