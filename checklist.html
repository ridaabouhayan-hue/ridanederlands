<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grote Grammatica Checklist & Zinnenbouwer — NT2</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f1729;
            --bg-card: #182040;
            --bg-card-light: #222b54;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-orange: #e67e22;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(148, 163, 184, 0.1);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(ellipse at 10% 10%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 90%, rgba(230, 126, 34, 0.06) 0%, transparent 50%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Back button */
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 700;
            padding: 10px 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .back-link:hover {
            transform: translateX(-3px);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 600;
        }

        /* Progress Bar Card */
        .progress-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.15);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(148, 163, 184, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-green));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: var(--text-primary);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        /* Grid */
        .checklist-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        /* Checklist Item */
        .checklist-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .checklist-item:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .checklist-checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        .checklist-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--text-secondary);
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .checklist-checkbox:checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checklist-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 0.95rem;
            font-weight: 900;
        }

        .checklist-content {
            flex: 1;
        }

        .checklist-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .checklist-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .checklist-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .example-badge {
            display: inline-block;
            background: rgba(230, 126, 34, 0.12);
            color: var(--accent-orange);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(230, 126, 34, 0.2);
        }

        .lang-switch-inline {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .lang-switch-btn {
            cursor: pointer;
            font-weight: 800;
            text-decoration: underline;
        }
        .lang-switch-btn:hover {
            color: var(--text-primary);
        }

        /* ── SECTION ZINNENBOUWER ── */
        .builder-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid var(--border-color);
            margin-top: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .builder-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .builder-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .challenge-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .challenge-btn {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-card-light);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .challenge-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .challenge-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: var(--text-primary);
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        .workspace {
            background: var(--bg-dark);
            border-radius: 16px;
            padding: 24px;
            border: 2px dashed rgba(148, 163, 184, 0.2);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .workspace-placeholder {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .workspace-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .word-bank {
            background: var(--bg-card-light);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bank-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bank-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .word-chip {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }

        .word-chip:hover {
            border-color: var(--accent-blue);
            transform: scale(1.03);
            background: var(--bg-card-light);
        }

        .word-chip.used {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 10px 22px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            background: rgba(148, 163, 184, 0.15);
        }

        .builder-feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            display: none;
            line-height: 1.5;
        }

        .builder-feedback.correct {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .builder-feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .speech-btn-inline {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            vertical-align: middle;
            margin-left: 6px;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-wrap: nowrap;
            }
            .challenge-tabs {
                flex-direction: column;
            }
        }

        /* Expanded Practice Area Styles */
        .checklist-item {
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: all 0.2s ease;
        }
        .checklist-item.expanded {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
        }
        .expand-chevron {
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: transform 0.2s ease;
            margin-left: 8px;
            pointer-events: none;
        }
        .checklist-item.expanded .expand-chevron {
            transform: rotate(180deg);
            color: var(--accent-blue);
        }
        .practice-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: none;
            cursor: default;
            width: 100%;
        }
        .practice-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin-bottom: 10px;
        }
        .examples-wrap {
            margin-bottom: 15px;
        }
        .example-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .example-text {
            color: var(--text-primary);
            font-style: italic;
        }
        .quiz-card {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
        }
        .quiz-q {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .quiz-opt {
            background: var(--bg-card-light);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
            color: var(--text-secondary);
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            transition: all 0.15s ease;
            width: 100%;
        }
        .quiz-opt:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.08);
        }
        .quiz-opt.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
        }
        .quiz-opt.incorrect {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }
        .quiz-fb {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .quiz-fb.correct {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }
        .quiz-fb.incorrect {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .quiz-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: opacity 0.15s;
        }
        .quiz-btn:hover {
            opacity: 0.9;
        }
        .quiz-score-view {
            text-align: center;
            padding: 10px 0;
        }
        .quiz-score-view h4 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- TERUG LINK -->
    <a href="index.html" class="back-link">← Terug naar Hoofdmenu</a>

    <!-- HEADER -->
    <div class="header">
        <h1>📋 Grote Grammatica Checklist</h1>
        <p>Volg je voortgang door alle 30 grammaticasystemen van de lesmethode af te vinken. Gebruik onderaan de zinnenbouwer om te oefenen!</p>
    </div>

    <!-- PROGRESS CARD -->
    <div class="progress-card">
        <div class="progress-info">
            <span>Mijn Voortgang</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); text-align: right; font-weight: 600;">
            <span id="completed-count">0</span> van de 30 onderwerpen beheerst
        </div>
    </div>

    <!-- CATEGORY TABS -->
    <div class="tabs" id="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('all')">Alles tonen</button>
        <button class="tab-btn" onclick="switchCategory('cat1')">Tegenwoordige Tijd</button>
        <button class="tab-btn" onclick="switchCategory('cat2')">Zinsbouw & Pronomen</button>
        <button class="tab-btn" onclick="switchCategory('cat3')">Nouns & Modals</button>
        <button class="tab-btn" onclick="switchCategory('cat4')">Voegwoorden & Verwijswoorden</button>
        <button class="tab-btn" onclick="switchCategory('cat5')">Bijzinnen</button>
        <button class="tab-btn" onclick="switchCategory('cat6')">Perfectum</button>
    </div>

    <!-- CHECKLIST GRID -->
    <div class="checklist-grid" id="checklist-container">
        <!-- Rendered dynamically by JS -->
    </div>

</div>

<!-- DATA AND SCRIPT LOGIC -->
<script>
    // 30 Grammar topics
    const grammarTopics = [
        // Categorie 1
        { id: 1, cat: 'cat1', title: 'Tegenwoordige tijd enkelvoud', desc_nl: 'De stam + t bij jij, u, hij, zij, het (ik = stam).', desc_en: 'Present tense singular (stem + t, except for ik).', desc_pl: 'Czas teraźniejszy l. pojedyncza (temat + t, oprócz ik).', ex: 'Ik werk, hij werkt.' },
        { id: 2, cat: 'cat1', title: 'Onderwerp enkelvoud', desc_nl: 'Het enkelvoudig onderwerp (ik, jij, hij, het boek) bepaalt de vorm van het werkwoord.', desc_en: 'Singular subject determines singular verb form.', desc_pl: 'Podmiot w liczbie pojedynczej określa formę czasownika.', ex: 'De man loopt op straat.' },
        { id: 3, cat: 'cat1', title: 'Tegenwoordige tijd enkelvoud en meervoud', desc_nl: 'In het meervoud (wij, jullie, zij) is het werkwoord het hele werkwoord.', desc_en: 'Present tense plural uses the infinitive form.', desc_pl: 'Liczba mnoga w czasie teraźniejszym używa bezokolicznika.', ex: 'Wij werken vandaag.' },
        { id: 4, cat: 'cat1', title: 'Onderwerp enkelvoud en meervoud', desc_nl: 'Het verschil herkennen tussen één of meer onderwerpen in de zin.', desc_en: 'Differentiating between singular and plural subjects.', desc_pl: 'Rozróżnianie podmiotu w liczbie pojedynczej i mnogiej.', ex: 'De baby slaapt / De baby\'s slapen.' },
        { id: 5, cat: 'cat1', title: 'Hebben en zijn', desc_nl: 'De onregelmatige maar onmisbare werkwoorden hebben en zijn vervoegen.', desc_en: 'Conjugating the irregular auxiliary verbs hebben and zijn.', desc_pl: 'Odmiana nieregularnych czasowników pomocniczych hebben i zijn.', ex: 'Ik heb een kat. Zij is blij.' },
        
        // Categorie 2
        { id: 6, cat: 'cat2', title: 'Zinsbouw: Hoofdzin (Onderwerp-Werkwoord-TOP)', desc_nl: 'Het werkwoord staat op positie 2 (Onderwerp - Werkwoord - TOP).', desc_en: 'Main clause word order (Subject + Verb on position 2).', desc_pl: 'Szyk zdania głównego (Podmiot + Czasownik na 2. pozycji).', ex: 'Ik leer vandaag Nederlands.' },
        { id: 7, cat: 'cat2', title: 'Bezittelijk voornaamwoord', desc_nl: 'Mijn, jouw, zijn, haar, ons/onze, jullie, hun.', desc_en: 'Possessive pronouns: my, your, his, her, our, their.', desc_pl: 'Zaimki dzierżawcze: mój, twój, jego, jej, nasz, ich.', ex: 'Dit is mijn boek en dat is haar tas.' },
        { id: 8, cat: 'cat2', title: 'Vraagzinnen', desc_nl: 'Vraagzinnen met een vraagwoord (wie, wat, hoe) of ja/nee-vragen (inversie).', desc_en: 'Question sentences: using question words or yes/no questions.', desc_pl: 'Zdania pytające: z zaimkiem pytajnym lub pytania tak/nie.', ex: 'Waar woon je? / Werk je vandaag?' },
        { id: 9, cat: 'cat2', title: 'Persoonlijk voornaamwoord: lijdend voorwerp / na voorzetsel', desc_nl: 'Mij, jou, hem, haar, ons, jullie, hen/hun.', desc_en: 'Object pronouns: me, you, him, her, us, them.', desc_pl: 'Zaimki osobowe w bierniku i po przyimkach: mnie, ciebie, jego, ją, nas.', ex: 'Ik zie hem. Zij praat met ons.' },
        { id: 10, cat: 'cat2', title: 'Zinsbouw: normale hoofdzin / hoofdzin met inversie', desc_nl: 'Als Tijd of Plaats vooraan staat, wisselen onderwerp en werkwoord van plek.', desc_en: 'Inversion: when Time or Place starts the sentence, Subject and Verb swap.', desc_pl: 'Inwersja: gdy Czas lub Miejsce zaczyna zdanie, Podmiot i Czasownik zamieniają się miejscami.', ex: 'Morgen werk ik thuis.' },

        // Categorie 3

                { q: "Kies de juiste zin:", o: ["Als het koud is, draag ik een jas.", "Als het koud is, ik draag een jas.", "Als het koud is, draag me een jas."], c: 0, e: "Bij een bijzin vooraan begint de hoofdzin met inversie: werkwoord ('draag') + onderwerp ('ik')." }
            ]
        },
        22: {
            examples: ["Als het regent, blijf ik binnen."],
            questions: [
                { q: "Welk voegwoord introduceert een voorwaarde?", o: ["omdat", "als", "dat"], c: 1, e: "'als' introduceert een voorwaarde." },
                { q: "Kies de juiste zin:", o: ["Ik weet dat hij morgen komt.", "Ik weet dat hij komt morgen.", "Ik weet dat komt hij morgen."], c: 0, e: "Bijzinvolgorde na 'dat': werkwoord 'komt' staat achteraan." },
                { q: "Kies de juiste zin:", o: ["Ik leer Nederlands omdat ik hier woon.", "Ik leer Nederlands omdat ik woon hier.", "Ik leer Nederlands omdat woon ik hier."], c: 0, e: "Bijzinvolgorde na 'omdat'." }
            ]
        },
        23: {
            examples: ["Een auto is sneller dan een fiets.", "Dit boek is leuker."],
            questions: [
                { q: "Welk woord gebruik je bij een vergelijking (vergrotende trap)?", o: ["als", "dan", "of"], c: 1, e: "Vergrotende trap + 'dan' (groter dan, sneller dan)." },
                { q: "Wat is de overtreffende trap van 'duur'?", o: ["duurder", "het duurst", "het meest duur"], c: 1, e: "duur - duurder - het duurst." },
                { q: "Vul in: 'Hij is even groot ___ zijn broer.'", o: ["als", "dan", "of"], c: 0, e: "Bij gelijke vergelijkingen gebruiken we 'even ... als'." }
            ]
        },
        24: {
            examples: ["Sta op! Werk door!"],
            questions: [
                { q: "Hoe maak je de gebiedende wijs (imperatief)?", o: ["Je gebruikt het hele werkwoord.", "Je gebruikt alleen de stam van het werkwoord en GEEN onderwerp.", "Je gebruikt 'moeten'"], c: 1, e: "De imperatief gebruikt alleen de stam ('Kom!', 'Kijk!')." },
                { q: "Kies de juiste gebiedende wijs voor 'luisteren':", o: ["Luister!", "Luister je!", "Luisteren!"], c: 0, e: "'Luister!' is de stam." },
                { q: "Kies de juiste gebiedende wijs voor 'opletten':", o: ["Let op!", "Opletten!", "Je let op!"], c: 0, e: "Bij scheidbare werkwoorden gaat het voorvoegsel naar achteren: 'Let op!'." }
            ]
        },
        25: {
            examples: ["Ik heb een pizza gegeten.", "We hebben hard gewerkt."],
            questions: [
                { q: "Welke hulpwerkwoorden gebruiken we in de voltooide tijd (perfectum)?", o: ["hebben en zijn", "gaan en zullen", "willen en moeten"], c: 0, e: "Het perfectum wordt gevormd met hebben of zijn + voltooid deelwoord." },
                { q: "Kies de juiste zin:", o: ["Ik heb gisteravond gekookt.", "Ik heb gekookt gisteravond.", "Ik gekookt heb gisteravond."], c: 0, e: "Hulpwerkwoord op pos 2, voltooid deelwoord helemaal achteraan." },
                { q: "Wat is het voltooid deelwoord van 'maken'?", o: ["gemaakt", "gemaked", "maken"], c: 0, e: "gemaakt (ge- + stam 'maak' + t)." }
            ]
        },
        26: {
            examples: ["Zij is er al."],
            questions: [
                { q: "Welk woord vult een reeds bekende locatie in?", o: ["er", "daar", "ze"], c: 0, e: "'er' verwijst naar een locatie." },
                { q: "Vul in: 'Ben je in Utrecht?' - 'Ja, ik woon ___.'", o: ["er", "daar", "ze"], c: 0, e: "Ja, ik woon er." },
                { q: "Kies de juiste zin:", o: ["Ik ben er gisteren geweest.", "Ik ben gisteren geweest er.", "Er ik ben gisteren geweest."], c: 0, e: "'er' staat direct na het werkwoord." }
            ]
        },
        27: {
            examples: ["Ik koop er vier."],
            questions: [
                { q: "Waarom gebruiken we 'er' in: 'Ik heb er twee.'?", o: ["Om een plaats aan te geven", "Om het zelfstandig naamwoord te vervangen en herhaling te voorkomen", "Als onderwerp van de zin"], c: 1, e: "'er' + getal vervangt het zelfstandig naamwoord." },
                { q: "Vul in: 'Heb jij boeken?' - 'Ja, ik heb ___ drie.'", o: ["er", "daar", "ze"], c: 0, e: "Ja, ik heb er drie." },
                { q: "Kies de juiste zin:", o: ["Ik koop er vier.", "Ik koop vier.", "Er ik koop vier."], c: 0, e: "'er' staat direct na de persoonsvorm." }
            ]
        },
        28: {
            examples: ["Ik ben gekomen. Ik heb het betaald."],
            questions: [
                { q: "Welke werkwoorden krijgen GEEN 'ge-' in het perfectum?", o: ["Werkwoorden die beginnen met be-, ver-, ont-, ge-, her-", "Werkwoorden van beweging", "Onregelmatige werkwoorden"], c: 0, e: "Bijvoorbeeld: 'betaald' (van betalen), 'verkocht' (van verkopen)." },
                { q: "Kies de juiste zin:", o: ["Zij is gisteren gekomen.", "Zij heeft gisteren gekomen.", "Zij is gekomen gisteren."], c: 0, e: "'komen' drukt beweging uit en krijgt het hulpwerkwoord 'zijn' ('is gekomen')." },
                { q: "Wat is het voltooid deelwoord van 'betalen'?", o: ["gebetaald", "betaald", "betalen"], c: 1, e: "Begint met be-, dus krijgt geen ge-: 'betaald'." }
            ]
        },
        29: {
            examples: ["Ik was de auto af."],
            questions: [
                { q: "Wat gebeurt er met scheidbare werkwoorden in de tegenwoordige tijd hoofdzin?", o: ["Ze blijven aan elkaar.", "Het voorvoegsel verhuist naar het einde van de zin.", "Ze krijgen ge- in het midden."], c: 1, e: "Het voorvoegsel splitst en gaat naar het einde (bijv. 'ik sta op')." },
                { q: "Kies de juiste zin voor 'opstaan':", o: ["Ik sta morgen vroeg op.", "Ik opsta morgen vroeg.", "Ik sta op morgen vroeg."], c: 0, e: "sta (pos 2) ... op (einde)." },
                { q: "Wat is het voltooid deelwoord van 'opstaan'?", o: ["geopstaan", "opgestaan", "opgestand"], c: 1, e: "Bij scheidbare werkwoorden komt 'ge' tussen het voorvoegsel en de stam: 'op-ge-staan'." }
            ]
        },
        30: {
            examples: ["We hebben veel gesproken."],
            questions: [
                { q: "Wat is het voltooid deelwoord van 'spreken'?", o: ["gesprekt", "gesproken", "spreken"], c: 1, e: "'spreken' is een onregelmatig (sterk) werkwoord: 'gesproken'." },
                { q: "Kies de juiste zin:", o: ["We hebben gisteren veel gelachen.", "We hebben gisteren veel gelacht.", "We hebben gisteren veel lachen."], c: 0, e: "'lachen' is sterk en krijgt 'gelachen'." },
                { q: "Kies de correcte voltooide tijd:", o: ["Zij hebben de brief geschreven.", "Zij hebben de brief gescheven.", "Zij zijn de brief geschreven."], c: 0, e: "'schrijven' krijgt 'hebben' + 'geschreven'." }
            ]
        }
    };

    let quizState = {};
    let currentCategoryFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
        loadChecklistState();
        renderChecklist();
    });

    // RENDER CHECKLIST
    function renderChecklist() {
        const container = document.getElementById('checklist-container');
        container.innerHTML = '';

        const filtered = grammarTopics.filter(t => currentCategoryFilter === 'all' || t.cat === currentCategoryFilter);

        filtered.forEach(topic => {
            const isCompleted = localStorage.getItem(`topic_${topic.id}`) === 'true';

            const card = document.createElement('div');
            card.className = 'checklist-item';
            card.id = `item-${topic.id}`;
            card.setAttribute('onclick', `expandTopic(${topic.id}, event)`);

            card.innerHTML = `
                <div class="checklist-checkbox-wrapper" onclick="event.stopPropagation();">
                    <input type="checkbox" class="checklist-checkbox" id="check-${topic.id}" ${isCompleted ? 'checked' : ''} onclick="event.stopPropagation(); toggleTopic(${topic.id})">
                </div>
                <div class="checklist-content">
                    <div class="checklist-title-row">
                        <span class="checklist-title">${topic.id}. ${topic.title} <span class="expand-chevron">▼</span></span>
                        <span class="example-badge">Bijv: ${topic.ex}</span>
                    </div>
                    <div class="checklist-desc" id="desc-${topic.id}" data-nl="${topic.desc_nl}" data-en="${topic.desc_en}" data-pl="${topic.desc_pl}">
                        ${topic.desc_nl}
                    </div>
                    <div class="lang-switch-inline" onclick="event.stopPropagation();">
                        <span class="lang-switch-btn" onclick="event.stopPropagation(); setListItemLang(${topic.id}, 'nl')">Nederlands</span> · 
                        <span class="lang-switch-btn" onclick="event.stopPropagation(); setListItemLang(${topic.id}, 'en')">🇬🇧 English</span> · 
                        <span class="lang-switch-btn" onclick="event.stopPropagation(); setListItemLang(${topic.id}, 'pl')">🇵🇱 Polski</span>
                        <button class="speech-btn-inline" onclick="event.stopPropagation(); speakText('${topic.ex.replace(/'/g, "\\'")}')">🔊</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        updateProgressBar();
    }

    function setListItemLang(id, lang) {
        const descDiv = document.getElementById(`desc-${id}`);
        if (!descDiv) return;
        const translation = descDiv.getAttribute('data-' + lang);
        if (translation) {
            descDiv.innerHTML = translation;
        }
    }

    function switchCategory(cat) {
        currentCategoryFilter = cat;
        document.querySelectorAll('#category-tabs .tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        const clickedBtn = Array.from(document.querySelectorAll('#category-tabs .tab-btn')).find(btn => 
            btn.getAttribute('onclick').includes(`'${cat}'`)
        );
        if (clickedBtn) clickedBtn.classList.add('active');

        renderChecklist();
    }

    function toggleTopic(id) {
        const checkbox = document.getElementById(`check-${id}`);
        localStorage.setItem(`topic_${id}`, checkbox.checked ? 'true' : 'false');
        updateProgressBar();
    }

    function loadChecklistState() {
        // State loaded dynamically inside renderChecklist
    }

    function updateProgressBar() {
        let completed = 0;
        grammarTopics.forEach(t => {
            if (localStorage.getItem(`topic_${t.id}`) === 'true') {
                completed++;
            }
        });

        const percent = Math.round((completed / grammarTopics.length) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-percent').textContent = percent + '%';
        document.getElementById('completed-count').textContent = completed;
    }

    // ── PRACTICE & QUIZ LOGIC ──
    function expandTopic(id, event) {
        if (event.target.closest('.checklist-checkbox') || 
            event.target.closest('.lang-switch-inline') ||
            event.target.closest('.checklist-checkbox-wrapper')) {
            return;
        }
        
        const card = document.getElementById(`item-${id}`);
        if (!card) return;
        
        const isExpanded = card.classList.contains('expanded');
        
        document.querySelectorAll('.checklist-item.expanded').forEach(el => {
            if (el.id !== `item-${id}`) {
                el.classList.remove('expanded');
                const innerArea = el.querySelector('.practice-area');
                if (innerArea) innerArea.style.display = 'none';
            }
        });
        
        if (isExpanded) {
            card.classList.remove('expanded');
            const practiceArea = card.querySelector('.practice-area');
            if (practiceArea) practiceArea.style.display = 'none';
        } else {
            card.classList.add('expanded');
            
            let practiceArea = card.querySelector('.practice-area');
            if (!practiceArea) {
                practiceArea = document.createElement('div');
                practiceArea.className = 'practice-area';
                practiceArea.id = `practice-${id}`;
                practiceArea.addEventListener('click', (e) => e.stopPropagation());
                card.querySelector('.checklist-content').appendChild(practiceArea);
            }
            practiceArea.style.display = 'block';
            
            renderTopicPractice(id);
            
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 150);
        }
    }

    function renderTopicPractice(id) {
        const area = document.getElementById(`practice-${id}`);
        if (!area) return;
        
        const data = topicQuizData[id];
        if (!data) {
            area.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">Geen extra oefeningen beschikbaar voor dit onderwerp.</div>';
            return;
        }
        
        if (!quizState[id]) {
            quizState[id] = {
                currentQuestionIdx: 0,
                correctCount: 0,
                answered: false,
                selectedOption: null
            };
        }
        
        const state = quizState[id];
        
        let html = `
            <div class="practice-title">💡 Voorbeelden &amp; Oefeningen</div>
            <div class="examples-wrap">
                ${data.examples.map(ex => `
                    <div class="example-item">
                        <span class="example-text">${ex}</span>
                        <button class="speech-btn-inline" onclick="event.stopPropagation(); speakText('${ex.replace(/'/g, "\\'")}')">🔊</button>
                    </div>
                `).join('')}
            </div>
        `;
        
        if (state.currentQuestionIdx < data.questions.length) {
            const q = data.questions[state.currentQuestionIdx];
            html += `
                <div class="quiz-card">
                    <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-secondary); margin-bottom:8px; font-weight:800;">
                        <span>VRAAG ${state.currentQuestionIdx + 1} VAN ${data.questions.length}</span>
                        <span>Score: ${state.correctCount}/${state.currentQuestionIdx}</span>
                    </div>
                    <div class="quiz-q">${q.q}</div>
                    <div class="quiz-opts">
                        ${q.o.map((opt, oIdx) => {
                            let cls = '';
                            if (state.answered) {
                                if (oIdx === q.c) cls = 'correct';
                                else if (state.selectedOption === oIdx) cls = 'incorrect';
                            }
                            return `<button class="quiz-opt ${cls}" onclick="answerQuizQuestion(${id}, ${oIdx})" ${state.answered ? 'disabled' : ''}>${opt}</button>`;
                        }).join('')}
                    </div>
                    
                    <div class="quiz-fb" id="quiz-fb-${id}" style="display:${state.answered ? 'block' : 'none'};"></div>
                    
                    ${state.answered ? `
                        <div style="text-align:right;">
                            <button class="quiz-btn" onclick="nextQuizQuestion(${id})">
                                ${state.currentQuestionIdx === data.questions.length - 1 ? 'Afronden' : 'Volgende vraag →'}
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        } else {
            const pass = state.correctCount === data.questions.length;
            html += `
                <div class="quiz-card quiz-score-view">
                    <h4>Quiz Afgerond! 🎉</h4>
                    <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:12px;">
                        Je scoorde <strong>${state.correctCount} van de ${data.questions.length}</strong> goed.
                    </p>
                    ${pass ? `
                        <div style="color:var(--accent-green); font-weight:800; font-size:0.85rem; margin-bottom:12px;">
                            Geweldig! Je beheerst dit onderwerp volledig! 🌟
                        </div>
                    ` : `
                        <div style="color:var(--accent-orange); font-weight:800; font-size:0.85rem; margin-bottom:12px;">
                            Tip: Oefen nog eens om een perfecte score te halen!
                        </div>
                    `}
                    <div style="display:flex; gap:10px; justify-content:center;">
                        <button class="quiz-btn" style="background:var(--bg-card-light); border:1px solid var(--border-color); color:var(--text-primary);" onclick="resetQuizState(${id})">
                            Opnieuw Oefenen
                        </button>
                    </div>
                </div>
            `;
            
            if (pass) {
                const checkbox = document.getElementById(`check-${id}`);
                if (checkbox && !checkbox.checked) {
                    checkbox.checked = true;
                    toggleTopic(id);
                }
            }
        }
        
        area.innerHTML = html;
        
        if (state.answered) {
            const q = data.questions[state.currentQuestionIdx];
            const isCorrect = state.selectedOption === q.c;
            const fbEl = document.getElementById(`quiz-fb-${id}`);
            if (fbEl) {
                fbEl.className = `quiz-fb ${isCorrect ? 'correct' : 'incorrect'}`;
                fbEl.innerHTML = isCorrect ? `🎉 Correct! ${q.e}` : `❌ Helaas, dat is niet juist. ${q.e}`;
                fbEl.style.display = 'block';
            }
        }
    }

    function answerQuizQuestion(id, optIdx) {
        const state = quizState[id];
        if (!state || state.answered) return;
        
        state.answered = true;
        state.selectedOption = optIdx;
        
        const data = topicQuizData[id];
        const q = data.questions[state.currentQuestionIdx];
        if (optIdx === q.c) {
            state.correctCount++;
        }
        
        renderTopicPractice(id);
    }

    function nextQuizQuestion(id) {
        const state = quizState[id];
        if (!state) return;
        
        state.currentQuestionIdx++;
        state.answered = false;
        state.selectedOption = null;
        
        renderTopicPractice(id);
    }

    function resetQuizState(id) {
        quizState[id] = {
            currentQuestionIdx: 0,
            correctCount: 0,
            answered: false,
            selectedOption: null
        };
        renderTopicPractice(id);
    }

    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'nl-NL';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
    }

    // Helper functions
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }
</script>

</body>
</html>
