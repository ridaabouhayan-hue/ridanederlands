<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Seconds — NT2 Spel</title>
    <meta name="description" content="Een interactief, klassikaal 30 Seconds-spel ontworpen voor digiborden in de NT2-les.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-accent: #8b5cf6;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        header {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 24px;
            border-radius: var(--radius-md);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .logo-text h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ── SPEELMODI ── */
        .modes-container {
            display: flex;
            gap: 12px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .mode-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .mode-card.active {
            background: var(--card-accent);
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            color: #fff;
            transform: scale(1.05);
        }

        .mode-card.active[data-mode="uitbeelden"] {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
        }
        .mode-card.active[data-mode="omschrijven"] {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .mode-card.active[data-mode="ja-nee"] {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            border-color: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .mode-emoji {
            font-size: 1.4rem;
        }

        /* ── MAIN CONTENT ── */
        .main-grid {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 24px;
            align-items: stretch;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── TEAM COLUMNS ── */
        .team-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            flex: 1;
        }

        .team-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--card-accent);
            opacity: 0.7;
        }

        #team1-card::before { background: linear-gradient(90deg, #ec4899, #8b5cf6); }
        #team2-card::before { background: linear-gradient(90deg, #3b82f6, #10b981); }

        .team-header {
            width: 100%;
            margin-bottom: 20px;
        }

        .team-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-light);
            border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            cursor: pointer;
            display: inline-block;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: var(--transition);
            outline: none;
        }

        .team-name:hover {
            border-bottom-color: var(--text-light);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .team-name:focus {
            border-bottom-style: solid;
            border-bottom-color: var(--card-accent);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .edit-hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
        }

        .score-display {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin: 20px 0;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            font-variant-numeric: tabular-nums;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-display.bump {
            transform: scale(1.15);
        }

        .score-buttons {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: center;
        }

        .score-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 2.2rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }

        .score-btn:active {
            transform: scale(0.9);
        }

        .btn-plus {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .btn-plus:hover {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            filter: brightness(1.1);
        }

        .btn-minus {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .btn-minus:hover {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            filter: brightness(1.1);
        }

        /* ── RULES CARD (LEFT BOTTOM) ── */
        .rules-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: var(--transition);
            text-align: left;
        }

        .rules-card h3 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
        }

        .rules-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rules-list li {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .rule-do {
            color: #a7f3d0; /* Soft green */
        }

        .rule-dont {
            color: #fca5a5; /* Soft red */
        }

        /* ── TIMER COLUMN (MIDDLE) ── */
        .timer-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .timer-ring-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
        }

        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 10;
        }

        .timer-circle-progress {
            fill: none;
            stroke: url(#timerGradient);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 628; /* 2 * PI * 100 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear;
        }

        .timer-text {
            font-size: 4.5rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            z-index: 10;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .timer-warning {
            animation: warningPulse 0.5s infinite alternate;
        }

        @keyframes warningPulse {
            0% {
                transform: scale(1);
                color: #ff4d4d;
                filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4));
            }
            100% {
                transform: scale(1.08);
                color: #ff3333;
                filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.8));
            }
        }

        /* ── GEHEIM WOORD VAK ── */
        .secret-word-container {
            width: 100%;
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .secret-word-container label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .secret-word-input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .secret-word-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 10px 40px 10px 16px;
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.3rem;
            text-align: center;
            outline: none;
            transition: var(--transition);
        }

        .secret-word-input:focus {
            border-color: var(--card-accent);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
            background: rgba(0, 0, 0, 0.35);
        }

        .clear-word-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .clear-word-btn:hover {
            color: #fff;
        }

        /* ── TIMER CONTROLS (COMPACT) ── */
        .timer-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        .primary-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-control {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: var(--transition);
        }

        .btn-control:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-start:hover {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
            filter: brightness(1.08);
        }

        .btn-pause {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-pause:hover {
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.35);
            filter: brightness(1.08);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-light);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-extra-time {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            font-size: 0.95rem;
            color: white;
            font-weight: 800;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: var(--transition);
        }

        .btn-extra-time:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            filter: brightness(1.08);
        }

        /* ── BOTTOM SETTINGS PANEL ── */
        .bottom-panel {
            max-width: 1400px;
            width: 100%;
            margin: 24px auto 0;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .timer-presets {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preset-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .preset-btn.active {
            background: var(--card-accent);
            border-color: #a78bfa;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .custom-time-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .custom-time-input input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 1rem;
            width: 50px;
            text-align: center;
        }

        .custom-time-input input::-webkit-inner-spin-button,
        .custom-time-input input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .custom-time-input span {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .global-reset-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .global-reset-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
        }

        /* ── FLASH EFFECTS ── */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .flash-warning {
            box-shadow: inset 0 0 100px rgba(239, 68, 68, 0.4);
        }

        .flash-end {
            background: rgba(239, 68, 68, 0.25);
            box-shadow: inset 0 0 150px rgba(239, 68, 68, 0.7);
        }

        /* ── RESPONSIVE DESIGN ── */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .timer-card {
                order: -1; /* Place timer on top on tablet/mobile */
                min-height: auto;
            }
            .team-card {
                padding: 24px;
            }
            .score-display {
                font-size: 6rem;
            }
            .bottom-panel {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            header {
                flex-direction: column;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Flits effect voor waarschuwing en einde -->
    <div id="flash-overlay" class="flash-overlay"></div>

    <header>
        <div class="header-title-area">
            <a href="index.html" class="back-btn" id="back-btn">
                <span>←</span> Dashboard
            </a>
            <div class="logo-text">
                <h1>⏱️ 30 Seconds</h1>
                <p>NT2 Klassikaal Digibord Spel</p>
            </div>
        </div>

        <div class="modes-container">
            <div class="mode-card active" data-mode="uitbeelden">
                <span class="mode-emoji">🎭</span>
                <span>Uitbeelden</span>
            </div>
            <div class="mode-card" data-mode="omschrijven">
                <span class="mode-emoji">🗣️</span>
                <span>Omschrijven</span>
            </div>
            <div class="mode-card" data-mode="ja-nee">
                <span class="mode-emoji">❓</span>
                <span>Ja/Nee</span>
            </div>
        </div>
    </header>

    <main class="main-grid">
        <!-- LINKS: TEAM 1 & RULES -->
        <div class="left-column">
            <!-- TEAM 1 -->
            <section class="team-card" id="team1-card">
                <div class="team-header">
                    <span class="team-name" contenteditable="true" id="team1-name" spellcheck="false">Team 1</span>
                    <span class="edit-hint">Klik om naam te wijzigen</span>
                </div>
                <div class="score-display" id="team1-score">0</div>
                <div class="score-buttons">
                    <button class="score-btn btn-minus" id="team1-minus" aria-label="Team 1 punt eraf">-</button>
                    <button class="score-btn btn-plus" id="team1-plus" aria-label="Team 1 punt erbij">+</button>
                </div>
            </section>

            <!-- REGELBOX -->
            <div class="rules-card" id="rules-card">
                <h3>📋 Spelregels</h3>
                <div id="rules-content">
                    <!-- Rules injected dynamically -->
                </div>
            </div>
        </div>

        <!-- TIMER / MIDDEN -->
        <section class="timer-card">
            <div class="timer-ring-container">
                <svg class="timer-svg">
                    <defs>
                        <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f97316" />
                            <stop offset="100%" stop-color="#ec4899" />
                        </linearGradient>
                    </defs>
                    <circle class="timer-circle-bg" cx="110" cy="110" r="100" />
                    <circle class="timer-circle-progress" id="timer-progress" cx="110" cy="110" r="100" />
                </svg>
                <div class="timer-text" id="timer-display">30</div>
            </div>

            <!-- GEHEIM WOORD VAK -->
            <div class="secret-word-container">
                <label for="secret-word-input">🔍 Geheim Woord:</label>
                <div class="secret-word-input-wrapper">
                    <input type="text" id="secret-word-input" class="secret-word-input" placeholder="Typ het woord hier..." spellcheck="false" autocomplete="off">
                    <button id="clear-word-btn" class="clear-word-btn" title="Wis woord">✖</button>
                </div>
            </div>

            <div class="timer-controls">
                <div class="primary-controls">
                    <button class="btn-control btn-start" id="start-pause-btn">
                        <span id="start-pause-icon">▶️</span> <span id="start-pause-text">Start</span>
                    </button>
                    <button class="btn-control btn-reset" id="reset-btn">
                        <span>🔄</span> Reset
                    </button>
                </div>
                <button class="btn-extra-time" id="extra-time-btn">
                    <span>⚡</span> +10 sec extra tijd
                </button>
            </div>
        </section>

        <!-- TEAM 2 -->
        <section class="team-card" id="team2-card">
            <div class="team-header">
                <span class="team-name" contenteditable="true" id="team2-name" spellcheck="false">Team 2</span>
                <span class="edit-hint">Klik om naam te wijzigen</span>
            </div>
            <div class="score-display" id="team2-score">0</div>
            <div class="score-buttons">
                <button class="score-btn btn-minus" id="team2-minus" aria-label="Team 2 punt eraf">-</button>
                <button class="score-btn btn-plus" id="team2-plus" aria-label="Team 2 punt erbij">+</button>
            </div>
        </section>
    </main>

    <!-- INSTELLINGEN & OPTIES -->
    <footer class="bottom-panel">
        <div class="timer-presets">
            <span class="preset-label">Timer:</span>
            <button class="preset-btn" data-time="15">15s</button>
            <button class="preset-btn active" data-time="30">30s</button>
            <button class="preset-btn" data-time="45">45s</button>
            <button class="preset-btn" data-time="60">60s</button>
            
            <div class="custom-time-input">
                <input type="number" id="custom-time-val" min="5" max="300" value="30">
                <span>sec</span>
            </div>
        </div>

        <button class="global-reset-btn" id="global-reset-btn">
            <span>🗑️</span> Reset Spel & Scores
        </button>
    </footer>

    <script>
        // ── SPELSTATE ──
        let defaultTime = 30; // in seconden
        let remainingTime = 30;
        let isRunning = false;
        let timerInterval = null;
        let lastTimeFrame = 0;
        
        let team1Score = 0;
        let team2Score = 0;

        // Spelregels data
        const rules = {
            'uitbeelden': `
                <ul class="rules-list">
                    <li class="rule-dont">❌ Niet praten en geen geluid maken.</li>
                    <li class="rule-dont">❌ Geen letters schrijven in de lucht.</li>
                    <li class="rule-do">✅ Gebruik je handen, voeten en gezicht.</li>
                    <li class="rule-do">✅ Wijs naar dingen in het klaslokaal.</li>
                </ul>
            `,
            'omschrijven': `
                <ul class="rules-list">
                    <li class="rule-dont">❌ Noem het woord (of een deel ervan) niet.</li>
                    <li class="rule-dont">❌ Vertaal het woord niet naar een andere taal.</li>
                    <li class="rule-do">✅ Vertel wat het is of wat je ermee doet.</li>
                    <li class="rule-do">✅ Gebruik synoniemen of tegenstellingen.</li>
                </ul>
            `,
            'ja-nee': `
                <ul class="rules-list">
                    <li class="rule-dont">❌ Het team mag geen open vragen stellen.</li>
                    <li class="rule-dont">❌ De speler mag geen extra uitleg geven.</li>
                    <li class="rule-do">✅ De speler antwoordt alleen met "Ja" of "Nee".</li>
                    <li class="rule-do">✅ Het team stelt slimme hulpvragen.</li>
                </ul>
            `
        };

        // Web Audio API context
        let audioCtx = null;
        let tickTimeout = null;

        // DOM Elementen
        const team1ScoreEl = document.getElementById('team1-score');
        const team2ScoreEl = document.getElementById('team2-score');
        const timerDisplayEl = document.getElementById('timer-display');
        const timerProgressEl = document.getElementById('timer-progress');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startPauseIcon = document.getElementById('start-pause-icon');
        const startPauseText = document.getElementById('start-pause-text');
        const resetBtn = document.getElementById('reset-btn');
        const extraTimeBtn = document.getElementById('extra-time-btn');
        const globalResetBtn = document.getElementById('global-reset-btn');
        const customTimeVal = document.getElementById('custom-time-val');
        const flashOverlay = document.getElementById('flash-overlay');
        const secretWordInput = document.getElementById('secret-word-input');
        const clearWordBtn = document.getElementById('clear-word-btn');
        const rulesContentEl = document.getElementById('rules-content');

        // SVG Cirkel omtrek (2 * PI * r, r=100 -> ~628)
        const ringCircumference = 2 * Math.PI * 100; 
        timerProgressEl.style.strokeDasharray = ringCircumference;
        timerProgressEl.style.strokeDashoffset = 0;

        // ── AUDIO FUNCTIONS (Web Audio API) ──
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Tactiele klikgeluid
        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) { console.error(e); }
        }

        // Tikkend geluid voor de klok
        function playTickSound(frequency) {
            initAudio();
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                // Korte, percussieve tik
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) { console.error(e); }
        }

        // Eindzoemer
        function playBuzzer() {
            initAudio();
            if (!audioCtx) return;
            try {
                const duration = 1.6;
                const now = audioCtx.currentTime;
                
                // Drie oscillators voor een dikke, disharmonische buzzer toon
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const osc3 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(140, now);
                
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(142.5, now); // Zweving (chorus-effect)
                
                osc3.type = 'sawtooth';
                osc3.frequency.setValueAtTime(280, now); // Octaaf hoger
                
                osc1.connect(gain);
                osc2.connect(gain);
                osc3.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.setValueAtTime(0.3, now + duration - 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                
                osc1.start(now);
                osc2.start(now);
                osc3.start(now);
                
                osc1.stop(now + duration);
                osc2.stop(now + duration);
                osc3.stop(now + duration);
            } catch (e) { console.error(e); }
        }

        // ── TICK SCHEDULER (Dynamische versnelling) ──
        function scheduleNextTick() {
            if (!isRunning || remainingTime <= 0) return;

            // Pitch stijgt naarmate de tijd afloopt (van 700Hz naar ~1200Hz)
            let freq = 700;
            if (remainingTime <= 10) {
                freq = 700 + (10 - remainingTime) * 50;
            }
            playTickSound(freq);

            // Bepaal de pauze tussen de tikken (versnelling)
            let delay = 1000; // Standaard 1 tik per seconde
            
            if (remainingTime <= 10 && remainingTime > 5) {
                // Versnelt van 1000ms naar 500ms
                let pct = (remainingTime - 5) / 5; // 1 down to 0
                delay = 450 + pct * 550;
            } else if (remainingTime <= 5) {
                // Versnelt snel van 450ms naar 150ms
                let pct = Math.max(0, remainingTime) / 5; // 1 down to 0
                delay = 140 + pct * 310;
            }

            tickTimeout = setTimeout(scheduleNextTick, delay);
        }

        // ── TIMER LOGICA ──
        function updateDisplay() {
            // Rond af naar boven voor weergave van hele seconden
            const displaySecs = Math.ceil(remainingTime);
            timerDisplayEl.textContent = displaySecs;

            // Update voortgangscirkel
            const progressPct = remainingTime / defaultTime;
            const offset = ringCircumference - (progressPct * ringCircumference);
            timerProgressEl.style.strokeDashoffset = Math.max(0, Math.min(ringCircumference, offset));

            // Visuele waarschuwing in de laatste 5 seconden
            if (remainingTime <= 5 && remainingTime > 0) {
                timerDisplayEl.classList.add('timer-warning');
                // Zacht rood pulserend scherm-effect
                flashOverlay.className = "flash-overlay flash-warning";
                flashOverlay.style.opacity = (1 - (remainingTime % 1)).toFixed(2) * 0.4;
            } else {
                timerDisplayEl.classList.remove('timer-warning');
                flashOverlay.style.opacity = 0;
            }
        }

        function timerLoop(timestamp) {
            if (!isRunning) return;

            if (!lastTimeFrame) lastTimeFrame = timestamp;
            const elapsed = (timestamp - lastTimeFrame) / 1000;
            lastTimeFrame = timestamp;

            remainingTime -= elapsed;

            if (remainingTime <= 0) {
                remainingTime = 0;
                isRunning = false;
                updateDisplay();
                playBuzzer();
                
                // Flits effect bij einde
                flashOverlay.className = "flash-overlay flash-end";
                flashOverlay.style.opacity = 1;
                setTimeout(() => {
                    flashOverlay.style.opacity = 0;
                }, 1500);

                setStartButtonState(false);
                return;
            }

            updateDisplay();
            timerInterval = requestAnimationFrame(timerLoop);
        }

        function startTimer() {
            initAudio();
            isRunning = true;
            lastTimeFrame = performance.now();
            timerInterval = requestAnimationFrame(timerLoop);
            scheduleNextTick();
            setStartButtonState(true);
        }

        function pauseTimer() {
            isRunning = false;
            cancelAnimationFrame(timerInterval);
            clearTimeout(tickTimeout);
            setStartButtonState(false);
        }

        // Knop states updaten
        function setStartButtonState(running) {
            if (running) {
                startPauseBtn.className = "btn-control btn-pause";
                startPauseIcon.textContent = "⏸️";
                startPauseText.textContent = "Pauze";
            } else {
                startPauseBtn.className = "btn-control btn-start";
                startPauseIcon.textContent = "▶️";
                startPauseText.textContent = "Start";
            }
        }

        // Spelregels box updaten
        function updateRules(mode) {
            rulesContentEl.innerHTML = rules[mode] || '';
        }

        // ── EVENT LISTENERS ──

        // Start / Pauze
        startPauseBtn.addEventListener('click', () => {
            playClickSound();
            if (isRunning) {
                pauseTimer();
            } else {
                if (remainingTime <= 0) {
                    // Automatische reset bij start vanaf 0
                    remainingTime = defaultTime;
                }
                startTimer();
            }
        });

        // Reset Timer
        resetBtn.addEventListener('click', () => {
            playClickSound();
            pauseTimer();
            remainingTime = defaultTime;
            updateDisplay();
        });

        // Extra Tijd (+10s)
        extraTimeBtn.addEventListener('click', () => {
            playClickSound();
            remainingTime += 10;
            // Mag de maximale default time niet overschrijden voor de voortgangscirkel
            if (remainingTime > defaultTime) {
                defaultTime = Math.ceil(remainingTime);
            }
            updateDisplay();

            // Als de ticker al liep maar door extra tijd uit de kritieke zone is, herstart ticker scheduler
            if (isRunning) {
                clearTimeout(tickTimeout);
                scheduleNextTick();
            }
        });

        // Scores bewerken
        function animateScore(el) {
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 150);
        }

        document.getElementById('team1-plus').addEventListener('click', () => {
            playClickSound();
            team1Score++;
            team1ScoreEl.textContent = team1Score;
            animateScore(team1ScoreEl);
        });

        document.getElementById('team1-minus').addEventListener('click', () => {
            playClickSound();
            if (team1Score > 0) {
                team1Score--;
                team1ScoreEl.textContent = team1Score;
                animateScore(team1ScoreEl);
            }
        });

        document.getElementById('team2-plus').addEventListener('click', () => {
            playClickSound();
            team2Score++;
            team2ScoreEl.textContent = team2Score;
            animateScore(team2ScoreEl);
        });

        document.getElementById('team2-minus').addEventListener('click', () => {
            playClickSound();
            if (team2Score > 0) {
                team2Score--;
                team2ScoreEl.textContent = team2Score;
                animateScore(team2ScoreEl);
            }
        });

        // Speelmodi knoppen
        document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('click', () => {
                playClickSound();
                document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                
                const mode = card.dataset.mode;
                updateRules(mode);
            });
        });

        // Timer presets (15s, 30s, 45s, 60s)
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playClickSound();
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const timeSecs = parseInt(btn.dataset.time, 10);
                defaultTime = timeSecs;
                customTimeVal.value = timeSecs;
                
                pauseTimer();
                remainingTime = defaultTime;
                updateDisplay();
            });
        });

        // Custom time input handmatig
        customTimeVal.addEventListener('change', () => {
            let val = parseInt(customTimeVal.value, 10);
            if (isNaN(val) || val < 5) val = 5;
            if (val > 300) val = 300;
            customTimeVal.value = val;

            // Deactiveer alle preset-knoppen als de waarde afwijkt
            document.querySelectorAll('.preset-btn').forEach(b => {
                if (parseInt(b.dataset.time, 10) === val) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });

            defaultTime = val;
            pauseTimer();
            remainingTime = defaultTime;
            updateDisplay();
        });

        // Teamnaam contenteditable Enter key afvangen (focus verliezen)
        document.querySelectorAll('.team-name').forEach(nameEl => {
            nameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nameEl.blur();
                }
            });
            nameEl.addEventListener('blur', () => {
                // Strip eventuele HTML-tags die per ongeluk zijn ingevoerd
                nameEl.textContent = nameEl.textContent.trim().substring(0, 30) || (nameEl.id === 'team1-name' ? 'Team 1' : 'Team 2');
            });
        });

        // Geheim woord input interacties (wis knop tonen)
        secretWordInput.addEventListener('input', () => {
            if (secretWordInput.value.length > 0) {
                clearWordBtn.style.display = 'flex';
            } else {
                clearWordBtn.style.display = 'none';
            }
        });

        clearWordBtn.addEventListener('click', () => {
            playClickSound();
            secretWordInput.value = '';
            clearWordBtn.style.display = 'none';
            secretWordInput.focus();
        });

        // Globaal resetten
        globalResetBtn.addEventListener('click', () => {
            playClickSound();
            if (confirm('Weet je zeker dat je alle scores en teamnamen wilt resetten?')) {
                pauseTimer();
                
                // Reset scores
                team1Score = 0;
                team2Score = 0;
                team1ScoreEl.textContent = 0;
                team2ScoreEl.textContent = 0;
                
                // Reset namen
                document.getElementById('team1-name').textContent = 'Team 1';
                document.getElementById('team2-name').textContent = 'Team 2';
                
                // Reset timer naar standaard (30s)
                defaultTime = 30;
                remainingTime = 30;
                customTimeVal.value = 30;
                
                document.querySelectorAll('.preset-btn').forEach(b => {
                    if (b.dataset.time === "30") b.classList.add('active');
                    else b.classList.remove('active');
                });

                // Reset woord
                secretWordInput.value = '';
                clearWordBtn.style.display = 'none';

                updateDisplay();
            }
        });

        // Eerste interactie om Audio Context te activeren (voor browsers met autoplay-block)
        document.addEventListener('click', () => {
            initAudio();
        }, { once: true });

        // Initiële weergave & spelregels laden
        updateDisplay();
        updateRules('uitbeelden');
    </script>
</body>
</html>
